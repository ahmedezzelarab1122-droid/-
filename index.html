<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مصروفات كيان">
<meta name="theme-color" content="#b8860b">
<link rel="manifest" href="/manifest.json">
<title>مصروفات كيان</title>
<style>
:root{
  --g:#b8860b;--gl:#f5f0e0;--gd:#8a6000;
  --b:#1d4ed8;--bl:#dbeafe;
  --r:#dc2626;--rl:#fee2e2;
  --a:#d97706;--al:#fef3c7;
  --pu:#7c3aed;--pul:#ede9fe;
  --n1:#f8fafc;--n2:#f1f5f9;--n3:#e2e8f0;
  --n4:#94a3b8;--n5:#64748b;--n9:#0f172a;
  --brown:#3a210a;--gold:#b8860b;--gold2:#d4a843;
}
[data-theme="dark"]{
  --n1:#111;--n2:#1e1e1e;--n3:#2a2a2a;
  --n4:#777;--n5:#aaa;--n9:#f0f0f0;
  --g:#d4a843;--gl:#2a1f08;--gd:#f0c050;
}
[data-theme="dark"] body{background:#111}
[data-theme="dark"] .topbar,[data-theme="dark"] .tabs,
[data-theme="dark"] .card,[data-theme="dark"] .stat,
[data-theme="dark"] .sup-card,[data-theme="dark"] .lc{
  background:#1e1e1e!important;border-color:#2a2a2a!important;
}
[data-theme="dark"] input,[data-theme="dark"] select,[data-theme="dark"] textarea{
  background:#1e1e1e;border-color:#2a2a2a;color:#f0f0f0;
}
[data-theme="dark"] .lw{background:linear-gradient(135deg,#1a0f05,#3a210a,#5a3315)}
[data-theme="dark"] .tab{color:#555}
[data-theme="dark"] .tab.on{color:var(--gold2);border-bottom-color:var(--gold2)}
[data-theme="dark"] .tbox{background:var(--gold)}
[data-theme="dark"] .ok{background:#2a1f08}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Segoe UI',Tahoma,Arial,sans-serif;direction:rtl;background:var(--n1);color:var(--n9);font-size:14px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
/* SPLASH */
#splash{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(160deg,#3a210a 0%,#5a3315 50%,#b8860b 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.6s}
.splash-logo{width:160px;height:160px;object-fit:contain;margin-bottom:20px;animation:pulse 2s ease-in-out infinite}
.splash-title{color:#d4a843;font-size:22px;font-weight:700;margin-bottom:5px}
.splash-sub{color:#d4a84399;font-size:13px}
.splash-bar{margin-top:40px;width:50px;height:4px;background:#d4a84433;border-radius:2px;overflow:hidden}
.splash-fill{width:100%;height:100%;background:#d4a843;border-radius:2px;animation:load 1.5s ease-in-out infinite}
/* LOGIN */
.lw{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#3a210a,#5a3315,#b8860b);padding:20px}
.lc{background:#fff;border-radius:20px;padding:2rem 1.5rem;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:fadein .4s ease}
.logo{text-align:center;margin-bottom:22px}
.logo img{width:130px;height:130px;object-fit:contain;margin-bottom:10px}
.logo h1{font-size:17px;font-weight:700;color:var(--brown)}
.logo p{font-size:12px;color:var(--n4);margin-top:3px}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
.rb{padding:13px;border:2px solid var(--n3);border-radius:11px;cursor:pointer;text-align:center;background:#fff;font-family:inherit;transition:.15s}
.rb:hover,.rb.sel{border-color:var(--gold);background:var(--gl)}
.rb svg{display:block;margin:0 auto 5px}
.rb span{font-size:12px;font-weight:600;color:var(--n5)}
.rb.sel span{color:var(--gold)}
/* APP */
.topbar{background:#fff;border-bottom:1px solid var(--n3);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.tb-logo{width:34px;height:34px;border-radius:8px;background:var(--brown);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.tb-logo img{width:28px;height:28px;object-fit:contain}
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--n3);padding:0 10px;position:sticky;top:52px;z-index:50;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 13px;border:none;background:none;font-family:inherit;font-size:12px;color:var(--n4);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:.15s}
.tab.on{color:var(--gold);border-bottom-color:var(--gold);font-weight:600}
.pane{display:none;padding:12px;max-width:620px;margin:0 auto;padding-bottom:24px}
.pane.on{display:block;animation:fadein .3s ease}
.card{background:#fff;border:1px solid var(--n3);border-radius:12px;padding:13px 15px;margin-bottom:11px}
.ctitle{font-size:13px;font-weight:600;color:var(--n5);margin-bottom:11px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px}
.stat{background:#fff;border:1px solid var(--n3);border-radius:10px;padding:11px 13px}
.sl{font-size:11px;color:var(--n4);margin-bottom:2px}
.sv{font-size:18px;font-weight:700}
label.lbl{font-size:12px;font-weight:500;color:var(--n5);display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:8px 11px;border:1.5px solid var(--n3);border-radius:7px;font-size:13px;font-family:inherit;color:var(--n9);background:#fff;outline:none;direction:rtl;box-sizing:border-box;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:none;min-height:65px}
.fg{margin-bottom:9px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:inherit;width:100%;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--gold);color:#fff}
.btn.p:hover{background:var(--gd)}
.btn.s{background:var(--n2);color:var(--n5)}
.btn.d{background:var(--rl);color:var(--r);width:auto}
.btn.ex{background:#217346;color:#fff}
.brow{display:flex;gap:7px;margin-top:8px}
.brow .btn{flex:1}
.drop{border:2px dashed var(--n3);border-radius:10px;padding:22px 14px;text-align:center;cursor:pointer;background:var(--n1);margin-bottom:9px;transition:.15s}
.drop:hover{border-color:var(--gold);background:var(--gl)}
.drop svg{margin:0 auto 7px;display:block}
.iprev{width:100%;border-radius:8px;max-height:160px;object-fit:cover;margin-bottom:9px;display:none;border:1px solid var(--n3)}
.spin{width:28px;height:28px;border:3px solid var(--n3);border-top-color:var(--gold);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.ldg{text-align:center;padding:3rem;display:none}
.ok{background:var(--gl);border-radius:7px;padding:9px 12px;font-size:12px;color:var(--gd);font-weight:500;margin-bottom:9px;display:flex;align-items:center;gap:6px}
.err{background:var(--rl);border-radius:7px;padding:9px 12px;font-size:12px;color:var(--r);margin-bottom:8px;display:none}
.badge{display:inline-block;padding:2px 8px;border-radius:14px;font-size:11px;font-weight:600}
.bp{background:#dcfce7;color:#166534}.bt{background:var(--bl);color:var(--b)}.bo{background:var(--n2);color:var(--n5)}.bc{background:var(--al);color:var(--a)}.btr{background:var(--pul);color:var(--pu)}
.pbar{height:5px;background:var(--n2);border-radius:3px;overflow:hidden;margin-top:5px}
.pf{height:100%;border-radius:3px}
.fr{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--n2);font-size:13px}
.fr:last-child{border-bottom:none}
.tbox{background:var(--gold);color:#fff;border-radius:9px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:9px}
.txr{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--n2)}
.txr:last-child{border-bottom:none}
.av{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.ftabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.ftab{padding:4px 11px;border-radius:14px;border:1.5px solid var(--n3);background:#fff;font-family:inherit;font-size:11px;cursor:pointer;transition:.1s}
.ftab.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.srow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--n2)}
.srow:last-child{border-bottom:none}
.xbtn{border:none;background:none;color:var(--n4);cursor:pointer;font-size:16px;padding:3px}
.xbtn:hover{color:var(--r)}
.addrow{display:flex;gap:6px;margin-top:9px}
.addrow input{flex:1}
.addrow .btn{width:auto;padding:8px 11px}
.empty{text-align:center;padding:2.5rem;color:var(--n4);font-size:13px}
.sep{height:1px;background:var(--n2);margin:8px 0}
.chip{background:var(--n2);border-radius:6px;padding:6px 9px;margin-bottom:5px}
.sup-card{background:#fff;border:1px solid var(--n3);border-radius:11px;padding:11px 13px;margin-bottom:9px}
.shdr{font-size:11px;font-weight:600;color:var(--n4);margin-bottom:7px;margin-top:3px}
.theme-btn{border:1px solid var(--n3);border-radius:7px;padding:5px 8px;background:none;cursor:pointer;font-size:15px;line-height:1}
.install-btn{display:none;border:1px solid var(--gold);border-radius:7px;padding:5px 9px;background:#b8860b22;font-size:11px;color:var(--gold);cursor:pointer;font-family:inherit;align-items:center;gap:4px}
/* iOS banner */
#ios-banner{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--brown);color:#fff;padding:12px 16px;z-index:998;direction:rtl}
</style>
</head>

<script>
const COLORS=['#b8860b','#1d4ed8','#9333ea','#0a7c5c','#dc2626','#0891b2'];
let DB={supervisors:[],projects:[],entries:[]};
let CU=null,ROLE=null,SR=null;
let imgB64=null,imgSrc=null,parsed=null,fType='all';

async function api(path,method='GET',body=null){
  const opts={method,headers:{'Content-Type':'application/json'}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(path,opts);
  return r.json();
}

function fmt(n){return Number(n||0).toLocaleString('ar-SA');}
function today(){return new Date().toISOString().split('T')[0];}
function tl(t){return t==='petty'?'نثرية':t==='tax'?'ضريبية':'أخرى';}
function pl(p){return p==='cash'?'كاش':'تحويل';}
function tb(t){return `<span class="badge b${t==='petty'?'p':t==='tax'?'t':'o'}">${tl(t)}</span>`;}
function pb(p){return `<span class="badge b${p==='cash'?'c':'tr'}">${pl(p)}</span>`;}
function gs(id){return DB.entries.filter(e=>e.supId==id).reduce((a,e)=>a+(e.total||0),0);}
function gn(id){return DB.supervisors.find(s=>s.id==id)?.name||'—';}
function gc(i){return COLORS[i%COLORS.length];}

// THEME
function initTheme(){
  const saved=localStorage.getItem('kayan_theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  setTheme(saved);
}
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('kayan_theme',t);
  const btn=document.getElementById('theme-btn');
  if(btn)btn.textContent=t==='dark'?'☀️':'🌙';
}
function toggleTheme(){
  setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
}

// SPLASH
window.addEventListener('load',()=>{
  setTimeout(()=>{
    const s=document.getElementById('splash');
    if(s){s.style.opacity='0';setTimeout(()=>s.remove(),600);}
  },1800);
});

// PWA INSTALL
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;
  const btn=document.getElementById('install-btn');
  if(btn)btn.style.display='inline-flex';
});
function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(()=>{
      deferredPrompt=null;
      const btn=document.getElementById('install-btn');
      if(btn)btn.style.display='none';
    });
  }
}

// iOS BANNER
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
if(isIOS&&!window.navigator.standalone&&!localStorage.getItem('ios_dismissed')){
  setTimeout(()=>document.getElementById('ios-banner').style.display='block',3000);
}


function showApp(){{
  document.getElementById('lview').style.display='none';
  document.getElementById('aview').style.display='block';
  document.getElementById('tbname').textContent=CU.name;
  document.getElementById('tbrole').textContent=ROLE==='manager'?'مدير النظام':'مشرف';
  buildTabs();
  ROLE==='manager'?renderDash():renderSupHome();
}}

async function restoreSession(){{
  const saved = localStorage.getItem('kayan_session');
  if(!saved) return false;
  
  let sess;
  try{{sess = JSON.parse(saved);}}catch(e){{localStorage.removeItem('kayan_session');return false;}}
  
  if(!sess || !sess.pw || !sess.ROLE) {{localStorage.removeItem('kayan_session');return false;}}
  
  const body={{role:sess.ROLE, password:sess.pw}};
  if(sess.supId) body.supId = parseInt(sess.supId);
  
  const res = await api('/api/login','POST',body);
  if(!res || !res.ok) {{localStorage.removeItem('kayan_session');return false;}}
  
  CU = {{id:res.supId||0, name:res.name, budget:res.budget||0}};
  ROLE = res.role;
  return true;
}}

// LOGIN
async function initLogin(){
  try{DB=await api('/api/db');}catch(e){console.error(e);}
  document.getElementById('splash').style.opacity='0';
  setTimeout(()=>{
    document.getElementById('splash').style.display='none';
    document.getElementById('lview').style.display='flex';
  },600);
}

function selRole(r){
  SR=r;
  document.querySelectorAll('.rb').forEach(b=>b.classList.remove('sel'));
  document.getElementById('rb-'+(r==='supervisor'?'sup':'mgr')).classList.add('sel');
  const g=document.getElementById('sup-grp');
  if(r==='supervisor'){
    const s=document.getElementById('sup-sel');
    s.innerHTML='<option value="">اختر...</option>'+DB.supervisors.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');
    g.style.display='block';
  }else g.style.display='none';
}

async function doLogin(){
  const err=document.getElementById('lerr');
  const pw=document.getElementById('pw-inp').value;
  if(!SR){err.style.display='block';err.textContent='اختر صفتك أولاً';return;}
  if(!pw){err.style.display='block';err.textContent='أدخل كلمة المرور';return;}
  const body={role:SR,password:pw};
  if(SR==='supervisor'){
    const id=document.getElementById('sup-sel').value;
    if(!id){err.style.display='block';err.textContent='اختر اسمك';return;}
    body.supId=parseInt(id);
  }
  try{
    const res=await api('/api/login','POST',body);
    if(!res.ok){err.style.display='block';err.textContent=res.error||'كلمة المرور خاطئة';return;}
    err.style.display='none';
    CU={id:res.supId||0,name:res.name,budget:res.budget||0};
    ROLE=res.role;
    document.getElementById('lview').style.display='none';
    document.getElementById('aview').style.display='block';
    document.getElementById('tbname').textContent=CU.name;
    document.getElementById('tbrole').textContent=ROLE==='manager'?'مدير النظام':'مشرف';
    buildTabs();
    ROLE==='manager'?renderDash():renderSupHome();
  }catch(e){err.style.display='block';err.textContent='خطأ في الاتصال';}
}

function doLogout(){
  CU=null;ROLE=null;SR=null;
  document.getElementById('aview').style.display='none';
  document.getElementById('lview').style.display='flex';
  document.querySelectorAll('.rb').forEach(b=>b.classList.remove('sel'));
  document.getElementById('sup-grp').style.display='none';
  document.getElementById('pw-inp').value='';
  document.getElementById('lerr').style.display='none';
}

// TABS
const MGR_TABS=[['dash','لوحة التحكم'],['txns','المعاملات'],['reports','التقارير'],['setup','الإعداد'],['passwords','كلمات المرور']];
const SUP_TABS=[['sup-home','الرئيسية'],['sup-hist','سجلاتي'],['sup-bal','رصيدي']];
const RENDERS={dash:renderDash,txns:renderTxns,reports:renderReports,setup:renderSetup,passwords:renderPasswords,'sup-home':renderSupHome,'sup-hist':renderSupHist,'sup-bal':renderSupBal};

function buildTabs(){
  const items=ROLE==='manager'?MGR_TABS:SUP_TABS;
  document.getElementById('tabs').innerHTML=items.map(([id,lbl],i)=>
    `<button class="tab${i===0?' on':''}" onclick="goTab('${id}',this)">${lbl}</button>`
  ).join('');
}
function goTab(id,btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  RENDERS[id]?.();
}

// DASHBOARD
function renderDash(){
  const tB=DB.supervisors.reduce((a,s)=>a+s.budget,0);
  const tS=DB.entries.reduce((a,e)=>a+(e.total||0),0);
  const pt=DB.entries.filter(e=>e.type==='petty').reduce((a,e)=>a+(e.total||0),0);
  const tx=DB.entries.filter(e=>e.type==='tax').reduce((a,e)=>a+(e.total||0),0);
  document.getElementById('mc').innerHTML=`
    <div class="pane on">
    <div class="sgrid">
      <div class="stat"><div class="sl">إجمالي الصرف</div><div class="sv" style="color:var(--a)">${fmt(tS)} ﷼</div></div>
      <div class="stat"><div class="sl">المتبقي الكلي</div><div class="sv" style="color:var(--gold)">${fmt(tB-tS)} ﷼</div></div>
      <div class="stat"><div class="sl">نثرية</div><div class="sv" style="color:#166534">${fmt(pt)} ﷼</div></div>
      <div class="stat"><div class="sl">ضريبية</div><div class="sv" style="color:var(--b)">${fmt(tx)} ﷼</div></div>
    </div>
    <div class="shdr">حالة المشرفين</div>
    ${DB.supervisors.map((s,i)=>{
      const sp=gs(s.id),rem=s.budget-sp,pct=Math.min(100,Math.round(sp/(s.budget||1)*100));
      const pc=pct>85?'var(--r)':pct>65?'var(--a)':'var(--gold)';
      const warn=pct>80?`<div style="background:var(--rl);color:var(--r);font-size:11px;border-radius:5px;padding:3px 8px;margin-top:5px">⚠️ تنبيه: اقترب الرصيد من النهاية</div>`:'';
      return`<div class="sup-card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px"><div style="display:flex;align-items:center;gap:8px"><div class="av" style="background:${gc(i)}18;color:${gc(i)}">${s.name[0]}</div><div><div style="font-weight:600;font-size:13px">${s.name}</div><div style="font-size:10px;color:var(--n4)">${DB.entries.filter(e=>e.supId==s.id).length} معاملة · ميزانية ${fmt(s.budget)}</div></div></div><div style="text-align:left"><div style="font-size:10px;color:var(--n4)">صرف: ${fmt(sp)}</div><div style="font-size:14px;font-weight:700;color:${rem<500?'var(--r)':'var(--gold)'}">${fmt(rem)} ﷼</div></div></div><div class="pbar"><div class="pf" style="width:${pct}%;background:${pc}"></div></div>${warn}</div>`;
    }).join('')}
    <div class="shdr" style="margin-top:4px">آخر المعاملات</div>
    <div class="card">${DB.entries.slice(-5).reverse().map(e=>`<div class="txr"><div style="flex:1"><div style="font-size:13px;font-weight:600">${e.desc}</div><div style="font-size:10px;color:var(--n4);margin-top:1px">${gn(e.supId)} · ${e.project}</div></div><div style="text-align:left;flex-shrink:0;margin-right:7px">${tb(e.type)}<div style="font-size:13px;font-weight:700;color:var(--r);margin-top:2px">${fmt(e.total)} ﷼</div></div></div>`).join('')||'<div class="empty">لا توجد معاملات بعد</div>'}</div>
    </div>`;
}

// TRANSACTIONS
function renderTxns(){

function setFT(v,btn){fType=v;document.querySelectorAll('.ftab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');rTxns();}
function rTxns(){
  const fS=document.getElementById('ft-sup')?.value||'all';
  const fP=document.getElementById('ft-proj')?.value||'all';
  const list=DB.entries.filter(e=>{
    if(fS!=='all'&&e.supId!=fS)return false;
    if(fP!=='all'&&e.project!==fP)return false;
    if(fType!=='all'&&e.type!==fType)return false;
    return true;
  }).slice().reverse();
  const total=list.reduce((a,e)=>a+(e.total||0),0);
  const el=document.getElementById('tlist');if(!el)return;
  if(!list.length){el.innerHTML='<div class="empty">لا توجد نتائج</div>';return;}
  el.innerHTML=`<div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="font-size:11px;color:var(--n4)">${list.length} معاملة</span><span style="font-size:13px;font-weight:700;color:var(--r)">${fmt(total)} ﷼</span></div>`
  +list.map(e=>`<div class="card" style="padding:10px 12px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div style="flex:1"><div style="font-size:13px;font-weight:600">${e.desc}</div>
      <div style="font-size:10px;color:var(--n4);margin-top:2px">${gn(e.supId)} · ${e.project}${e.supplier?' · '+e.supplier:''}${e.invoiceNo?' · '+e.invoiceNo:''} · ${e.date}</div></div>
      <div style="text-align:left;flex-shrink:0;margin-right:7px">${tb(e.type)} ${pb(e.payMethod||'cash')}<div style="font-size:13px;font-weight:700;color:var(--r);margin-top:3px">${fmt(e.total)} ﷼</div>${e.taxAmt>0?`<div style="font-size:10px;color:var(--n4)">ضريبة: ${fmt(e.taxAmt)}</div>`:''}</div>
    </div>
    ${e.items&&e.items.length?`<div style="border-top:1px solid var(--n2);margin-top:6px;padding-top:5px">${e.items.map(it=>`<div style="font-size:11px;color:var(--n5)">${it.desc}: ${it.qty} ${it.unit} × ${fmt(it.unitPrice)} = ${fmt(it.total)} ﷼</div>`).join('')}</div>`:''}

function compressImg(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=1024;let w=img.width,h=img.height;
        if(w>MAX||h>MAX){const ratio=Math.min(MAX/w,MAX/h);w=Math.round(w*ratio);h=Math.round(h*ratio);}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        const src=cv.toDataURL('image/jpeg',.85);
        res({b64:src.split(',')[1],src});
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(file);
  });
}

async function pickFile(inp){
  const file=inp.files[0];if(!file)return;
  const {b64,src}=await compressImg(file);
  imgB64=b64;imgSrc=src;
  const p=document.getElementById('sprev');p.src=src;p.style.display='block';
  document.getElementById('sdrop').style.display='none';
}

async function runAI(){
  const txt=(document.getElementById('stxt')?.value||'').trim();
  const err=document.getElementById('serr');
  if(!imgB64&&!txt){err.style.display='block';err.textContent='يرجى رفع صورة أو كتابة نص';return;}
  err.style.display='none';
  document.getElementById('ss1').style.display='none';
  const ldg=document.getElementById('sldg');ldg.style.display='block';
  document.getElementById('ltxt').textContent=imgB64?'جاري قراءة الصورة...':'جاري تحليل النص...';
  try{
    const params={text:txt};
    if(imgB64)params.b64=imgB64;
    const result=await api('/api/analyze','POST',params);
    if(result.error)throw new Error(result.error);
    parsed=result;
    ldg.style.display='none';
    showResult();
  }catch(e){
    ldg.style.display='none';
    document.getElementById('ss1').style.display='block';
    err.style.display='block';
    err.textContent='خطأ: '+(e.message||'حاول مرة أخرى');
  }
}

  const entry={supId,supName,project,type:parsed.type||'petty',desc:parsed.desc||'فاتورة',supplier:parsed.supplier||'',invoiceNo:parsed.invoiceNo||'',date:parsed.date||today(),payMethod:parsed.payMethod||'cash',subtotal:parsed.subtotal||0,taxRate:parsed.taxRate||0,taxAmt:parsed.taxAmt||0,total:parsed.total||parsed.subtotal||0,items:parsed.items||[]};
  document.getElementById('ss2').style.display='none';
  document.getElementById('sldg').style.display='block';
  document.getElementById('ltxt').textContent='جاري الحفظ...';
  try{
    await api('/api/entries','POST',entry);
    DB=await api('/api/db');
    document.getElementById('sldg').style.display='none';
    document.getElementById('sdone').style.display='block';
    document.getElementById('dsum').innerHTML=`${parsed.desc} · ${project}<br><strong style="color:var(--gold)">${fmt(parsed.total)} ﷼</strong>`;
    if(ROLE==='supervisor')renderSupHome();else renderDash();
  }catch(e){
    document.getElementById('sldg').style.display='none';
    document.getElementById('ss2').style.display='block';
    document.getElementById('serr').style.display='block';
    document.getElementById('serr').textContent='خطأ في الحفظ';
  }
}

function resetScan(){
  imgB64=null;imgSrc=null;parsed=null;
  document.getElementById('sfile').value='';
  ['sprev','sprev2'].forEach(id=>{const el=document.getElementById(id);if(el){el.style.display='none';el.src='';}});
  document.getElementById('sdrop').style.display='block';
  document.getElementById('stxt').value='';
  document.getElementById('serr').style.display='none';
  document.getElementById('icard').style.display='none';
  document.getElementById('ss1').style.display='block';
  document.getElementById('ss2').style.display='none';
  document.getElementById('sldg').style.display='none';
  document.getElementById('sdone').style.display='none';
}

// SERVICE WORKER
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}

// INIT
initTheme();
initLogin();
</script>
