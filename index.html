// ── Excel Direct Parser (no AI needed) ──
async function pickExcelDirect(input){
  const file = input.files[0]; if(!file) return;
  const st = document.getElementById('pb-status');
  st.style.display='block';
  st.innerHTML='<div style="padding:8px 12px;background:rgba(52,211,153,.08);border-radius:8px;font-size:12px;color:#34d399">⏳ جاري قراءة الملف...</div>';
  document.getElementById('pb-icon').textContent='⏳';

  try{
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});

    if(!rows.length) throw new Error('الملف فارغ');

    // Auto-detect header row - find row with most keyword matches
    let headerRow = 0;
    let bestScore = 0;
    const keywords = ['يوم','شهر','مورد','فاتورة','مبلغ','ضريبة','إجمالي','اجمالي','كود','نوع','رقم','invoice','date','total','tax'];
    for(let i=0;i<Math.min(10,rows.length);i++){
      const r = rows[i].map(c=>String(c).trim().toLowerCase());
      const score = r.reduce((acc,cell)=>acc+(keywords.some(k=>cell.includes(k))?1:0),0);
      if(score>bestScore){bestScore=score;headerRow=i;}
    }
    
    

    const colHeaders = rows[headerRow].map(c=>String(c).trim().toLowerCase());
    

    // Map column names
    // Print all headers for debugging
    


    const findCol = (...names) => {
      for(const n of names){
        const found = colHeaders.findIndex(hdr=>String(hdr).trim().includes(n));
        if(found>=0) return found;
      }
      return -1;
    };

    // ترتيب الأعمدة: يوم، شهر، اسم المورد، رقم الفاتورة، المبلغ بدون ضريبة، المبلغ بالضريبة، قيمة الضريبة، الإجمالي، كود الفاتورة
    // Try by name first, then by position
    let colDay      = findCol('يوم','day');
    let colMonth    = findCol('شهر','month');
    let colSupplier = findCol('مورد','عميل','supplier','client','اسم');
    let colInvNo    = findCol('رقم','invoice','no');
    let colTotal    = findCol('إجمالي','اجمالي','total','مجموع','المبلغ');
    let colSubtotal = findCol('بدون','صافي','subtotal','net','قبل');
    let colTaxAmt   = findCol('قيمة','ضريبة','vat','tax');
    let colTaxBase  = findCol('بالضريبة','بضريبة','شامل');
    let colNotes    = findCol('ملاحظة','ملاحظات','notes','note','بيان');
    let colType     = findCol('نوع','type');
    let colCode     = findCol('كود','code','serial','مسلسل');
    let colBranch   = findCol('فرع','branch');

    // Fallback: positional detection
    if(colDay===-1 && colMonth===-1 && colSupplier===-1){
      
      // Skip empty columns at start, find first col with day-like value (1-31)
      let startCol = 0;
      for(let i=0;i<colHeaders.length;i++){
        const firstDataVal = rows[headerRow+1]?.[i];
        const v = parseFloat(String(firstDataVal||'').replace(/[^0-9.]/g,''));
        if(!isNaN(v) && v>=1 && v<=31 && String(firstDataVal).trim()!==''){
          startCol=i; break;
        }
      }
      colDay      = startCol;
      colMonth    = startCol+1;
      colSupplier = startCol+2;
      colInvNo    = startCol+3;
      colSubtotal = startCol+4;
      colTaxBase  = startCol+5;
      colTaxAmt   = startCol+6;
      colTotal    = startCol+7;
      colCode     = startCol+8;
      
    }
    // If still not found by name, try by header content
    if(colDay===-1) colDay = colHeaders.findIndex(hdr=>hdr.trim()==='يوم'||hdr.trim()==='day');
    if(colMonth===-1) colMonth = colHeaders.findIndex(hdr=>hdr.trim()==='شهر'||hdr.trim()==='month');
    if(colSupplier===-1) colSupplier = colHeaders.findIndex(hdr=>hdr.includes('مورد')||hdr.includes('اسم'));
    if(colInvNo===-1) colInvNo = colHeaders.findIndex(hdr=>hdr.includes('رقم')||hdr.includes('فاتورة'));
    if(colSubtotal===-1) colSubtotal = colHeaders.findIndex(hdr=>hdr.includes('مبلغ')||hdr.includes('صافي'));
    if(colTotal===-1) colTotal = colHeaders.findIndex(hdr=>hdr.includes('إجمالي')||hdr.includes('اجمالي')||hdr.includes('total'));

    console.log('Detected cols:', {colDay,colMonth,colSupplier,colInvNo,colSubtotal,colTaxAmt,colTotal,colCode,colBranch});

    

    _purchBulkParsed = [];
    let _dupCount = 0;

    // Dup check set
    const _existCodes=new Set(DB.entries.filter(e=>e.type==='petty'||e.type==='tax').map(e=>(e.invoiceCode||'').toLowerCase()).filter(Boolean));
    const _mkDupKey = inv => {
      const invNo=(inv.invoiceNo||inv.invoiceCode||'').trim().toLowerCase();
      const amt=Math.round((inv.total||inv.subtotal||0)*100);
      const sup=(inv.supplier||'').trim().toLowerCase().slice(0,20);
      if(!invNo&&!amt) return '';
      return invNo+'|'+amt+'|'+sup;
    };
    const _existDupKeys=new Set(DB.entries.filter(e=>e.type==='petty'||e.type==='tax').map(e=>_mkDupKey({invoiceNo:e.invoiceNo||'',total:e.total||0,supplier:e.supplier||e.desc||''})).filter(Boolean));
    const _seenKeys=new Set();

    for(let i=headerRow+1; i<rows.length; i++){
      const row = rows[i];
      if(!row || row.every(c=>c===''||c===null||c===undefined)) continue;

      // Build date from day+month — السنة دائماً 2026
      let dateStr = '';
      if(colDay>=0 && colMonth>=0){
        const dayVal   = String(row[colDay]||'').trim().replace(/[^0-9]/g,'');
        const monthVal = String(row[colMonth]||'').trim().replace(/[^0-9]/g,'');
        if(dayVal && monthVal && +dayVal>=1 && +dayVal<=31 && +monthVal>=1 && +monthVal<=12){
          dateStr = '2026-'+monthVal.padStart(2,'0')+'-'+dayVal.padStart(2,'0');
        }
      }
      if(!dateStr) continue; // تخطي صفوف بدون تاريخ

      const supplier = colSupplier>=0 ? String(row[colSupplier]).trim() : '';
      const rawAmt = _fixNum(colSubtotal>=0 ? row[colSubtotal] : 0);
      const vat = _fixNum(colTaxAmt>=0 ? row[colTaxAmt] : 0);
      // لو مفيش عمود إجمالي منفصل، المبلغ هو الإجمالي شامل الضريبة
      const tot = colTotal>=0 ? (_fixNum(row[colTotal])||rawAmt) : (colTaxAmt>=0 ? rawAmt+vat : rawAmt);
      const sub = vat>0 ? tot-vat : tot; // الصافي = الإجمالي - الضريبة
      if(!tot) continue; // تخطي بدون مبلغ

      const invNo  = colInvNo>=0 ? String(row[colInvNo]).trim() : '';
      const invCode= colCode>=0  ? String(row[colCode]).trim() : '';
      const branch = colBranch>=0? String(row[colBranch]).trim(): '';

      // استخراج المشروع من الملاحظة
      const notesVal = colNotes>=0 ? String(row[colNotes]||'').trim() : '';
      // مطابقة اسم المشروع — لو فاضي → فواتير كل المقاولين
      const matchedProject = notesVal
        ? (DB.projects.find(p=>notesVal.includes(p)) || 'فواتير كل المقاولين')
        : 'فواتير كل المقاولين';

      // استخراج نوع الفاتورة
      const typeVal = colType>=0 ? String(row[colType]||'').trim() : '';
      const invType = typeVal.includes('ضريبي')||typeVal.toLowerCase().includes('tax') ? 'tax'
                    : typeVal.includes('نثري')||typeVal.toLowerCase().includes('petty') ? 'petty'
                    : typeVal ? 'petty'
                    // لو النوع فاضي: < 100 نثري، >= 100 ضريبي
                    : tot < 100 ? 'petty' : 'tax';

      const inv = {
        invoiceCode:invCode, invoiceNo:invNo, date:dateStr,
        supplier, branch,
        project: matchedProject,
        notes: notesVal,
        subtotal:sub, taxAmt:vat, total:tot,
        taxRate:sub>0&&vat>0?Math.round(vat/sub*100):0,
        type:invType, payMethod:'cash'
      };

      // Dup check
      const dupKey = _mkDupKey(inv);
      const code = (invCode||invNo||'').toLowerCase();
      if(code&&_existCodes.has(code)){_dupCount++;continue;}
      if(dupKey!=='||'&&(_existDupKeys.has(dupKey)||_seenKeys.has(dupKey))){_dupCount++;continue;}
      if(code)_existCodes.add(code);
      if(dupKey!=='||')_seenKeys.add(dupKey);
      _purchBulkParsed.push(inv);
    }

    if(!_purchBulkParsed.length && _dupCount===0) throw new Error('لم يتم استخراج أي فاتورة — تأكد من أعمدة الملف');

    const gTotal=_purchBulkParsed.reduce((a,i)=>a+(i.total||0),0);
    const gVat=_purchBulkParsed.reduce((a,i)=>a+(i.taxAmt||0),0);

    const preview=document.getElementById('pb-preview');
    preview.style.display='block';
    preview.innerHTML='<div style="font-size:12px;font-weight:700;color:#34d399;margin-bottom:8px">📗 '+_purchBulkParsed.length+' فاتورة جاهزة'+(_dupCount?'<span style="color:#fbbf24;font-weight:400"> · '+_dupCount+' مكررة تم تخطيها</span>':'')+'</div>'
      +'<div style="max-height:260px;overflow-y:auto">'
      +_purchBulkParsed.slice(0,50).map(inv=>'<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:11px">'
        +'<div><span style="font-weight:600">'+inv.supplier+'</span> <span style="color:rgba(255,255,255,.4)">'+(inv.invoiceNo||inv.invoiceCode||'—')+' · '+inv.date+'</span></div>'
        +'<span style="color:#f87171;font-weight:700">'+fmt(inv.total)+' ﷼</span></div>').join('')
      +(_purchBulkParsed.length>50?'<div style="color:rgba(255,255,255,.4);font-size:11px;padding:6px 0">... و'+(_purchBulkParsed.length-50)+' فاتورة أخرى</div>':'')
      +'</div>'
      +'<div style="display:flex;justify-content:space-between;padding:8px 12px;background:rgba(52,211,153,.08);border-radius:8px;margin-top:6px;font-size:13px">'
      +'<span>إجمالي '+_purchBulkParsed.length+' فاتورة</span><span style="font-weight:700;color:#34d399">'+fmt(gTotal)+' ﷼</span></div>';

    document.getElementById('pb-save-btn').style.display='block';
    st.innerHTML='<div style="padding:8px 12px;background:rgba(52,211,153,.1);border-radius:8px;font-size:12px;color:#34d399">✅ راجع وأكد الحفظ</div>';
    document.getElementById('pb-icon').textContent='✅';
  }catch(e){
    st.innerHTML='<div style="padding:8px 12px;background:rgba(248,113,113,.12);border-radius:8px;font-size:12px;color:#f87171">❌ '+e.message+'</div>';
    document.getElementById('pb-icon').textContent='❌';
  }
}
async function pickPurchBulkFile(input){
  const file=input.files[0];if(!file)return;
  const isPdf=file.type==='application/pdf';
  const isImg=file.type.startsWith('image/');
  const st=document.getElementById('pb-status');
  const icon=document.getElementById('pb-icon');
  st.style.display='block';
  st.innerHTML='<div style="padding:8px 12px;background:rgba(245,200,66,.08);border-radius:8px;font-size:12px;color:#f5c842">⏳ جاري تحليل التقرير...</div>';
  icon.textContent='⏳';document.getElementById('pb-txt').textContent=file.name;
  _purchBulkParsed=[];

  const reader=new FileReader();
  reader.onload=async ev=>{
    let b64=ev.target.result.split(',')[1];
    // Compress images
    if(isImg){
      await new Promise(res2=>{
        const img=new Image();
        img.onload=()=>{
          const MAX=1600;let w=img.width,h2=img.height;
          if(w>MAX){h2=Math.round(h2*MAX/w);w=MAX;}
          const c=document.createElement('canvas');c.width=w;c.height=h2;
          c.getContext('2d').drawImage(img,0,0,w,h2);
          b64=c.toDataURL('image/jpeg',0.85).split(',')[1];res2();
        };img.src=ev.target.result;
      });
    }
    const prompt='أنت محاسب خبير. هذه وثيقة تحتوي على جدول فواتير مشتريات لسنة 2026. الأعمدة: اليوم، الشهر، اسم المورد، رقم الفاتورة، المبلغ بدون ضريبة، المبلغ بالضريبة، قيمة الضريبة، الإجمالي، كود الفاتورة. استخرج كل صف. لكل صف: invoiceCode (كود الفاتورة)، invoiceNo (رقم الفاتورة)، date (2026-MM-DD)، supplier (اسم المورد)، subtotal (المبلغ بدون ضريبة)، taxAmt (قيمة الضريبة)، total (الإجمالي)، taxRate (15 إذا فيها ضريبة وإلا 0)، type (tax إذا taxAmt>0 وإلا petty). تجاهل صفوف الإجمالي. أخرج JSON مضغوط: {"invoices":[{"invoiceCode":"","invoiceNo":"","date":"","supplier":"","subtotal":0,"taxAmt":0,"total":0,"taxRate":0,"type":"petty","payMethod":"cash"}]}'
    try{
      const res=await api('/api/analyze','POST',{b64,isPdf,text:prompt});
      if(res.error)throw new Error(res.error);
      const raw=res.invoices||res.data||res.items||(Array.isArray(res)?res:[]);
      _purchBulkParsed=raw.map(inv=>{
        const sub=_fixNum(inv.subtotal||inv.net||inv.صافي||0);
        const vat=_fixNum(inv.taxAmt||inv.tax||inv.ضريبة||0);
        const tot=_fixNum(inv.total||inv.إجمالي||0)||(sub+vat);
        const rate=_fixNum(inv.taxRate||0)||(sub>0&&vat>0?Math.round(vat/sub*100):0);
        return{
          invoiceNo:String(inv.invoiceNo||inv.invoice||inv.فاتورة||'').trim(),
          date:_fixDate(inv.date||inv.تاريخ||''),
          supplier:String(inv.supplier||inv.client||inv.عميل||inv.مورد||inv.desc||'—').trim(),
          branch:String(inv.branch||inv.فرع||'').trim(),
          type:(rate>0||vat>0)?'tax':'petty',
          subtotal:sub||tot-vat,
          taxRate:rate,taxAmt:vat,
          total:tot||sub+vat,
          payMethod:_fixPay(inv.payMethod||'cash')
        };
      }).filter(inv=>inv.total>0||inv.subtotal>0);

      if(!_purchBulkParsed.length)throw new Error('لم يتم استخراج أي فاتورة');

      // رفض الفواتير اللي مفيش فيها تاريخ واضح خالص
      let _noDateCount=0;
      _purchBulkParsed=_purchBulkParsed.filter(inv=>{
        if(!inv.date){_noDateCount++;return false;}
        return true;
      });
      if(!_purchBulkParsed.length){
        const msg='⚠️ تم رفض كل الفواتير ('+_noDateCount+') لعدم وجود تاريخ واضح في أي منها — يرجى رفع صورة أوضح أو إدخال التاريخ يدوياً';
        st.innerHTML='<div style="padding:8px 12px;background:rgba(248,113,113,.15);border-radius:8px;font-size:12px;color:#f87171">'+msg+'</div>';
        icon.textContent='❌';
        return;
      }


      // فحص التكرار: رفض فقط لو نفس رقم الفاتورة + نفس التاريخ + نفس المبلغ معاً
      const _mkDupKey = inv => {
        const invNo = (inv.invoiceNo||inv.invoiceCode||'').trim().toLowerCase();
        const date  = (inv.date||'').trim();
        const amt   = Math.round((inv.total||inv.subtotal||0)*100);
        if(!invNo || !date) return ''; // لازم رقم فاتورة وتاريخ للمطابقة
        return invNo+'|'+date+'|'+amt;
      };
      const _existDupKeys = new Set(
        DB.entries.filter(e=>e.type==='petty'||e.type==='tax').map(e=>_mkDupKey({
          invoiceNo:e.invoiceNo||e.invoiceCode||'',
          date:e.date||'',
          total:e.total||0
        })).filter(Boolean)
      );
      const _seenDupKeys = new Set();
      let _dupCount=0;
      _purchBulkParsed=_purchBulkParsed.filter(inv=>{
        const k=_mkDupKey(inv);
        if(!k) return true; // مفيش رقم فاتورة أو تاريخ — نحتفظ بها
        if(_existDupKeys.has(k)||_seenDupKeys.has(k)){_dupCount++;return false;}
        _seenDupKeys.add(k);
        return true;
      });
      const gTotal=_purchBulkParsed.reduce((a,i)=>a+(i.total||0),0);
      const gVat=_purchBulkParsed.reduce((a,i)=>a+(i.taxAmt||0),0);
      const preview=document.getElementById('pb-preview');
      preview.style.display='block';
      preview.innerHTML='<div style="font-size:12px;font-weight:700;color:#f87171;margin-bottom:8px">🛒 تم استخراج '+_purchBulkParsed.length+' فاتورة</div>'
        +'<div style="max-height:260px;overflow-y:auto">'
        +_purchBulkParsed.map(inv=>'<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)">'
          +'<div><div style="font-size:12px;font-weight:600">'+inv.supplier+(inv.branch?' <span style="font-size:10px;color:#f5c842">('+inv.branch+')</span>':'')+'</div><div style="font-size:10px;color:rgba(255,255,255,.4)">'+(inv.invoiceNo||'—')+' · '+inv.date+'</div></div>'
          +'<div style="text-align:left"><div style="font-size:13px;font-weight:700;color:#f87171">'+fmt(inv.total)+' ﷼</div><div style="font-size:10px;color:rgba(255,255,255,.4)">VAT: '+fmt(inv.taxAmt)+' ﷼</div></div>'
          +'</div>').join('')
        +'</div>'
        +'<div style="display:flex;justify-content:space-between;padding:8px 12px;background:rgba(248,113,113,.08);border-radius:8px;margin-top:6px;font-size:13px">'
        +'<span>إجمالي '+_purchBulkParsed.length+' فاتورة</span><span style="font-weight:700;color:#f87171">'+fmt(gTotal)+' ﷼</span></div>';
      document.getElementById('pb-save-btn').style.display='block';
      let _statusMsg='✅ راجع الفواتير وأكد الحفظ';
      const _rejParts=[];
      if(_dupCount>0) _rejParts.push(_dupCount+' مكررة');
      if(_noDateCount>0) _rejParts.push(_noDateCount+' بدون تاريخ واضح');
      if(_rejParts.length) _statusMsg+=' — تم تجاهل '+_rejParts.join(' و ');
      st.innerHTML='<div style="padding:8px 12px;background:rgba(52,211,153,.1);border-radius:8px;font-size:12px;color:#34d399">'+_statusMsg+'</div>';
      icon.textContent='✅';
    }catch(e){
      st.innerHTML='<div style="padding:8px 12px;background:rgba(248,113,113,.12);border-radius:8px;font-size:12px;color:#f87171">❌ '+e.message+'</div>';
      icon.textContent='❌';
    }
  };
  reader.readAsDataURL(file);
}

async function savePurchBulk(){
  if(!_purchBulkParsed.length){alert('لا توجد فواتير');return;}
  const supId=parseInt(document.getElementById('p-sup')?.value);
  const project=document.getElementById('p-proj')?.value;
  if(!supId||!project){alert('⚠️ اختر المشرف والمشروع أولاً من الأسفل');return;}
  const sup=DB.supervisors.find(s=>s.id===supId);
  const btn=document.getElementById('pb-save-btn');
  btn.textContent='⏳ جاري الحفظ...';btn.disabled=true;
  // فحص التكرار: رفض فقط لو نفس رقم الفاتورة + نفس التاريخ + نفس المبلغ معاً
  const _mkKey2 = inv => {
    const invNo = (inv.invoiceNo||inv.invoiceCode||'').trim().toLowerCase();
    const date  = (inv.date||'').trim();
    const amt   = Math.round((inv.total||inv.subtotal||0)*100);
    if(!invNo || !date) return '';
    return invNo+'|'+date+'|'+amt;
  };
  const _saveSet=new Set(
    DB.entries.filter(e=>e.type==='petty'||e.type==='tax').map(e=>_mkKey2({
      invoiceNo:e.invoiceNo||e.invoiceCode||'',date:e.date||'',total:e.total||0
    })).filter(Boolean)
  );
  const _seenSave=new Set();
  let added=0,skipped=0,failed=0;
  for(const inv of _purchBulkParsed){
    const _k=_mkKey2(inv);
    if(_k&&(_saveSet.has(_k)||_seenSave.has(_k))){skipped++;continue;}
    if(_k)_seenSave.add(_k);
    try{
      // استخدم المشروع من الفاتورة لو متاح، وإلا المشروع المختار
      const entryProject = inv.project || project;
      const res=await api('/api/entries','POST',{supId,supName:sup?.name||'',project:entryProject,type:inv.type,desc:inv.supplier||'مشتريات',invoiceNo:inv.invoiceNo||null,invoiceCode:inv.invoiceCode||null,supplier:inv.supplier||null,date:inv.date,payMethod:inv.payMethod,subtotal:inv.subtotal,taxRate:inv.taxRate,taxAmt:inv.taxAmt,total:inv.total,historicalEntry:true,notes:inv.notes||null});
      if(res.error)failed++;else added++;
    }catch(e){failed++;}
  }
  DB=await api('/api/db');
  _purchBulkParsed=[];
  ['pb-preview','pb-save-btn'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display='none';});
  document.getElementById('pb-icon').textContent='📊';
  document.getElementById('pb-txt').textContent='ارفع تقرير Excel أو PDF أو صورة جدول';
  document.getElementById('pb-status').innerHTML='<div style="padding:8px 12px;background:rgba(52,211,153,.1);border-radius:8px;font-size:12px;color:#34d399">✅ تمت إضافة '+added+' فاتورة'+(failed?' · فشل '+failed:'')+'</div>';
  alert('✅ تمت إضافة '+added+' فاتورة على مصروفات '+sup?.name+' / '+project+(failed?' (فشل '+failed+')':''));
  rPurchases();
}

function calcEditVat(){
  const sub  = parseFloat(document.getElementById('ed-sub')?.value)||0;
  const rate = parseFloat(document.getElementById('ed-rate')?.value)||0;
  const vat  = sub*rate/100;
  const tot  = sub+vat;
  const ve = document.getElementById('ed-vatamt');
  const te = document.getElementById('ed-total');
  if(ve) ve.textContent = fmt(vat)+' ﷼';
  if(te) te.textContent = fmt(tot)+' ﷼';
}

async function savePurchEdit(entryId){
  const desc    = document.getElementById('ed-desc')?.value.trim();
  const invNo   = document.getElementById('ed-invno')?.value.trim();
  const date    = document.getElementById('ed-date')?.value;
  const type    = document.getElementById('ed-type')?.value;
  const supId   = parseInt(document.getElementById('ed-sup')?.value);
  const project = document.getElementById('ed-proj')?.value;
  const sub     = parseFloat(document.getElementById('ed-sub')?.value)||0;
  const rate    = parseFloat(document.getElementById('ed-rate')?.value)||0;
  const vat     = sub*rate/100;
  const tot     = sub+vat;
  const err     = document.getElementById('ed-err');
  const sup     = DB.supervisors.find(s=>s.id===supId);

  if(!date||!sub){
    err.style.display='block';
    err.textContent='⚠️ التاريخ والمبلغ مطلوبان';
    return;
  }

  try{
    const res = await api('/api/entries/'+entryId,'PATCH',{
      desc, invoiceNo:invNo||null, date, type,
      supId, supName:sup?.name||'', project,
      subtotal:sub, taxRate:rate, taxAmt:vat, total:tot
    });
    if(res.error) throw new Error(res.error);
    DB = await api('/api/db'); if(DB&&DB.supervisors)localStorage.setItem('kayan_db_cache',JSON.stringify(DB));
    document.getElementById('edit-modal').remove();
    rPurchases();
  }catch(e){
    err.style.display='block';
    err.textContent='❌ '+e.message;
  }
}

  const sorted=filtered.slice().sort((a,b)=>b.id-a.id);
  const PAGE=50, total=sorted.length, start=page*PAGE, end=Math.min(start+PAGE,total);
  const shown=sorted.slice(start,end);
  const pages=Math.ceil(total/PAGE);
  const navHTML=pages>1?`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:12px">
    <span style="color:rgba(255,255,255,.5)">${start+1}–${end} من ${total}</span>

async function deleteHistoricalPurchases(){
  // الفواتير المضافة يدوياً فقط (historicalEntry: true)
  const toDelete = DB.entries.filter(e=>e.historicalEntry===true);
  if(!toDelete.length){
    alert('لا توجد مشتريات مضافة يدوياً');
    return;
  }
  if(!confirm('سيتم حذف '+toDelete.length+' فاتورة مضافة يدوياً فقط.\nمشتريات المشرفين لن تتأثر.\nهل أنت متأكد؟')) return;

  let deleted=0, failed=0;
  // نحذف كلهم بالتوازي أسرع
  const results = await Promise.allSettled(
    toDelete.map(e => api('/api/entries/'+e.id,'DELETE'))
  );
  results.forEach(r => {
    if(r.status==='fulfilled' && r.value?.ok!==false) deleted++;
    else failed++;
  });

  DB = await api('/api/db'); if(DB&&DB.supervisors)localStorage.setItem('kayan_db_cache',JSON.stringify(DB));
  alert('✅ تم حذف '+deleted+' فاتورة'+(failed?' · فشل '+failed:''));
  rPurchases();
}

// ── TRIAL BALANCE ──
function getQuarterDates(q,year){
  var s=['01-01','04-01','07-01','10-01'],e=['03-31','06-30','09-30','12-31'];
  return{from:year+'-'+s[q],to:year+'-'+e[q]};
}
function filterByDate(arr,from,to,field){
  if(!field)field='date';
  return arr.filter(function(e){var d=e[field]||'';if(from&&d<from)return false;if(to&&d>to)return false;return true;});
}
function rTrialBalance(){
  var year=new Date().getFullYear();
  if(!_tbFrom&&!_tbTo){var qd=getQuarterDates(Math.floor(new Date().getMonth()/3),year);_tbFrom=qd.from;_tbTo=qd.to;}
  _renderTrialBalance();
}
function _renderTrialBalance(){
  var year = new Date().getFullYear();

  // ── تحميل البيانات ──
  var sales    = JSON.parse(localStorage.getItem('kayan_sales')||'[]');
  var salesRet = JSON.parse(localStorage.getItem('kayan_sales_returns')||'[]');

  // ── فلتر الفترة ──
  var fS   = filterByDate(sales,    _tbFrom, _tbTo);
  var fSR  = filterByDate(salesRet, _tbFrom, _tbTo);
  // المشتريات في ميزان المراجعة = فواتير ضريبية فقط
  var fP   = filterByDate(DB.entries.filter(function(e){return e.type==='tax'&&!e.rejected;}), _tbFrom, _tbTo);
  var fRet = filterByDate(DB.entries.filter(function(e){return e.type==='return';}), _tbFrom, _tbTo);

  // ── المبيعات ──
  var salesTotal  = fS.reduce(function(a,s){return a+(s.total||0);},0);
  var salesVat    = fS.reduce(function(a,s){return a+(s.taxAmt||0);},0);
  var salesNet    = fS.reduce(function(a,s){return a+(s.subtotal||0);},0);

  // ── مرتجعات المبيعات ──
  var retSalesT   = fSR.reduce(function(a,r){return a+(r.total||0);},0);
  var retSalesV   = fSR.reduce(function(a,r){return a+(r.taxAmt||0);},0);

  // ── المشتريات ──
  var purchTotal  = fP.reduce(function(a,e){return a+(e.total||0);},0);
  var purchVat    = fP.reduce(function(a,e){return a+(e.taxAmt||0);},0);
  var purchNet    = fP.reduce(function(a,e){return a+(e.subtotal||e.total||0);},0);

  // ── مرتجعات المشتريات ──
  var retPurchT   = fRet.reduce(function(a,e){return a+(e.total||0);},0);
  var retPurchV   = fRet.reduce(function(a,e){return a+(e.taxAmt||0);},0);

  // ── الحسابات الرئيسية ──
  var netSales    = salesTotal  - retSalesT;   // صافي المبيعات بعد المرتجعات
  var netPurch    = purchTotal  - retPurchT;   // صافي المشتريات بعد المرتجعات
  var diff        = netSales    - netPurch;    // الفرق

  // ── VAT ──
  var vatCollected = salesVat  - retSalesV;   // VAT محصّلة (بعد المرتجعات)
  var vatPaid      = purchVat  - retPurchV;   // VAT مدفوعة (بعد المرتجعات)
  var vatDue       = vatCollected - vatPaid;  // المستحق للهيئة

  // ── Period selector ──
  var periods=[['q0','Q1 يناير-مارس'],['q1','Q2 أبريل-يونيو'],['q2','Q3 يوليو-سبتمبر'],['q3','Q4 أكتوبر-ديسمبر'],['year','السنة كاملة '+year],['custom','تاريخ مخصص']];
  var selVal='custom';
  if(_tbFrom===year+'-01-01'&&_tbTo===year+'-03-31') selVal='q0';
  else if(_tbFrom===year+'-04-01'&&_tbTo===year+'-06-30') selVal='q1';
  else if(_tbFrom===year+'-07-01'&&_tbTo===year+'-09-30') selVal='q2';
  else if(_tbFrom===year+'-10-01'&&_tbTo===year+'-12-31') selVal='q3';

  function row(label,val,color,sub){

      +'<span style="font-size:12px;color:rgba(255,255,255,.8)">'+label+(sub?' <small style="color:rgba(255,255,255,.4);font-size:10px">'+sub+'</small>':'')+'</span>'
      +'<strong style="color:'+color+';font-size:13px">'+fmt(val)+' ﷼</strong></div>';
  }

  document.getElementById('mc').innerHTML =
    '<div style="margin-bottom:10px"><div style="font-size:15px;font-weight:800;color:#f5c842">⚖️ ميزان المراجعة</div></div>'

    // فلتر الفترة
    +'<div class="card" style="padding:12px;margin-bottom:10px">'
    +'<select onchange="onTBSelect(this.value)" style="width:100%;padding:9px;border-radius:8px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.2);font-family:Tajawal,sans-serif;font-size:13px;margin-bottom:8px">'
    +periods.map(function(p){return'<option value="'+p[0]+'"'+(selVal===p[0]?' selected':'')+'>'+p[1]+'</option>';}).join('')
    +'</select>'
    +'<div id="tb-custom-dates" style="display:'+(selVal==='custom'?'grid':'none')+';grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px">'
    +'<div><label class="lbl" style="font-size:11px">من</label><input type="date" id="tb-from" value="'+_tbFrom+'" onchange="_tbFrom=this.value;_renderTrialBalance()"></div>'
    +'<div><label class="lbl" style="font-size:11px">إلى</label><input type="date" id="tb-to" value="'+_tbTo+'" onchange="_tbTo=this.value;_renderTrialBalance()"></div>'
    +'</div>'
    +'<div style="font-size:11px;color:rgba(255,255,255,.4);text-align:center">'+(_tbFrom||'—')+' → '+(_tbTo||'—')+' · '+fS.length+' مبيعة · '+fP.length+' مشترى</div>'
    +'</div>'

    // المبيعات
    +'<div class="card" style="margin-bottom:8px">'
    +'<div class="ctitle" style="color:#34d399;margin-bottom:8px">📈 المبيعات</div>'
    +row('إجمالي المبيعات (شامل VAT)', salesTotal, '#34d399', fS.length+' فاتورة')
    +row('مرتجعات المبيعات', retSalesT, '#f87171', fSR.length+' مرتجع')
    +'<div style="display:flex;justify-content:space-between;padding:8px 0 2px;border-top:2px solid rgba(52,211,153,.3);margin-top:4px">'
    +'<strong style="color:#34d399">صافي المبيعات</strong>'
    +'<strong style="color:#34d399;font-size:16px">'+fmt(netSales)+' ﷼</strong></div></div>'

    // المشتريات
    +'<div class="card" style="margin-bottom:8px">'
    +'<div class="ctitle" style="color:#f87171;margin-bottom:8px">📉 المشتريات</div>'
    +row('إجمالي المشتريات (شامل VAT)', purchTotal, '#f87171', fP.length+' فاتورة')
    +row('مرتجعات المشتريات', retPurchT, '#34d399', fRet.length+' مرتجع')
    +'<div style="display:flex;justify-content:space-between;padding:8px 0 2px;border-top:2px solid rgba(248,113,113,.3);margin-top:4px">'
    +'<strong style="color:#f87171">صافي المشتريات</strong>'
    +'<strong style="color:#f87171;font-size:16px">'+fmt(netPurch)+' ﷼</strong></div></div>'

    // الفرق
    +'<div style="background:'+(diff>=0?'rgba(52,211,153,.1)':'rgba(248,113,113,.1)')+';border:1.5px solid '+(diff>=0?'rgba(52,211,153,.3)':'rgba(248,113,113,.3)')+';border-radius:12px;padding:14px;text-align:center;margin-bottom:10px">'
    +'<div style="font-size:12px;color:rgba(255,255,255,.6);margin-bottom:4px">الفرق (صافي المبيعات − صافي المشتريات)</div>'
    +'<div style="font-size:32px;font-weight:900;color:'+(diff>=0?'#34d399':'#f87171')+'">'+(diff>=0?'+':'')+fmt(diff)+' ﷼</div>'
    +'<div style="font-size:11px;color:rgba(255,255,255,.4);margin-top:4px">'+fmt(netSales)+' − '+fmt(netPurch)+'</div></div>'

    // VAT
    +'<div class="card" style="margin-bottom:10px">'
    +'<div class="ctitle" style="color:#70B5FF;margin-bottom:8px">🧾 تسوية VAT</div>'
    +row('VAT المبيعات (بعد المرتجعات)', vatCollected, '#34d399', '')
    +row('VAT المشتريات (بعد المرتجعات)', vatPaid, '#f87171', '')
    +'<div style="padding:10px 12px;background:rgba('+(vatDue>=0?'248,113,113':'52,211,153')+',.1);border-radius:8px;margin-top:6px;display:flex;justify-content:space-between;align-items:center">'
    +'<div style="font-size:12px;font-weight:700;color:'+(vatDue>=0?'#f87171':'#34d399')+'">'+(vatDue>=0?'💳 VAT مستحقة للهيئة':'✅ VAT مسترجعة')+'</div>'
    +'<strong style="font-size:18px;color:'+(vatDue>=0?'#f87171':'#34d399')+'">'+fmt(Math.abs(vatDue))+' ﷼</strong></div></div>'

    // ملخص ربعي
    +'<div class="card" style="margin-bottom:10px">'
    +'<div class="ctitle" style="margin-bottom:10px">📊 ملخص الأرباع</div>'

    +'<button onclick="exportVatReturn()" style="flex:1;padding:11px;background:rgba(248,113,113,.12);color:#f87171;border:1px solid rgba(248,113,113,.3);border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:Tajawal,sans-serif">🧾 إقرار VAT</button>'

    // أزرار التقارير التفصيلية للأرباع
    +'<div style="margin-top:2px"><div style="font-size:11px;color:rgba(255,255,255,.5);margin-bottom:6px;font-weight:600">📋 تقارير تفصيلية للأرباع — اضغط لتحميل PDF</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">'
    +_buildQuarterBtns()
    +'</div></div>';
}


function _buildQuarterBtns(){
  var yr=new Date().getFullYear();
  var qs=[['Q1',yr+'-01-01',yr+'-03-31'],['Q2',yr+'-04-01',yr+'-06-30'],['Q3',yr+'-07-01',yr+'-09-30'],['Q4',yr+'-10-01',yr+'-12-31']];
  var sal=JSON.parse(localStorage.getItem('kayan_sales')||'[]');
  return qs.map(function(q,i){
    var qS=filterByDate(sal,q[1],q[2]);
    var qP=filterByDate(DB.entries.filter(function(e){return e.type==='tax'&&!e.rejected;}),q[1],q[2]);
    var tS=qS.reduce(function(a,s){return a+(s.total||0);},0);
    var tP=qP.reduce(function(a,e){return a+(e.total||0);},0);
    var diff=tS-tP;
    var hasData=tS>0||tP>0;
    return '<button onclick="_exportQ('+i+')"'
      +' style="padding:10px 8px;border:1px solid rgba(255,255,255,'+(hasData?'.2':'.08')+');border-radius:8px;background:rgba(255,255,255,'+(hasData?'.06':'.02')+');color:rgba(255,255,255,'+(hasData?'.9':'.4')+');cursor:pointer;font-family:Tajawal,sans-serif;font-size:11px;text-align:right">'
      +'<div style="font-weight:700;color:#f5c842;margin-bottom:4px">'+q[0]+' '+yr+'</div>'
      +(hasData
        ?'<div style="color:#34d399;font-size:10px">مبيعات: '+fmt(tS)+' ﷼</div>'
         +'<div style="color:#f87171;font-size:10px">مشتريات: '+fmt(tP)+' ﷼</div>'
         +'<div style="font-size:10px;font-weight:700;color:'+(diff>=0?'#34d399':'#f87171')+'">فرق: '+(diff>=0?'+':'')+fmt(diff)+' ﷼</div>'
        :'<div style="font-size:10px">لا توجد بيانات</div>')
      +'</button>';
  }).join('');
}
function _exportQ(i){
  var yr=new Date().getFullYear();
  var qs=[['Q1',yr+'-01-01',yr+'-03-31'],['Q2',yr+'-04-01',yr+'-06-30'],['Q3',yr+'-07-01',yr+'-09-30'],['Q4',yr+'-10-01',yr+'-12-31']];
  var q=qs[i];
  exportQuarterDetail(q[1],q[2],q[0]);
}

function exportQuarterDetail(from, to, qLabel){
  var sales    = JSON.parse(localStorage.getItem('kayan_sales')||'[]');
  var salesRet = JSON.parse(localStorage.getItem('kayan_sales_returns')||'[]');
  var fS   = filterByDate(sales, from, to);
  var fSR  = filterByDate(salesRet, from, to);
  var fP   = filterByDate(DB.entries.filter(function(e){return e.type==='tax'&&!e.rejected;}), from, to);
  // النثرية لا تدخل في ميزان المراجعة
  var tS   = fS.reduce(function(a,s){return a+(s.total||0);},0);
  var tSR  = fSR.reduce(function(a,r){return a+(r.total||0);},0);
  var tP   = fP.reduce(function(a,e){return a+(e.total||0);},0);

  var netS = tS-tSR;
  var diff = netS-tP;
  var vatS = fS.reduce(function(a,s){return a+(s.taxAmt||0);},0)-fSR.reduce(function(a,r){return a+(r.taxAmt||0);},0);
  var vatP = fP.reduce(function(a,e){return a+(e.taxAmt||0);},0);
  var vatDue = vatS-vatP;
  var now = new Date().toLocaleDateString('ar-SA',{year:'numeric',month:'long',day:'numeric'});
  var pl = {cash:'كاش',transfer:'تحويل',deferred:'آجل'};
  var yr = new Date().getFullYear();

  function tbl(title, color, bg, rows, headers, totRow){
    if(!rows.length) return '';
    return '<h2 style="background:'+bg+';color:'+color+';padding:5px 8px;border-radius:4px;font-size:13px;margin:14px 0 6px">'+title+' ('+rows.length+')</h2>'
      +'<table><tr>'+headers.map(function(h2){return'<th>'+h2+'</th>';}).join('')+'</tr>'
      +rows+'<tr class="tr">'+totRow+'</tr></table>';
  }

  var html='<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><title>تقرير '+qLabel+' '+yr+'</title>'
    +'<style>@import url("https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap");'
    +'*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Tajawal",sans-serif;direction:rtl;color:#000;padding:20px;font-size:11px}'
    +'h1{font-size:18px;font-weight:900;margin-bottom:2px}h2{font-size:12px;font-weight:800}'
    +'.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}'
    +'.box{background:#f5f5f5;border:1px solid #ddd;border-radius:5px;padding:7px;text-align:center}'
    +'.bl{font-size:9px;color:#555;margin-bottom:2px}.bv{font-size:13px;font-weight:800}'
    +'table{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:10px}'
    +'th{background:#000;color:#fff;padding:5px;text-align:right;print-color-adjust:exact;-webkit-print-color-adjust:exact}'
    +'td{padding:4px 5px;border:1px solid #ddd}tr:nth-child(even)td{background:#f9f9f9}'
    +'.tr td{background:#111;color:#fff;font-weight:800}'
    +'.diff{padding:10px;border-radius:6px;text-align:center;margin:12px 0;border:2px solid}</style></head><body><div style="text-align:right;margin-bottom:14px"><img src="'+CO_LOGO+'" style="max-width:200px;max-height:90px;height:auto"></div>'

    +'<h1>تقرير '+qLabel+' '+yr+' التفصيلي</h1>'
    +'<div style="font-size:11px;color:#555;margin-bottom:10px">شركة كيان وبناء للمقاولات · '+now+' · '+from+' ← '+to+'</div>'

    +'<div class="sum">'
    +'<div class="box"><div class="bl">صافي المبيعات</div><div class="bv" style="color:#166534">'+fmt(netS)+' ﷼</div></div>'
    +'<div class="box"><div class="bl">المشتريات (ضريبية)</div><div class="bv" style="color:#D93025">'+fmt(tP)+' ﷼</div></div>'
    +'<div class="box"><div class="bl">الفرق</div><div class="bv" style="color:'+(diff>=0?'#166534':'#D93025')+'">'+(diff>=0?'+':'')+fmt(diff)+' ﷼</div></div>'
    +'<div class="box"><div class="bl">VAT للهيئة</div><div class="bv" style="color:#1d4ed8">'+fmt(Math.abs(vatDue))+' ﷼</div></div>'
    +'</div>'

    // مبيعات
    +tbl('📈 فواتير المبيعات','#166534','#dcfce7',
      fS.sort(function(a,b){return a.date.localeCompare(b.date);}).map(function(s){
        return'<tr><td>'+s.date+'</td><td>'+(s.invoiceNo||'—')+'</td><td>'+(s.client||'—')+'</td><td>'+(pl[s.payMethod]||'—')+'</td><td>'+fmt(s.subtotal)+'</td><td>'+fmt(s.taxAmt)+'</td><td style="font-weight:700;color:#166534">'+fmt(s.total)+' ﷼</td></tr>';
      }).join(''),
      ['التاريخ','رقم الفاتورة','العميل','الدفع','صافي','VAT','الإجمالي'],
      '<td colspan="4">الإجمالي</td><td>'+fmt(fS.reduce(function(a,s){return a+(s.subtotal||0);},0))+'</td><td>'+fmt(fS.reduce(function(a,s){return a+(s.taxAmt||0);},0))+'</td><td>'+fmt(tS)+' ﷼</td>'
    )

    // مرتجعات مبيعات
    +(fSR.length?'<h2 style="background:#fee2e2;color:#991b1b;padding:5px 8px;border-radius:4px;font-size:12px;margin:14px 0 6px">↩️ مرتجعات المبيعات ('+fSR.length+')</h2>'

    // مشتريات ضريبية
    +tbl('📉 المشتريات الضريبية','#991b1b','#fee2e2',

      }).join(''),
      ['التاريخ','المورد','رقم الفاتورة','المشرف','المشروع','صافي','VAT','الإجمالي'],
      '<td colspan="5">الإجمالي</td><td>'+fmt(fP.reduce(function(a,e){return a+(e.subtotal||0);},0))+'</td><td>'+fmt(vatP)+'</td><td>'+fmt(tP)+' ﷼</td>'
    )


    // الفرق
    +'<div class="diff" style="background:'+(diff>=0?'#dcfce7':'#fee2e2')+';border-color:'+(diff>=0?'#166534':'#D93025')+'">'
    +'<div style="font-size:11px;color:#555;margin-bottom:4px">صافي المبيعات '+fmt(netS)+' ← المشتريات الضريبية '+fmt(tP)+' = الفرق</div>'
    +'<div style="font-size:22px;font-weight:900;color:'+(diff>=0?'#166534':'#D93025')+'">'+(diff>=0?'+':'')+fmt(diff)+' ﷼</div>'
    +'<div style="font-size:10px;margin-top:4px;color:#666">VAT '+(vatDue>=0?'مستحقة للهيئة':'مسترجعة')+': '+fmt(Math.abs(vatDue))+' ﷼</div>'
    +'</div>'
    +'</body></html>';

  var w=window.open('','_blank');
  w.document.write(html);
  w.document.close();
  setTimeout(function(){w.print();},700);

  else if(val==='q0'){_tbFrom=year+'-01-01';_tbTo=year+'-03-31';_renderTrialBalance();}
  else if(val==='q1'){_tbFrom=year+'-04-01';_tbTo=year+'-06-30';_renderTrialBalance();}
  else if(val==='q2'){_tbFrom=year+'-07-01';_tbTo=year+'-09-30';_renderTrialBalance();}
  else if(val==='q3'){_tbFrom=year+'-10-01';_tbTo=year+'-12-31';_renderTrialBalance();}

function exportVatReturn(){
  var sales=JSON.parse(localStorage.getItem('kayan_sales')||'[]');
  var salesRet=JSON.parse(localStorage.getItem('kayan_sales_returns')||'[]');
  var fS=filterByDate(sales,_tbFrom,_tbTo);
  var fP=filterByDate(DB.entries.filter(function(e){returne.type==='tax'&&!e.rejected;}),_tbFrom,_tbTo);
  var fSR=filterByDate(salesRet,_tbFrom,_tbTo);
  var sv=fS.reduce(function(a,s){return a+(s.taxAmt||0);},0);
  var sn=fS.reduce(function(a,s){return a+(s.subtotal||0);},0);
  var pv=fP.reduce(function(a,e){return a+(e.taxAmt||0);},0);
  var pn=fP.reduce(function(a,e){return a+(e.subtotal||e.total||0);},0);
  var srv=fSR.reduce(function(a,r){return a+(r.taxAmt||0);},0);
  var vatDue=(sv-srv)-pv;
  var now=new Date().toLocaleDateString('ar-SA',{year:'numeric',month:'long',day:'numeric'});
  var w=window.open('','_blank');
  w.document.write('<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><title>VAT</title></head><body style="font-family:Tajawal,sans-serif;direction:rtl;padding:30px;font-size:14px">');
  w.document.write('<h2 style="margin-bottom:10px">\u0625\u0642\u0631\u0627\u0631 VAT \u2014 '+(_tbFrom||'-')+' \u0625\u0644\u0649 '+(_tbTo||'-')+'</h2>');
  w.document.write('<p>\u0634\u0631\u0643\u0629 \u0643\u064a\u0627\u0646 \u0648\u0628\u0646\u0627\u0621 \u0644\u0644\u0645\u0642\u0627\u0648\u0644\u0627\u062a \u2022 '+now+'</p><br>');
  w.document.write('<table border="1" cellpadding="8" cellspacing="0" width="100%" style="border-collapse:collapse">');
  w.document.write('<tr style="background:#1a5a1a;color:#fff"><th>\u0627\u0644\u0628\u064a\u0627\u0646</th><th>\u0627\u0644\u0645\u0628\u0644\u063a</th></tr>');
  w.document.write('<tr><td>\u0645\u0628\u064a\u0639\u0627\u062a \u0635\u0627\u0641\u064a</td><td>'+fmt(sn)+' \u0631\u064a\u0627\u0644</td></tr>');
  w.document.write('<tr><td>VAT \u0645\u0628\u064a\u0639\u0627\u062a</td><td style="color:#166534;font-weight:bold">'+fmt(sv)+' \u0631\u064a\u0627\u0644</td></tr>');
  w.document.write('<tr><td>\u0645\u0634\u062a\u0631\u064a\u0627\u062a \u0635\u0627\u0641\u064a</td><td>'+fmt(pn)+' \u0631\u064a\u0627\u0644</td></tr>');
  w.document.write('<tr><td>VAT \u0645\u0634\u062a\u0631\u064a\u0627\u062a</td><td style="color:#D93025;font-weight:bold">'+fmt(pv)+' \u0631\u064a\u0627\u0644</td></tr>');
  w.document.write('<tr style="background:#'+(vatDue>=0?'fee2e2':'dcfce7')+'"><td style="font-weight:bold">'+(vatDue>=0?'VAT \u0645\u0633\u062a\u062d\u0642\u0629 \u0644\u0644\u0647\u064a\u0626\u0629':'VAT \u0645\u0633\u062a\u0631\u062c\u0639\u0629')+'</td><td style="font-size:18px;font-weight:900;color:'+(vatDue>=0?'#D93025':'#166534')+'">'+fmt(Math.abs(vatDue))+' \u0631\u064a\u0627\u0644</td></tr>');
  w.document.write('</table></body></html>');
  w.document.close();setTimeout(function(){w.print();},700);
}

</script>
