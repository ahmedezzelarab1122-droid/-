  let pending = JSON.parse(localStorage.getItem('kayan_pending')||'[]');
  const req = pending.find(r=>r.id===reqId);
  if(!req) return;

  try{
    // Execute the actual action
    if(req.action==='add'){
      const entryData = Object.assign({},req.data);
      // Upload image if b64Image exists but no imageUrl
      // Get b64 from localStorage if not in data
      if(!entryData.b64Image && !entryData.imageUrl){
        const storedB64 = localStorage.getItem('kayan_img_'+req.id);
        if(storedB64) entryData.b64Image = storedB64;
      }
      if(entryData.b64Image && !entryData.imageUrl){
        try{
          const upRes = await api('/api/upload-image','POST',{b64:entryData.b64Image});
          if(upRes.url) entryData.imageUrl = upRes.url;
        }catch(e2){ console.error('upload failed',e2); }
        delete entryData.b64Image;
        localStorage.removeItem('kayan_img_'+req.id);
      }
      const res = await api('/api/entries','POST',entryData);
      if(res.error) throw new Error(res.error);
    } else if(req.action==='delete'){
      await api('/api/entries/'+req.entryId,'DELETE');
    } else if(req.action==='edit'){
      await api('/api/entries/'+req.entryId,'PATCH',req.data);
    } else if(req.action==='transfer'){
      const res = await api('/api/transfer','POST',req.data);
      if(res.error) throw new Error(res.error);
    } else if(req.action==='delete'){
      await api('/api/entries/'+req.data.id,'DELETE');
    } else if(req.action==='toggleReject'){
      await api('/api/entries/'+req.data.id+'/reject','POST',{rejected:req.data.newRejected});
    } else if(req.action==='workerPayment'){
      const payments = JSON.parse(localStorage.getItem('kayan_worker_payments')||'[]');
      payments.push({id:'wp_'+Date.now(),workerKey:req.data.workerKey,amount:req.data.amount,note:req.data.note||'حساب عامل خارجي',date:today()});
      localStorage.setItem('kayan_worker_payments',JSON.stringify(payments));
      await api('/api/worker-payments','POST',{payments});
      await api('/api/entries','POST',{supId:0,supName:'المدير',project:'مصروفات العمالة',type:'petty',desc:'حساب عامل خارجي: '+req.data.workerKey.split('||')[0],date:today(),payMethod:'cash',subtotal:req.data.amount,taxRate:0,taxAmt:0,total:req.data.amount});
    }
    // Save req data before filtering
    const _reqData = pending.find(r=>r.id===reqId) || req;
    // Remove from pending
    pending = pending.filter(r=>r.id!==reqId);
    localStorage.setItem('kayan_pending',JSON.stringify(pending));
    await api('/api/pending','POST',{pending});
    // Update history on server directly (not from localStorage)
    const _hrRes = await api('/api/pending-history').catch(()=>({history:[]}));
    const _hist = (_hrRes&&_hrRes.history)||[];
    const _hi = _hist.findIndex(r=>r.id===reqId);
    if(_hi>=0){ _hist[_hi].status='approved'; }
    else { _hist.push(Object.assign({},_reqData,{status:'approved'})); }
    await api('/api/pending-history','POST',{history:_hist});
    localStorage.setItem('kayan_my_requests',JSON.stringify(_hist));
    DB = await api('/api/db'); if(DB&&DB.supervisors)localStorage.setItem('kayan_db_cache',JSON.stringify(DB));
    alert('✅ تم تنفيذ الطلب');
    rPendingRequests();
  }catch(e){
    alert('❌ '+e.message);
  }
}

async function rejectPending(reqId){
  if(!confirm('رفض هذا الطلب؟')) return;
  let pending = JSON.parse(localStorage.getItem('kayan_pending')||'[]');
  // Save the request BEFORE filtering
  const _rejReq = pending.find(r=>r.id===reqId) || {id:reqId};
  pending = pending.filter(r=>r.id!==reqId);
  localStorage.setItem('kayan_pending',JSON.stringify(pending));
  await api('/api/pending','POST',{pending});
  // Update history on server
  const _hrRes2 = await api('/api/pending-history').catch(()=>({history:[]}));
  const _hist2 = (_hrRes2&&_hrRes2.history)||[];
  const _hi2 = _hist2.findIndex(r=>r.id===reqId);
  if(_hi2>=0){ _hist2[_hi2].status='rejected'; }
  else { _hist2.push(Object.assign({},_rejReq,{status:'rejected'})); }
  await api('/api/pending-history','POST',{history:_hist2});
  localStorage.setItem('kayan_my_requests',JSON.stringify(_hist2));
  rPendingRequests();
}

// Accountant submits a pending request instead of direct action
async function submitPendingRequest(action, desc, amount, data, entryId){
  const pending = JSON.parse(localStorage.getItem('kayan_pending')||'[]');
  const reqId = 'req_'+Date.now();
  // Upload image to Cloudinary immediately so manager can see it
  if(data && data.b64Image && !data.imageUrl){
    try{
      const upRes = await api('/api/upload-image','POST',{b64:data.b64Image});
      if(upRes && upRes.url) data.imageUrl = upRes.url;
    }catch(e2){ console.error('img upload failed',e2); }
    delete data.b64Image;
  }
  const req = {
    id: reqId,
    action, desc, amount: amount||0,
    data: data||null,
    entryId: entryId||null,
    date: today(),
    submittedAt: new Date().toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'}),
    submittedBy: CU?.name||''
  };
  pending.push(req);
  localStorage.setItem('kayan_pending',JSON.stringify(pending));
  await api('/api/pending','POST',{pending}).catch(()=>{});
  alert('✅ تم إرسال الطلب للمدير للموافقة');
}

async function restoreBackup(inp){
  const file=inp.files[0];if(!file)return;
  const status=document.getElementById('restore-status');
  
  if(!confirm('تأكيد: سيتم استبدال جميع البيانات الحالية بالنسخة الاحتياطية. هل أنت متأكد؟')){
    inp.value='';return;
  }
  
  status.style.display='block';
  status.innerHTML='<div style="background:var(--al);border-radius:7px;padding:9px 12px;font-size:12px;color:#C8960C">جاري استعادة البيانات...</div>';
  
  try{
    const text=await file.text();
    const backup=JSON.parse(text);
    const res=await api('/api/restore','POST',backup);
    
    if(res.ok){
      DB=await api('/api/db');
      status.innerHTML=`<div class="ok"><svg width="15" height="15" fill="none" stroke="var(--primary)" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>تم الاستعادة بنجاح — ${res.entries} معاملة و${res.supervisors} مشرف</div>`;
      setTimeout(()=>{rSetup();status.style.display='none';},2000);
    }else{
      status.innerHTML=`<div class="err" style="display:block">${res.error||'فشل في الاستعادة'}</div>`;
    }
  }catch(e){
    status.innerHTML=`<div class="err" style="display:block">الملف غير صحيح — تأكد أنه ملف JSON من النسخة الاحتياطية</div>`;
  }
  inp.value='';
}

function mfCalc(){
  const tot  = parseFloat(document.getElementById('mf-total')?.value)||0;
  const rate = parseFloat(document.getElementById('mf-rate')?.value)||0;
  // المبلغ المدخل هو الإجمالي — نحسب الصافي والضريبة
  const sub = rate>0 ? tot/(1+rate/100) : tot;
  const vat = tot - sub;
  const summary = document.getElementById('mf-summary');
  if(summary){
    summary.style.display = 'flex';
    const s = document.getElementById('mf-sub');
    const v = document.getElementById('mf-vat');
    const t = document.getElementById('mf-tot');
    if(s) s.textContent = fmt(sub);
    if(v) v.textContent = fmt(vat);
    if(t) t.textContent = fmt(tot);
  }
  // Auto set type
  const typeEl = document.getElementById('mf-type');
  if(typeEl && rate>0) typeEl.value='tax';
  else if(typeEl) typeEl.value='petty';
}

  const desc    = document.getElementById('mf-desc')?.value.trim();
  const tot     = parseFloat(document.getElementById('mf-total')?.value)||0;
  const rate    = parseFloat(document.getElementById('mf-rate')?.value)||0;
  const invNo   = document.getElementById('mf-invno')?.value.trim();
  const date    = document.getElementById('mf-date')?.value || today();
  const type    = document.getElementById('mf-type')?.value || 'petty';
  const err     = document.getElementById('serr');

  if(!supId){ err.style.display='block'; err.textContent='⚠️ اختر المشرف'; return; }
  if(!project){ err.style.display='block'; err.textContent='⚠️ اختر المشروع'; return; }
  if(!desc){ err.style.display='block'; err.textContent='⚠️ أدخل وصف الفاتورة'; return; }
  if(!tot){ err.style.display='block'; err.textContent='⚠️ أدخل المبلغ'; return; }

  const sub = rate>0 ? tot/(1+rate/100) : tot;
  const vat = tot - sub;
  const sup = DB.supervisors.find(s=>s.id===supId);
  err.style.display='none';

  try{
    const res = await api('/api/entries','POST',{
      supId, supName:sup?.name||'', project, type,
      desc, supplier:desc,
      invoiceNo:invNo||null,
      date, payMethod:'cash',
      subtotal:parseFloat(sub.toFixed(2)),
      taxRate:rate,
      taxAmt:parseFloat(vat.toFixed(2)),
      total:tot
    });
    if(res.error) throw new Error(res.error);
    DB = await api('/api/db'); if(DB&&DB.supervisors)localStorage.setItem('kayan_db_cache',JSON.stringify(DB));
    closeScan();
    // Show success
    const ok = document.createElement('div');
    ok.className='ok'; ok.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:999;padding:10px 20px;background:#34d399;color:#000;border-radius:10px;font-weight:700;font-size:13px';
    ok.textContent='✅ تم حفظ: '+desc+' — '+fmt(tot)+' ﷼';
    document.body.appendChild(ok);
    setTimeout(()=>ok.remove(), 2500);
  }catch(e){
    err.style.display='block';
    err.textContent='❌ '+e.message;
  }
}

function compressImg(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=1600;let w=img.width,h=img.height;
        if(w>MAX||h>MAX){const ratio=Math.min(MAX/w,MAX/h);w=Math.round(w*ratio);h=Math.round(h*ratio);}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        const src=cv.toDataURL('image/jpeg',.92);
        res({b64:src.split(',')[1],src});
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(file);
  });
}

async function pickFile(inp){
  const file=inp.files[0];if(!file)return;
  
  if(file.type==='application/pdf'){
    // Read PDF as base64 and send directly to AI
    document.getElementById('sdrop').style.display='none';
    const p=document.getElementById('sprev');
    const reader=new FileReader();
    reader.onload=e=>{
      imgB64=e.target.result.split(',')[1];
      imgSrc=e.target.result;
      p.src='data:image/svg+xml;base64,'+btoa('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="80" viewBox="0 0 200 80"><rect width="200" height="80" rx="8" fill="#dcfce7"/><text x="100" y="45" text-anchor="middle" font-size="13" fill="#166534">✓ PDF جاهز للتحليل</text></svg>');
      p.style.display='block';
    };
    reader.readAsDataURL(file);
  } else {
    const {b64,src}=await compressImg(file);
    imgB64=b64;imgSrc=src;
    const p=document.getElementById('sprev');p.src=src;p.style.display='block';
    document.getElementById('sdrop').style.display='none';
  }
}

async function runAI(){
  const txt=(document.getElementById('stxt')?.value||'').trim();
  const err=document.getElementById('serr');
  if(!imgB64&&!txt){
    const sfile=document.getElementById('sfile');
    if(sfile?.files[0]?.type==='application/pdf'&&!imgB64){
      err.style.display='block';err.textContent='جاري تحويل PDF... انتظر ثانية ثم اضغط تحليل مرة أخرى';return;
    }
    err.style.display='block';err.textContent='يرجى رفع صورة أو كتابة نص';return;
  }
  err.style.display='none';

  // ── إذا كان نص فقط بدون صورة — حاول استخراج مباشرة ──
  if(!imgB64 && txt){
    // استخراج المبلغ: أرقام في النص (مثال: "أكل عمال 450 ريال")
    const amountMatch = txt.match(/(\d[\d,]*(?:\.\d+)?)\s*(?:ريال|ر\.س|SAR|﷼)?/i);
    const invoiceMatch = txt.match(/(?:INV|رقم|فاتورة|inv)[-\s]?(\w+)/i);
    if(amountMatch){
      const total = parseFloat(amountMatch[1].replace(/,/g,''));
      parsed = {
        desc: txt.replace(amountMatch[0],'').trim() || txt,
        supplier: txt.replace(amountMatch[0],'').trim() || txt,
        type: 'petty',
        total: total,
        subtotal: total,
        taxRate: 0,
        taxAmt: 0,
        invoiceNo: invoiceMatch ? invoiceMatch[1] : null,
        date: today(),
        payMethod: 'cash',
        items: []
      };
      showResult();
      return;
    }
  }
  document.getElementById('ss1').style.display='none';
  const ldg=document.getElementById('sldg');ldg.style.display='block';
  document.getElementById('ltxt').textContent=imgB64?'جاري قراءة الصورة...':'جاري تحليل النص...';
  try{
    const sfile=document.getElementById('sfile');const isPdf=sfile?.files[0]?.type==='application/pdf';
    const params={text:txt,isPdf:!!isPdf};if(imgB64)params.b64=imgB64;
    const result=await api('/api/analyze','POST',params);
    if(result.error)throw new Error(result.error);
    parsed=result;ldg.style.display='none';showResult();
  }catch(e){
    ldg.style.display='none';
    document.getElementById('ss1').style.display='block';
    err.style.display='block';
    err.textContent='خطأ: '+(e.message||'حاول مرة أخرى');
  }
}

function recalcTotal(){
  var sub=parseFloat(document.getElementById('r-subtotal')?.value)||0;
  var rate=parseFloat(document.getElementById('r-taxrate')?.value)||0;
  var vat=Math.round(sub*rate/100*100)/100;

  parsed.subtotal=sub; parsed.taxRate=rate; parsed.taxAmt=vat; parsed.total=total;
  var d=document.getElementById('r-total-disp');
  if(d) d.textContent=fmt(total)+' ﷼';
}

async function saveEntry(){
  const supId=parseInt(document.getElementById('csup').value);
  const project=document.getElementById('cproj').value;
  if(!supId||isNaN(supId)){alert('⚠️ يجب اختيار المشرف أولاً');return;}
  if(!project){alert('⚠️ يجب اختيار المشروع أولاً');return;}
  // المحاسب يرسل الطلب للمدير بدل الحفظ المباشر
  if(ROLE==='accountant'){
    const total=parsed.total||parsed.subtotal||0;
    const desc=parsed.desc||parsed.supplier||'فاتورة من المحاسب';

    // فحص التكرار قبل عرضها على المدير: نفس رقم الفاتورة + التاريخ + المبلغ
    const _norm = s => (s||'').toString().trim().toLowerCase().replace(/\s+/g,'');
    if(parsed.invoiceNo && parsed.date){
      const dup = DB.entries.find(e=>
        (e.type==='petty'||e.type==='tax') &&
        e.invoiceNo && _norm(e.invoiceNo)===_norm(parsed.invoiceNo) &&
        e.date===parsed.date &&
        Math.abs((e.total||0)-total)<0.5
      );
      if(dup){
        const who = DB.supervisors.find(s=>s.id==dup.supId)?.name||'مشرف آخر';
        alert('⚠️ هذه الفاتورة مكررة!\nرقم: '+parsed.invoiceNo+' | تاريخ: '+dup.date+'\nمسجلة مسبقاً عند: '+who+'\n\nلن يتم إرسالها للمدير.');
        return;
      }
    }

    submitPendingRequest('add', desc+' — '+fmt(total)+' ﷼ ('+project+')', total, {
      supId, supName:DB.supervisors.find(s=>s.id===supId)?.name||'',
      project, type:parsed.type||'petty', desc, supplier:parsed.supplier||'',
      invoiceNo:parsed.invoiceNo||'', date:parsed.date||today(),
      payMethod:parsed.payMethod||'cash',
      subtotal:parsed.subtotal||0, taxRate:parsed.taxRate||0,
      taxAmt:parsed.taxAmt||0, total:total, items:parsed.items||[],
      imageUrl:parsed.imageUrl||null,
      b64Image:(!parsed.imageUrl&&imgB64)?imgB64:null,
      isPdf:!!(imgSrc&&imgSrc.includes('pdf'))||false,
      uploadedBy:CU?.name||'المحاسب', uploadedByRole:'accountant'
    });
    closeScan();
    return;
  }
  // ── فحص وقت الرفع (للمشرف فقط) ── الشيخ علي مستثنى ──
  const _isExemptSup = ROLE==='supervisor' && (DB.supervisors.find(s=>s.id==supId)?.name||'').trim()==='الشيخ علي';
  if(ROLE==='supervisor' && !_isExemptSup){
    const nowHour = new Date().getHours();
    if(nowHour < 6 || nowHour >= 18){
      const timeStr = new Date().toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'});
      alert('⚠️ خارج وقت العمل\nوقت الرفع المسموح: 6:00 صباحاً — 6:00 مساءً\nالوقت الحالي: '+timeStr+'\nيرجى رفع الفاتورة خلال أوقات العمل');
      return;
    }
  }
  if(ROLE==='supervisor' && !_isExemptSup){
    const entryDate=parsed.date||'';
    const todayStr=today();
    if(entryDate&&entryDate!==todayStr){
      alert('⚠️ لا يمكن قبول الفاتورة - تاريخ الفاتورة ('+entryDate+') لا يطابق تاريخ اليوم ('+todayStr+')');
      return;
    }
  }
  // تطبيق الحقول اليدوية
  
  const supName=DB.supervisors.find(s=>s.id==supId)?.name||'';
  const uploadTs = new Date().toISOString();
  const entry={supId,supName,project,type:parsed.type||'petty',desc:parsed.desc||'فاتورة',supplier:parsed.supplier||'',invoiceNo:parsed.invoiceNo||'',date:parsed.date||today(),payMethod:parsed.payMethod||'cash',subtotal:parsed.subtotal||0,taxRate:parsed.taxRate||0,taxAmt:parsed.taxAmt||0,total:parsed.total||parsed.subtotal||0,items:parsed.items||[],uploadedAt:uploadTs};
  if(imgB64) entry.b64Image = imgB64;
  // ── فحص التكرار: رفض فقط لو نفس التاريخ + نفس المبلغ + نفس رقم الفاتورة معاً ──
  const _norm = s => (s||'').toString().trim().toLowerCase().replace(/\s+/g,'');
  const invoices = DB.entries.filter(e=>e.type==='petty'||e.type==='tax');

  if(entry.invoiceNo && entry.invoiceNo.trim()){
    const dup = invoices.find(e=>
      e.invoiceNo &&
      _norm(e.invoiceNo)===_norm(entry.invoiceNo) &&
      e.date===(entry.date||today()) &&
      Math.abs((e.total||0)-(entry.total||0))<0.5
    );
    if(dup){
      const who = DB.supervisors.find(s=>s.id==dup.supId)?.name||'مشرف آخر';
      alert('⚠️ فاتورة مكررة\nرقم: '+entry.invoiceNo+'\nتاريخ: '+dup.date+'\nمسجلة عند: '+who);
      return;
    }
  }
  document.getElementById('ss2').style.display='none';
  document.getElementById('sldg').style.display='block';
  document.getElementById('ltxt').textContent='جاري الحفظ...';
  try{
    await api('/api/entries','POST',entry);
    DB=await api('/api/db');
    document.getElementById('sldg').style.display='none';
    document.getElementById('sdone').style.display='block';
    document.getElementById('dsum').innerHTML=`${parsed.desc} · ${project}<br><strong style="color:#C8960C">${fmt(parsed.total)} ﷼</strong>`;
    if(ROLE==='supervisor'){
    const mc=document.getElementById('mc');
    if(mc){
      mc.innerHTML+=`<div class="shdr">الرسوم البيانية</div><div class="card" style="padding:13px"><div class="ctitle">صرفي على المشاريع</div><canvas id="ch-proj-sup" style="max-height:200px"></canvas></div><div class="card" style="padding:13px"><div class="ctitle">نثرية مقابل ضريبية</div><canvas id="ch-type-sup" style="max-height:180px"></canvas></div>`;
      initCharts('sup',DB.entries.filter(e=>e.supId==CU.id),null);
    }
  }else rDash();
  }catch(e){
    document.getElementById('sldg').style.display='none';
    document.getElementById('ss2').style.display='block';
    document.getElementById('serr').style.display='block';
    document.getElementById('serr').textContent='خطأ في الحفظ';
  }
}

async function doTransfer(){
  const fromId = document.getElementById('tf-from').value;
  const toId = document.getElementById('tf-to').value;
  const amount = parseFloat(document.getElementById('tf-amount').value)||0;
  // المحاسب يرسل طلب موافقة للمدير
  if(ROLE==='accountant'){
    const fromSup = DB.supervisors.find(s=>s.id==fromId);
    const toSup   = DB.supervisors.find(s=>s.id==toId);
    if(!fromSup||!toSup||!amount){alert('⚠️ تأكد من البيانات');return;}
    submitPendingRequest('transfer',
      'تحويل '+fmt(amount)+' ﷼ من '+fromSup.name+' إلى '+toSup.name,
      amount,
      {fromId,toId,amount,note:document.getElementById('tf-note')?.value||''}
    );
    return;
  }
  const note = document.getElementById('tf-note')?.value||'';
  const err = document.getElementById('tf-err');
  const ok = document.getElementById('tf-ok');
  
  err.style.display='none'; ok.style.display='none';
  
  if(!amount || parseFloat(amount)<=0){err.style.display='block';err.textContent='أدخل مبلغاً صحيحاً';return;}
  if(fromId===toId){err.style.display='block';err.textContent='اختر مشرفَين مختلفَين';return;}
  
  try{
    const res = await api('/api/transfer','POST',{fromId,toId,amount:parseFloat(amount),note});
    if(res.error){err.style.display='block';err.textContent=res.error;return;}
    DB = await api('/api/db'); if(DB&&DB.supervisors)localStorage.setItem('kayan_db_cache',JSON.stringify(DB));
    document.getElementById('tf-amount').value='';
    document.getElementById('tf-note').value='';
    document.getElementById('tf-ok-msg').textContent = res.message;
    ok.style.display='flex';
    setTimeout(()=>{ok.style.display='none';rTransfer();},2500);
  }catch(e){
    err.style.display='block';err.textContent=e.message||'خطأ في الاتصال';
  }
}

// ── LABOR REPORT ───────────────────────
function rLaborReport(){
  const laborEntries = DB.entries.filter(e=>e.type==='labor'||e.type==='labor_waiting');
  if(!laborEntries.length) return '<div class="card"><div class="ctitle">تقرير العمالة</div><div class="empty">لا توجد سجلات عمالة بعد</div></div>';
  
  // Group by date
  const byDate = {};
  laborEntries.forEach(e=>{
    const d = e.date;
    if(!byDate[d]) byDate[d] = {date:d, company:0, external:0, cost:0, projects:new Set(), workers:[]};
    byDate[d].company += e.laborDetails?.companyCount||0;
    byDate[d].external += e.laborDetails?.externalCount||0;
    byDate[d].cost += e.laborDetails?.laborTotal||0;
    byDate[d].projects.add(e.project);
    if(e.laborDetails?.companyNames) byDate[d].workers.push(...(e.laborDetails.companyNames.split('، ')));
  });

  // Group by worker (attendance)
  const workerAttendance = {};
  laborEntries.forEach(e=>{
    if(e.laborDetails?.presentWorkers){
      e.laborDetails.presentWorkers.forEach(w=>{
        if(!workerAttendance[w.name]) workerAttendance[w.name]={name:w.name,days:0};
        workerAttendance[w.name].days++;
      });
    }
  });

  const sortedDates = Object.values(byDate).sort((a,b)=>b.date.localeCompare(a.date));
  const totalCompany = laborEntries.reduce((a,e)=>a+(e.laborDetails?.companyCount||0),0);
  const totalExternal = laborEntries.reduce((a,e)=>a+(e.laborDetails?.externalCount||0),0);
  const totalCost = laborEntries.reduce((a,e)=>a+(e.laborDetails?.laborTotal||0),0);

  return `
    <div class="card">
      <div class="ctitle">تقرير العمالة</div>
      <div class="sg" style="margin-bottom:12px">
        <div class="stat"><div class="sl">إجمالي عمال الشركة</div><div class="sv" style="color:rgba(255,255,255,.9)">${totalCompany} <span style="font-size:12px">يوم عمل</span></div></div>
        <div class="stat"><div class="sl">إجمالي العمال الخارجيين</div><div class="sv" style="color:var(--b)">${totalExternal} <span style="font-size:12px">يوم عمل</span></div></div>
        <div class="stat"><div class="sl">إجمالي التكلفة</div><div class="sv" style="color:var(--r)">${fmt(totalCost)} <span style="font-size:12px">﷼</span></div></div>
        <div class="stat"><div class="sl">أيام العمل المسجلة</div><div class="sv">${Object.keys(byDate).length} <span style="font-size:12px">يوم</span></div></div>
      </div>
      
      <div class="ctitle" style="margin-bottom:8px">تفاصيل يومية</div>
      ${sortedDates.map(d=>`
        <div style="border-radius:8px;padding:10px 12px;margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <div style="font-size:13px;font-weight:700;color:rgba(255,255,255,.9)">${d.date}</div>
            <div style="font-size:12px;color:rgba(255,255,255,.75)">${fmt(d.cost)} ﷼</div>
          </div>
          <div style="display:flex;gap:12px;font-size:12px">
            <span style="color:#166534">🏢 شركة: <strong>${d.company}</strong></span>
            <span style="color:var(--b)">👷 خارجي: <strong>${d.external}</strong></span>
            <span style="color:rgba(255,255,255,.75)">📋 ${Array.from(d.projects).join('، ')}</span>
          </div>
        </div>`).join('')}
    </div>
    ${Object.keys(workerAttendance).length ? `
    <div class="card">
      <div class="ctitle">حضور عمال الشركة</div>
      ${Object.values(workerAttendance).sort((a,b)=>b.days-a.days).map(w=>`
        <div class="txr">
          <div style="font-size:13px;font-weight:600">${w.name}</div>
          <div style="font-size:13px;font-weight:700;color:rgba(255,255,255,.9)">${w.days} يوم</div>
        </div>`).join('')}
    </div>` : ''}`;
}

// ── SHARED LABOR TABLE ──────────────────
function buildLaborTable(laborEntries, fromDate, toDate){
  // Filter by date if provided
  if(fromDate||toDate){
    laborEntries = laborEntries.filter(e=>(!fromDate||e.date>=fromDate)&&(!toDate||e.date<=toDate));
  }
  const externalRate = (DB.laborRates||{}).external||150;
  const companyRate = (DB.laborRates||{}).company||100;

  const extW={};
  laborEntries.forEach(e=>{
    if(e.laborDetails?.externalWorkersList){
      e.laborDetails.externalWorkersList.forEach(w=>{
        const k=w.name+'||'+w.jobTitle;
        if(!extW[k])extW[k]={name:w.name,jobTitle:w.jobTitle,days:0,total:0,dates:[],projects:new Set()};
        extW[k].days++;
        extW[k].total+=externalRate;
        if(e.date&&!extW[k].dates.includes(e.date))extW[k].dates.push(e.date);
        if(e.project)extW[k].projects.add(e.project);
      });
    }
  });

  const compW={};
  laborEntries.forEach(e=>{
    if(e.laborDetails?.presentWorkers){
      e.laborDetails.presentWorkers.forEach(w=>{
        if(!compW[w.name])compW[w.name]={name:w.name,days:0,total:0,dates:[],projects:new Set()};
        compW[w.name].days++;
        compW[w.name].total+=companyRate;
        if(e.date&&!compW[w.name].dates.includes(e.date))compW[w.name].dates.push(e.date);
        if(e.project)compW[w.name].projects.add(e.project);
      });
    }
  });

  const extList=Object.values(extW).sort((a,b)=>b.days-a.days);
  const compList=Object.values(compW).sort((a,b)=>b.days-a.days);
  const totalExt=extList.reduce((a,w)=>a+w.days,0);
  const totalComp=compList.reduce((a,w)=>a+w.days,0);

  return `
    ${extList.length?`
    <div class="shdr">👷 العمال الخارجيون — إجمالي الأيام</div>
    <div class="card" style="padding:0;overflow:hidden">
      <div style="display:grid;grid-template-columns:2fr 1fr 1fr;background:var(--primary);color:var(--gold-light);padding:10px 14px;font-size:11px;font-weight:700">
        <span>الاسم / الصفة</span><span style="text-align:center">الأيام</span><span style="text-align:center">الإجمالي</span>
      </div>
      ${extList.map((w,i)=>`
        <div style="display:grid;grid-template-columns:2fr 1fr 1fr;padding:10px 14px;background:${'transparent'}">
          <div>
            <div style="font-size:13px;font-weight:700;color:#FFFFFF">${w.name}</div>
            <div style="font-size:10px;color:rgba(255,255,255,.75)">${w.jobTitle} · ${[...w.projects].join('،')}</div>
            <div style="font-size:10px;color:rgba(255,255,255,.75);margin-top:2px">${w.dates.sort().join(' · ')}</div>

async function moveWorkerToProject(entryId, workerType, idx){
  const e = DB.entries.find(x=>x.id===entryId);
  if(!e){return;}
  const w = workerType==='company' ? (e.laborDetails?.presentWorkers||[])[idx] : (e.laborDetails?.externalWorkersList||[])[idx];
  if(!w){return;}
  const targetProject = document.getElementById('mv-proj-'+workerType+'-'+idx)?.value;
  const err = document.getElementById('mv-err');
  if(!targetProject){err.style.display='block';err.textContent='⚠️ اختر مشروعاً لنقل العامل إليه';return;}
  try{
    const res = await api('/api/labor/move-worker','POST',{
      entryId, workerType, name:w.name, jobTitle:w.jobTitle||'', targetProject
    });
    if(res.error) throw new Error(res.error);
    DB = await api('/api/db'); if(DB&&DB.supervisors)localStorage.setItem('kayan_db_cache',JSON.stringify(DB));
    document.getElementById('edit-labor-modal').remove();
    rLaborMgr();
  }catch(ex){
    err.style.display='block';
    err.textContent='❌ '+ex.message;
  }
}

// ── تقرير عمالة PDF لكل مشروع (عمالة داخلية وخارجية) ──
function exportProjectLaborPDF(project, fromDate, toDate){
  if(!project){alert('يرجى اختيار مشروع أولاً');return;}
  let laborEntries = DB.entries.filter(e=>(e.type==='labor'||e.type==='labor_waiting')&&e.project===project);
  if(fromDate) laborEntries = laborEntries.filter(e=>e.date>=fromDate);
  if(toDate) laborEntries = laborEntries.filter(e=>e.date<=toDate);
  laborEntries.sort((a,b)=>a.date.localeCompare(b.date));

  if(!laborEntries.length){alert('لا توجد سجلات عمالة لهذا المشروع في الفترة المحددة');return;}

  const externalRate = (DB.laborRates||{}).external||150;
  const companyRate = (DB.laborRates||{}).company||100;

  const extW={}, compW={};
  laborEntries.forEach(e=>{
    if(e.laborDetails?.externalWorkersList){
      e.laborDetails.externalWorkersList.forEach(w=>{
        const k=w.name+'||'+w.jobTitle;
        if(!extW[k])extW[k]={name:w.name,jobTitle:w.jobTitle,days:0,total:0,dates:[]};
        extW[k].days++; extW[k].total+=externalRate;
        if(e.date&&!extW[k].dates.includes(e.date))extW[k].dates.push(e.date);
      });
    }
    if(e.laborDetails?.presentWorkers){
      e.laborDetails.presentWorkers.forEach(w=>{
        if(!compW[w.name])compW[w.name]={name:w.name,jobTitle:w.jobTitle||'',days:0,total:0,dates:[]};
        compW[w.name].days++; compW[w.name].total+=companyRate;
        if(e.date&&!compW[w.name].dates.includes(e.date))compW[w.name].dates.push(e.date);
      });
    }
  });
  const extList = Object.values(extW).sort((a,b)=>b.days-a.days);
  const compList = Object.values(compW).sort((a,b)=>b.days-a.days);
  const totalExtDays = extList.reduce((a,w)=>a+w.days,0);
  const totalCompDays = compList.reduce((a,w)=>a+w.days,0);
  const totalExtCost = extList.reduce((a,w)=>a+w.total,0);
  const totalCompCost = compList.reduce((a,w)=>a+w.total,0);
  const grandTotal = totalExtCost+totalCompCost;
  const now = new Date().toLocaleDateString('ar-SA',{year:'numeric',month:'long',day:'numeric'});
  const periodStr = (fromDate||toDate) ? ((fromDate||'البداية')+' → '+(toDate||'الآن')) : 'كل الفترات';

    <table><tr><th>الاسم</th>${list.some(w=>w.jobTitle)?'<th>الصفة</th>':''}<th>عدد الأيام</th>${showCost?'<th>الإجمالي</th>':''}<th>التواريخ</th></tr>
    ${list.map(w=>`<tr><td style="font-weight:700">${w.name}</td>${list.some(x=>x.jobTitle)?'<td>'+(w.jobTitle||'—')+'</td>':''}<td style="text-align:center">${w.days}</td>${showCost?'<td style="font-weight:700;color:'+color+'">'+fmt(w.total)+' ﷼</td>':''}<td style="font-size:10px">${w.dates.sort().join('، ')}</td></tr>`).join('')}
    <tr class="tr"><td colspan="${1+(list.some(w=>w.jobTitle)?1:0)}">الإجمالي</td><td style="text-align:center">${list.reduce((a,w)=>a+w.days,0)} يوم</td>${showCost?'<td>'+fmt(list.reduce((a,w)=>a+w.total,0))+' ﷼</td>':''}<td></td></tr>
    </table>` : '';

  const dailyLog = laborEntries.map(e=>{
    const comp = e.laborDetails?.presentWorkers?.map(w=>w.name).join('، ')||'—';
    const ext = e.laborDetails?.externalWorkersList?.map(w=>w.name+' ('+w.jobTitle+')').join('، ')||'—';

  }).join('');

  const html='<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><title>تقرير عمالة المشروع</title>'
    +'<style>@import url("https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap");*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Tajawal",sans-serif;direction:rtl;color:#000;padding:24px;font-size:12px}h1{font-size:18px;font-weight:900;margin-bottom:4px}h2{font-size:12px;font-weight:800}.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.box{background:#f5f5f5;border:1px solid #ddd;border-radius:5px;padding:8px;text-align:center}.bl{font-size:10px;color:#555;margin-bottom:2px}.bv{font-size:15px;font-weight:800}table{width:100%;border-collapse:collapse;font-size:11px;margin:10px 0}th{background:#000;color:#fff;padding:6px;text-align:right;print-color-adjust:exact;-webkit-print-color-adjust:exact}td{padding:5px 6px;border:1px solid #ddd}tr:nth-child(even)td{background:#f9f9f9}.tr td{background:#111;color:#fff;font-weight:800}</style></head><body>'
    +'<div style="text-align:right;margin-bottom:14px"><img src="'+CO_LOGO+'" style="max-width:200px;max-height:90px;height:auto"></div>'

    +dailyLog
    +'<tr class="tr"><td colspan="3">الإجمالي</td><td>'+fmt(grandTotal)+' ﷼</td></tr></table>'

  const win=window.open('','_blank');win.document.write(html);win.document.close();setTimeout(()=>win.print(),700);
}

// ── تقرير حضور شهري لكل العمال (داخليين وخارجيين) — كل شهر منفصل بعمود لوحده ──
const _arMonthNames = {'01':'يناير','02':'فبراير','03':'مارس','04':'أبريل','05':'مايو','06':'يونيو','07':'يوليو','08':'أغسطس','09':'سبتمبر','10':'أكتوبر','11':'نوفمبر','12':'ديسمبر'};

function _buildMonthlyAttendanceData(fromDate, toDate, opts){
  opts = opts || {};
  let laborEntries = DB.entries.filter(e=>(e.type==='labor'||e.type==='labor_waiting')&&!e.rejected);
  if(fromDate) laborEntries = laborEntries.filter(e=>e.date>=fromDate);
  if(toDate) laborEntries = laborEntries.filter(e=>e.date<=toDate);

  const workers = {};
  const monthsSet = new Set();
  const includeCompany = opts.types ? opts.types.includes('company') : true;
  const includeExternal = opts.types ? opts.types.includes('external') : true;

  laborEntries.forEach(e=>{
    const month = (e.date||'').substring(0,7); // YYYY-MM
    if(!month) return;
    if(opts.months && !opts.months.includes(month)) return;
    if(includeCompany) (e.laborDetails?.presentWorkers||[]).forEach(w=>{
      const nm = _normWorkerName(w.name);
      if(opts.workerNames && !opts.workerNames.includes('company||'+nm)) return;
      const k = 'company||'+nm;
      if(!workers[k]) workers[k]={name:nm,type:'company',months:{},total:0};
      workers[k].months[month]=(workers[k].months[month]||0)+1;
      workers[k].total++;
      monthsSet.add(month);
    });
    if(includeExternal) (e.laborDetails?.externalWorkersList||[]).forEach(w=>{
      const nm = _normWorkerName(w.name);
      if(opts.workerNames && !opts.workerNames.includes('external||'+nm)) return;
      const k = 'external||'+nm;
      if(!workers[k]) workers[k]={name:nm,type:'external',months:{},total:0};
      workers[k].months[month]=(workers[k].months[month]||0)+1;
      workers[k].total++;
      monthsSet.add(month);
    });
  });

  const months = Array.from(monthsSet).sort();
  const workerList = Object.values(workers).sort((a,b)=>b.total-a.total);
  return {workerList, months};
}

function _runFilteredAttendanceExport(format, fromDate, toDate){
  const selectedMonths = Array.from(document.querySelectorAll('.att-month-chk:checked')).map(c=>c.dataset.month);

  const includeExternal = document.getElementById('att-type-external')?.checked;

  if(includeExternal) types.push('external');

  if(!selectedWorkers.length){alert('⚠️ اختر عاملاً واحداً على الأقل');return;}

  const opts = {months:selectedMonths, workerNames:selectedWorkers, types};
  const el = document.getElementById('att-filter-modal');
  if(el) el.remove();

function exportMonthlyAttendanceExcel(fromDate, toDate, opts){
  const {workerList, months} = _buildMonthlyAttendanceData(fromDate, toDate, opts);
  if(!workerList.length){alert('لا توجد بيانات حضور تطابق الاختيار');return;}
  const monthLabels = months.map(m=>_arMonthNames[m.substring(5,7)]+' '+m.substring(0,4));

  const rows = workerList.map(w=>{
    const row = {'العامل':w.name, 'النوع':w.type==='company'?'داخلي':'خارجي'};
    months.forEach((m,i)=>{ row[monthLabels[i]] = w.months[m]||0; });
    row['الإجمالي'] = w.total;
    return row;
  });
  const totalsRow = {'العامل':'الإجمالي','النوع':''};
  months.forEach((m,i)=>{ totalsRow[monthLabels[i]] = workerList.reduce((a,w)=>a+(w.months[m]||0),0); });
  totalsRow['الإجمالي'] = workerList.reduce((a,w)=>a+w.total,0);
  rows.push(totalsRow);

  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:22},{wch:10}].concat(months.map(()=>({wch:12}))).concat([{wch:12}]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'حضور شهري');
  XLSX.writeFile(wb, 'تقرير_حضور_شهري_'+(fromDate||'الكل')+'_'+(toDate||'الآن')+'.xlsx');
}

async function addWorker(){
  if(ROLE==='accountant'){
    submitPendingRequest('addWorker','إضافة عامل جديد',0,{});
    return;
  }
  const nameEl = document.getElementById('nw-name');
  const jobEl = document.getElementById('nw-job');
  if(!nameEl || !jobEl) return;
  const name = nameEl.value.trim();
  const jobTitle = jobEl.value.trim();
  if(!name){nameEl.style.borderColor='var(--r)';return;}
  nameEl.style.borderColor='';
  try{
    const res = await api('/api/workers','POST',{name,jobTitle});
    if(res.ok){
      nameEl.value='';
      jobEl.value='';
      DB = await api('/api/db'); if(DB&&DB.supervisors)localStorage.setItem('kayan_db_cache',JSON.stringify(DB));
      rLaborMgr();
    }
  }catch(e){console.error('addWorker error:',e);}
}

async function deleteWorker(id){
  if(!confirm('حذف العامل؟')) return;
  await api('/api/workers/'+id,'DELETE');
  DB = await api('/api/db'); if(DB&&DB.supervisors)localStorage.setItem('kayan_db_cache',JSON.stringify(DB));
  rLaborMgr();
}

let waitExtCount = 0;


function buildSupWorkersList(workers){
  if(!workers||!workers.length) return '<div style="font-size:12px;color:rgba(255,255,255,.5);margin-bottom:10px">لم يُضف عمال من المدير بعد</div>';
  const registered = getRegisteredToday();
  const available = workers.filter(w=>!registered.has(w.name));
  if(!available.length) return '<div style="padding:10px;background:rgba(52,211,153,.1);border-radius:8px;font-size:12px;color:#34d399;margin-bottom:10px;text-align:center">✅ جميع العمال مسجلون اليوم</div>';
  return '<div style="margin-bottom:12px">'+available.map(function(w){
    return '<label style="display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer">'+
    '<input type="checkbox" id="cw-'+w.id+'" value="'+w.id+'" data-name="'+w.name+'" onchange="calcLabor()" style="width:18px;height:18px;accent-color:rgba(255,255,255,.9)">'+
    '<div><div style="font-size:13px;font-weight:500">'+w.name+'</div>'+
    '<div style="font-size:11px;color:rgba(255,255,255,.75)">'+(w.jobTitle||'عامل')+'</div></div></label>';
  }).join('')+'</div>';
}

function buildWaitingWorkersList(workers){
  if(!workers||!workers.length) return '<div style="font-size:12px;color:rgba(255,255,255,.5);margin-bottom:10px">لم يُضف عمال بعد</div>';
  const registered = getRegisteredToday();
  const available = workers.filter(w=>!registered.has(w.name));
  if(!available.length) return '<div style="padding:10px;background:rgba(52,211,153,.1);border-radius:8px;font-size:12px;color:#34d399;margin-bottom:10px;text-align:center">✅ جميع العمال في المشاريع اليوم</div>';
  return '<div style="margin-bottom:12px">'+available.map(w=>
    '<label style="display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer">'+
    '<input type="checkbox" id="ww-'+w.id+'" value="'+w.id+'" style="width:18px;height:18px;accent-color:#f5c842">'+
    '<div><div style="font-size:13px;font-weight:500;color:#FFFFFF">'+w.name+'</div>'+
    '<div style="font-size:11px;color:rgba(255,255,255,.5)">'+(w.jobTitle||'عامل')+'</div></div>'+
    '</label>'
  ).join('')+'</div>';
}

function getRegisteredToday(){
  const todayStr = new Date().toISOString().split('T')[0];
  const registered = new Set();
  DB.entries.filter(e=>e.type==='labor'&&e.date===todayStr).forEach(e=>{
    if(e.laborDetails && e.laborDetails.presentWorkers)
      e.laborDetails.presentWorkers.forEach(w=>registered.add(w.name));
  });
  return registered;
}

function addWaitExtWorker(){
  waitExtCount++;
  const id = waitExtCount;
  const div = document.createElement('div');
  div.id = 'wait-ext-'+id;
  div.style.cssText = 'display:flex;gap:6px;margin-bottom:7px;align-items:center';
  div.innerHTML = `
    <input type="text" placeholder="اسم العامل" id="we-name-${id}" style="flex:2">
    <select id="we-job-${id}" style="flex:2">
      <option>مليس</option><option>نجار</option><option>حداد</option>
      <option>كهربائي</option><option>سباك</option><option>دهان</option>
      <option>عامل عام</option><option>أخرى</option>
    </select>
    <button onclick="document.getElementById('wait-ext-${id}').remove()" style="border:none;background:none;color:var(--rd);cursor:pointer;font-size:18px">✕</button>`;
  document.getElementById('wait-ext-list').appendChild(div);
}

async function submitWaitingLabor(){
  if(ROLE==='accountant'){
    const proj2 = (document.getElementById('wait-proj')||{value:'انتظار - سكن'}).value||'انتظار - سكن';
    const date2 = (document.getElementById('wait-date')||{value:today()}).value||today();
    submitPendingRequest('submitLaborWaiting','تسجيل عمالة انتظار — '+proj2+' ('+date2+')',0,{type:'labor_waiting',project:proj2,date:date2});
    return;
  }
  const date = document.getElementById('wait-date')?.value || today();
  const project = document.getElementById('wait-proj')?.value;
  const err = document.getElementById('wait-err');
  const ok = document.getElementById('wait-ok');
  err.style.display='none'; ok.style.display='none';

  // Collect company workers
  const workers = DB.companyWorkers || [];
  const presentWorkers = workers.filter(w => document.getElementById('ww-'+w.id)?.checked)
    .map(w=>({id:w.id, name:w.name, jobTitle:w.jobTitle}));

  // Collect external workers
  const extEls = document.querySelectorAll('[id^="we-name-"]');
  const externalWorkersList = Array.from(extEls).map(el=>{
    const id = el.id.replace('we-name-','');
    const name = el.value.trim();
    const jobTitle = document.getElementById('we-job-'+id)?.value||'عامل';
    return name ? {name, jobTitle} : null;
  }).filter(Boolean);

  if(presentWorkers.length + externalWorkersList.length === 0){
    err.style.display='block'; err.textContent='اختر عمالاً للتسجيل'; return;
  }

  try{
    // Use manager's account (id=0) or first supervisor for logging
    // Type: 'labor_waiting' - no cost
    const res = await api('/api/labor-waiting','POST',{
      date, project, presentWorkers, externalWorkersList
    });
    if(res.error){err.style.display='block';err.textContent=res.error;return;}
    DB = await api('/api/db'); if(DB&&DB.supervisors)localStorage.setItem('kayan_db_cache',JSON.stringify(DB));
    ok.style.display='flex';
    // Reset checkboxes
    workers.forEach(w=>{const cb=document.getElementById('ww-'+w.id);if(cb)cb.checked=false;});
    waitExtCount=0;
    document.getElementById('wait-ext-list').innerHTML='';
    setTimeout(()=>{ok.style.display='none';rLaborMgr();},2000);
  }catch(e){
    err.style.display='block';err.textContent=e.message||'خطأ في الاتصال';
  }
}

async function saveLaborRates(){
  const company = parseFloat(document.getElementById('lr-company').value)||100;
  const external = parseFloat(document.getElementById('lr-external').value)||150;
  await api('/api/labor-rates','POST',{company,external});
  DB.laborRates = {company,external};
  const ok = document.getElementById('lr-ok');
  ok.style.display='flex';
  setTimeout(()=>ok.style.display='none',2000);
}

function calcLabor(){
  const rates = DB.laborRates || {company:100,external:150};
  const workers = DB.companyWorkers || [];
  // Count checked company workers
  const c = workers.filter(w => document.getElementById('cw-'+w.id)?.checked).length;
  // Count external workers with names
  const extList = document.querySelectorAll('[id^="ew-name-"]');
  const e = Array.from(extList).filter(el=>el.value.trim()).length;
  const ct = c * rates.company;
  const et = e * rates.external;
  const tot = ct + et;
  const calc = document.getElementById('lab-calc');
  if(tot > 0 || c > 0 || e > 0){
    calc.style.display='block';
    document.getElementById('lc-company').textContent = c + ' عامل × ' + fmt(rates.company) + ' = ' + fmt(ct) + ' ﷼';
    document.getElementById('lc-external').textContent = e + ' عامل × ' + fmt(rates.external) + ' = ' + fmt(et) + ' ﷼';
    document.getElementById('lc-total').textContent = fmt(tot) + ' ﷼';
  } else {
    calc.style.display='none';
  }
}

async function submitLabor(){
  if(ROLE==='accountant'){
    const proj = document.getElementById('lab-proj')?.value||'';
    if(!proj){
      const err = document.getElementById('lab-err');
      if(err){err.style.display='block';err.textContent='⚠️ يجب اختيار المشروع أولاً قبل تسجيل العمالة';}
      return;
    }
    submitPendingRequest('submitLabor', 'تسجيل عمالة — '+proj, 0, {type:'labor',project:proj});
    return;
  }
  const project = document.getElementById('lab-proj').value;
  const err = document.getElementById('lab-err');
  const ok = document.getElementById('lab-ok');
  err.style.display='none'; ok.style.display='none';

  if(!project){
    err.style.display='block';err.textContent='⚠️ يجب اختيار المشروع أولاً قبل تسجيل العمالة';return;
  }

  // Collect present company workers
  const workers = DB.companyWorkers || [];
  const presentWorkers = workers.filter(w => document.getElementById('cw-'+w.id)?.checked).map(w=>({id:w.id,name:w.name,jobTitle:w.jobTitle}));
  
  // Collect external workers
  const extList = document.querySelectorAll('[id^="ew-name-"]');
  const externalWorkersList = Array.from(extList).map(el=>{
    const id = el.id.replace('ew-name-','');
    const name = el.value.trim();
    const jobTitle = document.getElementById('ew-job-'+id)?.value||'عامل';
    return name ? {name,jobTitle} : null;
  }).filter(Boolean);
  
  if(presentWorkers.length + externalWorkersList.length === 0){
    err.style.display='block';err.textContent='اختر عمالاً للتسجيل';return;
  }
  
  try{
    const res = await api('/api/labor','POST',{supId:CU.id,project,presentWorkers,externalWorkersList});
    if(res.error){err.style.display='block';err.textContent=res.error;return;}
    DB = await api('/api/db'); if(DB&&DB.supervisors)localStorage.setItem('kayan_db_cache',JSON.stringify(DB));
    extWorkerCount = 0;
    document.getElementById('lab-ok-msg').textContent=`تم تسجيل ${presentWorkers.length+externalWorkersList.length} عامل`;
    ok.style.display='flex';
    setTimeout(()=>{ok.style.display='none';rLaborSup();},2000);
  }catch(e){
    err.style.display='block';err.textContent=e.message||'خطأ في الاتصال';
  }
}

function buildExtWorkersReport(){
  const laborEntries = DB.entries.filter(function(e){return e.type==='labor'&&!e.rejected;});
  const extRate = (DB.laborRates||{}).external||150;
  const workers = {};

  laborEntries.forEach(function(e){
    if(!e.laborDetails||!e.laborDetails.externalWorkersList) return;
    e.laborDetails.externalWorkersList.forEach(function(w){
      const k=w.name+'||'+(w.jobTitle||'');
      if(!workers[k]) workers[k]={name:w.name,jobTitle:w.jobTitle||'',days:0,total:0};
      workers[k].days++;
      workers[k].total += (e.laborDetails.externalRate||extRate);
    });
  });

  const payments = JSON.parse(localStorage.getItem('kayan_worker_payments')||'[]');
  const list = Object.entries(workers).sort(function(a,b){return b[1].days-a[1].days;});
  if(!list.length) return '';

  const totalDue   = list.reduce(function(a,w){return a+w[1].total;},0);
  const totalPaid  = payments.reduce(function(a,p){return a+p.amount;},0);
  const totalLeft  = totalDue-totalPaid;

  return '<div class="shdr" style="margin-top:14px">👷 تقرير العمال الخارجيين</div>'
    +'<div class="sg" style="margin-bottom:8px">'
    +'<div class="stat"><div class="sl">إجمالي المستحق</div><div class="sv" style="color:#f87171">'+fmt(totalDue)+' ﷼</div></div>'
    +'<div class="stat"><div class="sl">تم الصرف</div><div class="sv" style="color:#34d399">'+fmt(totalPaid)+' ﷼</div></div>'
    +'<div class="stat" style="grid-column:span 2"><div class="sl">الباقي</div><div class="sv" style="color:'+( totalLeft>0?'#f87171':'#34d399')+'">'+fmt(totalLeft)+' ﷼</div></div>'
    +'</div>'
    +list.map(function(entry){
      var k=entry[0], w=entry[1];
      var paid=payments.filter(function(p){return p.workerKey===k;}).reduce(function(a,p){return a+p.amount;},0);
      var left=w.total-paid;
      var isPaid=paid>=w.total;
      return '<div class="card" style="padding:9px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;border-right:3px solid '+(isPaid?'#34d399':'#f87171')+'">'
        +'<div><div style="font-size:12px;font-weight:700">'+(isPaid?'✅ ':'🔴 ')+w.name+'</div>'
        +'<div style="font-size:10px;color:rgba(255,255,255,.4)">'+w.jobTitle+' · '+w.days+' أيام</div></div>'
        +'<div style="text-align:left">'
        +'<div style="font-size:11px;color:rgba(255,255,255,.5)">مستحق: '+fmt(w.total)+' ﷼</div>'
        +'<div style="font-size:11px;color:#34d399">مدفوع: '+fmt(paid)+' ﷼</div>'
        +(left>0?'<div style="font-size:11px;color:#f87171;font-weight:700">باقي: '+fmt(left)+' ﷼</div>':'')
        +'</div></div>';
    }).join('');
}

// ── CHARTS ─────────────────────────────
function initCharts(prefix, entries, supervisors){
  const COLORS=['#5C3A1E','#D4A843','#1A56A8','#1E7D4A','#D93025','#7C3AED','#0891B2','#D97706'];
  const validE=entries.filter(e=>e.type!=='labor'&&e.type!=='transfer'&&e.type!=='budget_add');
  const tTax=validE.filter(e=>e.type==='tax').reduce((a,e)=>a+(e.total||0),0);
  const tPetty=validE.filter(e=>e.type==='petty').reduce((a,e)=>a+(e.total||0),0);
  const pm={};
  validE.forEach(e=>{if(!pm[e.project])pm[e.project]=0;pm[e.project]+=(e.total||0);});
  const sortedProj=Object.entries(pm).sort((a,b)=>b[1]-a[1]).slice(0,8);
  setTimeout(()=>{
    const projCtx=document.getElementById('ch-proj-'+prefix);
    if(projCtx&&sortedProj.length&&window.Chart){
      new Chart(projCtx,{type:'bar',data:{labels:sortedProj.map(([p])=>p),datasets:[{label:'﷼',data:sortedProj.map(([,v])=>v),backgroundColor:COLORS.slice(0,sortedProj.length),borderRadius:6}]},options:{responsive:true,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{ticks:{callback:v=>fmt(v)}}}}});
    }
    const typeCtx=document.getElementById('ch-type-'+prefix);
    if(typeCtx&&(tTax+tPetty)>0&&window.Chart){
      new Chart(typeCtx,{type:'doughnut',data:{labels:['ضريبية '+fmt(tTax)+' ﷼','نثرية '+fmt(tPetty)+' ﷼'],datasets:[{data:[tTax,tPetty],backgroundColor:['#1A56A8','#1E7D4A'],borderWidth:0}]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{size:11}}}}}});
    }
    if(supervisors){
      const supCtx=document.getElementById('ch-sup-'+prefix);
      if(supCtx&&window.Chart){
        const sd=supervisors.map(s=>({name:s.name,spent:entries.filter(e=>e.supId==s.id&&e.type!=='labor'&&e.type!=='budget_add').reduce((a,e)=>a+(e.total||0),0),budget:s.budget}));
        new Chart(supCtx,{type:'bar',data:{labels:sd.map(s=>s.name),datasets:[{label:'صرف',data:sd.map(s=>s.spent),backgroundColor:'#D93025',borderRadius:4},{label:'متبقي',data:sd.map(s=>Math.max(0,s.budget-s.spent)),backgroundColor:'#D4A843',borderRadius:4}]},options:{responsive:true,plugins:{legend:{position:'bottom'}},scales:{x:{stacked:true},y:{stacked:true,ticks:{callback:v=>fmt(v)}}}}});
      }
    }
  },200);
}


// ── LABOR SECTION FOR REPORTS ──────────────
function buildLaborSection(fromDate, toDate){
  const allLabor = DB.entries.filter(e=>e.type==='labor'||e.type==='labor_waiting');
  const laborEntries = (fromDate||toDate)
    ? allLabor.filter(e=>(!fromDate||e.date>=fromDate)&&(!toDate||e.date<=toDate))
    : allLabor;

  if(!laborEntries.length) return '<div class="shdr" style="margin-top:8px">👷 لا توجد سجلات عمالة في هذه الفترة</div>';

  const rates = DB.laborRates || {company:100, external:150};

  // Separate project labor from waiting labor
  const projectEntries = laborEntries.filter(e=>e.type==='labor');
  const waitingEntries = laborEntries.filter(e=>e.type==='labor_waiting');

  // Build project worker tables
  const extW={}, compW={};
  projectEntries.forEach(e=>{
    if(e.laborDetails?.externalWorkersList){
      e.laborDetails.externalWorkersList.forEach(w=>{
        const k=w.name+'||'+w.jobTitle;
        if(!extW[k])extW[k]={name:w.name,jobTitle:w.jobTitle,days:0,total:0,dates:[],projects:new Set()};
        extW[k].days++;extW[k].total+=rates.external;
        if(e.date&&!extW[k].dates.includes(e.date))extW[k].dates.push(e.date);
        if(e.project)extW[k].projects.add(e.project);
      });
    }
    if(e.laborDetails?.presentWorkers){
      e.laborDetails.presentWorkers.forEach(w=>{
        if(!compW[w.name])compW[w.name]={name:w.name,days:0,dates:[],projects:new Set()};
        compW[w.name].days++;
        if(e.date&&!compW[w.name].dates.includes(e.date))compW[w.name].dates.push(e.date);
        if(e.project)compW[w.name].projects.add(e.project);
      });
    }
  });

  // Build waiting worker tables
  const waitCompW={};
  waitingEntries.forEach(e=>{
    if(e.laborDetails?.presentWorkers){
      e.laborDetails.presentWorkers.forEach(w=>{
        if(!waitCompW[w.name])waitCompW[w.name]={name:w.name,days:0,dates:[],projects:new Set()};
        waitCompW[w.name].days++;
        if(e.date&&!waitCompW[w.name].dates.includes(e.date))waitCompW[w.name].dates.push(e.date);
        if(e.project)waitCompW[w.name].projects.add(e.project);
      });
    }
  });

  const extList = Object.values(extW).sort((a,b)=>b.days-a.days);
  const compList = Object.values(compW).sort((a,b)=>b.days-a.days);
  const waitList = Object.values(waitCompW).sort((a,b)=>b.days-a.days);

  const totalExt = extList.reduce((a,w)=>a+w.days,0);

  const totalWait = waitList.reduce((a,w)=>a+w.days,0);

        <span>الاسم / الصفة</span><span style="text-align:center">الأيام</span><span style="text-align:center">الإجمالي</span>
      </div>
      ${extList.map((w,i)=>`
        <div style="display:grid;grid-template-columns:2fr 1fr 1fr;padding:9px 14px;background:transparent">
          <div><div style="font-size:13px;font-weight:700">${w.name}</div>
          <div style="font-size:10px;color:rgba(255,255,255,.5)">${w.jobTitle} · ${[...w.projects].join('،')}</div>
          <div style="font-size:10px;color:rgba(255,255,255,.4)">${w.dates.sort().join(' · ')}</div></div>
          <div style="text-align:center;font-size:20px;font-weight:900;color:#70B5FF">${w.days}<div style="font-size:9px;color:rgba(255,255,255,.4);font-weight:400">يوم</div></div>
          <div style="text-align:center;font-size:13px;font-weight:700;color:#f87171">${fmt(w.total)}<div style="font-size:9px;color:rgba(255,255,255,.4);font-weight:400">﷼</div></div>
        </div>`).join('')}
      <div style="display:grid;grid-template-columns:2fr 1fr 1fr;padding:8px 14px;background:rgba(245,200,66,.1);font-weight:700;font-size:12px">
        <span>الإجمالي</span>
        <span style="text-align:center;color:#70B5FF">${totalExt} يوم</span>
        <span style="text-align:center;color:#f87171">${fmt(extList.reduce((a,w)=>a+w.total,0))} ﷼</span>
      </div>

    ${compList.length?`

async function pickSalesFile(input){
  const file=input.files[0];if(!file)return;
  const isPdf=file.type==='application/pdf';
  const status=document.getElementById('sales-ai-status');
  const icon=document.getElementById('sales-icon');
  const txt=document.getElementById('sales-txt');
  if(status)status.style.display='block';
  if(icon)icon.textContent='⧗';
  const reader=new FileReader();
  reader.onload=async ev=>{
    const b64=ev.target.result.split(',')[1];
    try{
      const res=await api('/api/analyze','POST',{b64,isPdf,text:'invoice: extract supplier, invoiceNo, date(YYYY-MM-DD), subtotal, taxRate, taxAmt, total. JSON only.'});
      if(res.error)throw new Error(res.error);
      if(res.supplier)document.getElementById('s-client').value=res.supplier;
      if(res.invoiceNo)document.getElementById('s-inv-no').value=res.invoiceNo;
      if(res.date)document.getElementById('s-date').value=res.date;
      if(res.subtotal)document.getElementById('s-subtotal').value=res.subtotal;
      if(res.taxRate)document.getElementById('s-taxrate').value=res.taxRate;
      calcSalesVat();
      if(status)status.innerHTML='<span style="color:#34d399">✅ تم استخراج البيانات</span>';
      if(icon)icon.textContent='✅';if(txt)txt.textContent=file.name;
    }catch(e){
      if(status)status.innerHTML='<span style="color:#f87171">❌ '+e.message+'</span>';
      if(icon)icon.textContent='❌';
    }
  };
  reader.readAsDataURL(file);
}

function saveSalesInvoice(){
  const invoiceNo=(document.getElementById('s-inv-no')?.value||'').trim();
  const date=document.getElementById('s-date')?.value||today();
  const client=(document.getElementById('s-client')?.value||'').trim();
  const project=document.getElementById('s-proj')?.value||'';
  const subtotal=parseFloat(document.getElementById('s-subtotal')?.value)||0;
  const taxRate=parseFloat(document.getElementById('s-taxrate')?.value)||0;
  const payMethod=document.getElementById('s-paymethod')?.value||'cash';
  const notes=(document.getElementById('s-notes')?.value||'').trim();
  const err=document.getElementById('s-err');
  if(!client||!subtotal){if(err){err.style.display='block';err.textContent='⚠️ أدخل اسم العميل والمبلغ';}return;}
  const taxAmt=subtotal*taxRate/100;
  const total=subtotal+taxAmt;
  const sales=JSON.parse(localStorage.getItem('kayan_sales')||'[]');
  if(invoiceNo){const dup=sales.find(s=>s.invoiceNo&&s.invoiceNo.toLowerCase()===invoiceNo.toLowerCase());if(dup){if(err){err.style.display='block';err.textContent='⚠️ رقم الفاتورة مسجل مسبقاً';}return;}}
  sales.push({id:'s-'+Date.now(),invoiceNo:invoiceNo||'S-'+Date.now(),date,client,project,subtotal,taxRate,taxAmt,total,payMethod,notes,createdAt:new Date().toISOString()});
  localStorage.setItem('kayan_sales',JSON.stringify(sales));
  api('/api/sales','POST',{sales}).catch(()=>{});
  if(err)err.style.display='none';
  alert('✅ تم حفظ فاتورة المبيعات — '+fmt(total)+' ريال');
  rSales();
}

  localStorage.setItem('kayan_sales',JSON.stringify(sales));
  api('/api/sales','POST',{sales}).catch(()=>{});
  rSales();
}

// حدود الكوارتر الحالي بناءً على تاريخ اليوم الفعلي
function _currentQuarterBounds(){
  const now = new Date();
  const y = now.getFullYear();
  const q = Math.floor(now.getMonth()/3); // 0..3
  const startMonth = q*3;
  const endMonth = startMonth+2;
  const start = y+'-'+String(startMonth+1).padStart(2,'0')+'-01';
  const lastDay = new Date(y, endMonth+1, 0).getDate();
  const end = y+'-'+String(endMonth+1).padStart(2,'0')+'-'+String(lastDay).padStart(2,'0');
  return {start, end};
}

function exportPurchExcelRange(from, to, taxOnly){

  if(isCurrentQuarterTaxReport){

function calcSalesVat(){
  const sub = parseFloat(document.getElementById('s-subtotal')?.value)||0;
  const rate = parseFloat(document.getElementById('s-taxrate')?.value)||0;
  const vat = sub * rate/100;
  const total = sub + vat;
  const ve = document.getElementById('s-vatamt');
  const te = document.getElementById('s-total');
  if(ve) ve.textContent = fmt(vat)+' ﷼';
  if(te) te.textContent = fmt(total)+' ﷼';
}

// ── Shared helpers for bulk parsing ──
const _fixNum = v => parseFloat(String(v||'0').replace(/,/g,'').replace(/[^0-9.]/g,''))||0;
const _fixDate = d => {
  if(!d) return ''; // لا تفترض تاريخ اليوم — اتركه فارغاً ليتم رفض الفاتورة
  // Convert Arabic-Indic numerals to Western
  let s = String(d).trim()
    .replace(/[٠-٩]/g, c => String('٠١٢٣٤٥٦٧٨٩'.indexOf(c)))
    .replace(/م$|هـ$|\s*م\s*$|\s*هـ\s*$/,'')  // Remove م or هـ at end
    .trim();
  // Already ISO format
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  // Arabic month names mapping
  const arMonths = {
    'يناير':'01','جانفي':'01','كانون الثاني':'01',
    'فبراير':'02','شباط':'02','فيفري':'02',
    'مارس':'03','آذار':'03',
    'أبريل':'04','ابريل':'04','نيسان':'04',
    'مايو':'05','أيار':'05',
    'يونيو':'06','حزيران':'06','يونيه':'06',
    'يوليو':'07','يوليه':'07','تموز':'07',
    'أغسطس':'08','اغسطس':'08','آب':'08',
    'سبتمبر':'09','أيلول':'09',
    'أكتوبر':'10','اكتوبر':'10','تشرين الأول':'10',
    'نوفمبر':'11','نونبر':'11','تشرين الثاني':'11',
    'ديسمبر':'12','دجنبر':'12','كانون الأول':'12'
  };
  // Try Arabic date: "27 يونيو 2026" or "27يونيو2026"
  for(const [arMonth, num] of Object.entries(arMonths)){
    const re1 = new RegExp('(\\d{1,2})\\s*'+arMonth+'\\s*(\\d{4})');
    const mAr = s.match(re1);
    if(mAr) return mAr[2]+'-'+num+'-'+mAr[1].padStart(2,'0');
    // Also try "2026 يونيو 27"
    const re2 = new RegExp('(\\d{4})\\s*'+arMonth+'\\s*(\\d{1,2})');
    const mAr2 = s.match(re2);
    if(mAr2) return mAr2[1]+'-'+num+'-'+mAr2[2].padStart(2,'0');
  }
  // English month names
  const enMonths = {jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'};
  for(const [enM, num] of Object.entries(enMonths)){
    const re3 = new RegExp('(\\d{1,2})\\s*'+enM+'[a-z]*\\s*(\\d{4})','i');
    const mEn = s.match(re3);
    if(mEn) return mEn[2]+'-'+num+'-'+mEn[1].padStart(2,'0');
  }
  // Numeric formats
  const m1=s.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
  if(m1) return m1[1]+'-'+m1[2].padStart(2,'0')+'-'+m1[3].padStart(2,'0');
  const m2=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);
  if(m2) return m2[3]+'-'+m2[2].padStart(2,'0')+'-'+m2[1].padStart(2,'0');
  const m3=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2})$/);
  if(m3) return '20'+m3[3]+'-'+m3[2].padStart(2,'0')+'-'+m3[1].padStart(2,'0');
  if(s.length>=10) return s.slice(0,10).replace(/\//g,'-');
  return ''; // تنسيق غير مفهوم — نتركه فارغاً بدل افتراض تاريخ اليوم
};
const _fixPay = v => {
  const p=String(v||'').toLowerCase();
  if(p.includes('آجل')||p.includes('credit')||p.includes('defer')) return 'deferred';
  if(p.includes('تحويل')||p.includes('transfer')||p.includes('bank')) return 'transfer';
  return 'cash';
};
const _parseList = res => {
  let list=[];
  if(res.invoices&&Array.isArray(res.invoices)) list=res.invoices;
  else if(res.data&&Array.isArray(res.data)) list=res.data;
  else if(res.rows&&Array.isArray(res.rows)) list=res.rows;
  else if(res.items&&Array.isArray(res.items)) list=res.items;
  else if(Array.isArray(res)) list=res;
  else if(typeof res==='object'&&(res.total||res.client||res.invoiceNo||res.subtotal)) list=[res];
  if(list.length===1&&Array.isArray(list[0])) list=list[0];
  return list.map(inv=>{
    const sub=_fixNum(inv.subtotal||inv.net||0);
    const rate=_fixNum(inv.taxRate||inv.tax_rate||15)||15;
    const vat=_fixNum(inv.taxAmt||inv.tax_amount||0)||(sub*rate/100);
    const tot=_fixNum(inv.total||inv.grand_total||0)||(sub+vat);
    return{
      invoiceNo:String(inv.invoiceNo||inv.invoice_no||inv.ref||'').trim(),
      date:_fixDate(inv.date||inv.invoice_date||''),
      client:String(inv.client||inv.customer||inv.clientName||inv['العميل']||'—').trim(),
      subtotal:sub||tot-vat, taxRate:rate, taxAmt:vat, total:tot||sub+vat,
      payMethod:_fixPay(inv.payMethod||inv.pay_method||''),
      notes:String(inv.notes||inv.description||inv.desc||'').trim()
    };
  }).filter(inv=>inv.total>0||inv.subtotal>0);
};

let _bulkRetParsed=[];
async function analyzeBulkReturns(input){
  const file=input.files[0];if(!file)return;
  const isPdf=file.type==='application/pdf';
  document.getElementById('ret-bulk-icon').textContent='⏳';
  document.getElementById('ret-bulk-status').style.display='block';
  document.getElementById('ret-bulk-status').innerHTML='<div style="font-size:11px;color:#f5c842;padding:6px 10px;background:rgba(245,200,66,.08);border-radius:6px">⏳ جاري تحليل تقرير المرتجعات...</div>';
  const reader=new FileReader();
  reader.onload=async ev=>{
    const b64=ev.target.result.split(',')[1];
    try{
      const prompt = 'أنت محاسب خبير. هذه وثيقة تحتوي على بيانات مرتجعات مبيعات (Excel أو PDF). مهمتك: استخرج كل صف أو مرتجع كعنصر منفصل. لكل مرتجع: invoiceNo (رقم المرتجع)، date (YYYY-MM-DD)، client (اسم العميل)، origInvoiceNo (رقم الفاتورة الأصلية)، subtotal (المبلغ قبل الضريبة رقم)، taxRate (نسبة الضريبة رقم افتراضي 15)، taxAmt (مبلغ الضريبة رقم)، total (الإجمالي رقم)، reason (سبب). تجاهل صفوف الإجمالي. أخرج JSON نقي فقط: {"invoices":[{"invoiceNo":"","date":"","client":"","origInvoiceNo":"","subtotal":0,"taxRate":15,"taxAmt":0,"total":0,"reason":""}]}';
      const res=await api('/api/analyze','POST',{b64,isPdf,text:prompt});
      if(res.error)throw new Error(res.error);
      let invoices=res.invoices||res.items||[];
      if(!invoices.length&&(res.total||res.client))invoices=[res];
      const fixR=v=>parseFloat(String(v||'0').replace(/,/g,'').replace(/[^0-9.]/g,''))||0;
      const fixDateR=d=>{if(!d)return today();const m=String(d).match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');}return String(d).slice(0,10)||today();};
      _bulkRetParsed=invoices.map(inv=>{
        const sub=fixR(inv.subtotal||inv.net||0);const rate=fixR(inv.taxRate||inv.tax_rate||15)||15;
        const vat=fixR(inv.taxAmt||inv.tax_amount||0)||(sub*rate/100);
        const tot=fixR(inv.total||inv.grand_total||0)||(sub+vat);
        return{invoiceNo:String(inv.invoiceNo||inv.invoice_no||inv.ref||'').trim(),origInvoiceNo:String(inv.origInvoiceNo||inv.original_invoice||'').trim(),date:fixDateR(inv.date||inv.invoice_date||''),client:String(inv.client||inv.customer||inv.العميل||'—').trim(),subtotal:sub||tot-vat,taxRate:rate,taxAmt:vat,total:tot||sub+vat,reason:String(inv.reason||inv.سبب||'').trim()};
      }).filter(r=>r.total>0||r.subtotal>0);
      const preview=document.getElementById('ret-bulk-preview');
      preview.style.display='block';
      const retTotal2=_bulkRetParsed.reduce((a,r)=>a+(r.total||0),0);
      preview.innerHTML='<div style="font-size:11px;color:#f87171;margin-bottom:6px;font-weight:700">↩️ تم استخراج '+_bulkRetParsed.length+' مرتجع</div>'
        +_bulkRetParsed.map(r=>'<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:11px"><div><div style="font-weight:600">'+r.client+'</div><div style="color:rgba(255,255,255,.4)">'+r.invoiceNo+' · '+r.date+'</div></div><div style="color:#f87171;font-weight:700">-'+fmt(r.total)+' ﷼</div></div>').join('')
        +'<div style="display:flex;justify-content:space-between;padding:7px 0;font-size:12px;font-weight:700"><span>الإجمالي</span><span style="color:#f87171">-'+fmt(retTotal2)+' ﷼</span></div>';
      document.getElementById('ret-bulk-save').style.display='block';
      document.getElementById('ret-bulk-status').innerHTML='<div style="font-size:11px;color:#34d399;padding:6px 10px;background:rgba(52,211,153,.08);border-radius:6px">✅ راجع المرتجعات وأكد</div>';
      document.getElementById('ret-bulk-icon').textContent='✅';
      document.getElementById('ret-bulk-txt').textContent=file.name;
    }catch(e){
      document.getElementById('ret-bulk-status').innerHTML='<div style="font-size:11px;color:#f87171;padding:6px 10px;background:rgba(248,113,113,.08);border-radius:6px">❌ '+e.message+'</div>';
      document.getElementById('ret-bulk-icon').textContent='❌';
    }
  };
  reader.readAsDataURL(file);
}

function calcPurchVat(){
  const sub=parseFloat(document.getElementById('p-sub')?.value)||0;
  const rate=parseFloat(document.getElementById('p-taxrate')?.value)||0;
  const vat=sub*rate/100;
  const ve=document.getElementById('p-vatamt'),te=document.getElementById('p-total-disp');
  if(ve)ve.textContent=fmt(vat)+' ﷼';
  if(te)te.textContent=fmt(sub+vat)+' ﷼';
}

      const res=await api('/api/analyze','POST',{b64:_purchSingleB64,isPdf,text:''});
      if(res.error)throw new Error(res.error);
      if(res.supplier||res.desc)document.getElementById('p-desc').value=res.supplier||res.desc||'';
      if(res.invoiceNo)document.getElementById('p-invno').value=res.invoiceNo;

      calcPurchVat();

      // فحص فوري: هل الفاتورة دي مكررة (نفس رقم الفاتورة + التاريخ + المبلغ)؟
      const _norm = s => (s||'').toString().trim().toLowerCase().replace(/\s+/g,'');
      const _invNo = res.invoiceNo||'';
      const _date = res.date?_fixDate(res.date):'';
      const _total = (res.subtotal||0)+((res.subtotal||0)*(res.taxRate||0)/100);
      let dupWarning = '';
      if(_invNo && _date){
        const dup = DB.entries.find(e=>
          (e.type==='petty'||e.type==='tax') &&
          e.invoiceNo && _norm(e.invoiceNo)===_norm(_invNo) &&
          e.date===_date &&
          Math.abs((e.total||0)-_total)<0.5
        );
        if(dup){
          const who = DB.supervisors.find(s=>s.id==dup.supId)?.name||'مشرف آخر';
          dupWarning = '<div style="margin-top:6px;padding:8px 10px;background:rgba(248,113,113,.15);border-radius:8px;color:#f87171;font-size:12px;font-weight:700">⚠️ هذه الفاتورة مكررة! نفس الرقم والتاريخ والمبلغ مسجلة مسبقاً عند: '+who+' (تاريخ التسجيل: '+dup.date+')</div>';
        }
      }

      st.innerHTML='<span style="color:#34d399">✅ تم استخراج البيانات — راجع وأكد</span>'+dupWarning;

    }catch(e){
      st.innerHTML='<span style="color:#f87171">❌ '+e.message+'</span>';
      document.getElementById('purch-icon').textContent='❌';
    }
  };
  reader.readAsDataURL(file);
}
