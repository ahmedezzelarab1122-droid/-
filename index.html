<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#b8860b">
<link rel="manifest" href="/manifest.json">
<title>مصروفات كيان</title>
<style>
:root{--g:#b8860b;--gl:#f5f0e0;--gd:#8a6000;--b:#1d4ed8;--bl:#dbeafe;--r:#dc2626;--rl:#fee2e2;--a:#d97706;--al:#fef3c7;--n1:#f8fafc;--n2:#f1f5f9;--n3:#e2e8f0;--n4:#94a3b8;--n5:#64748b;--n9:#0f172a;--brown:#3a210a;--gold:#b8860b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Segoe UI',Tahoma,Arial,sans-serif;direction:rtl;background:var(--n1);color:var(--n9);font-size:14px}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes bar{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* DARK */
[data-theme=dark]{--n1:#111;--n2:#1e1e1e;--n3:#2a2a2a;--n4:#777;--n5:#aaa;--n9:#f0f0f0}
[data-theme=dark] body{background:#111}
[data-theme=dark] .topbar,[data-theme=dark] .tabs,[data-theme=dark] .card,[data-theme=dark] .stat,[data-theme=dark] .sc,[data-theme=dark] .lc{background:#1e1e1e!important;border-color:#2a2a2a!important}
[data-theme=dark] input,[data-theme=dark] select,[data-theme=dark] textarea{background:#1e1e1e;border-color:#2a2a2a;color:#f0f0f0}
[data-theme=dark] .lw{background:linear-gradient(135deg,#1a0f05,#3a210a,#5a3315)}
[data-theme=dark] .tab{color:#555}
[data-theme=dark] .tab.on{color:var(--gold);border-bottom-color:var(--gold)}
/* LAYOUT */
.topbar{background:#fff;border-bottom:1px solid var(--n3);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--n3);padding:0 10px;position:sticky;top:52px;z-index:50;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 13px;border:none;background:none;font-family:inherit;font-size:12px;color:var(--n4);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.on{color:var(--gold);border-bottom-color:var(--gold);font-weight:600}
#mc{padding:12px;max-width:620px;margin:0 auto;padding-bottom:24px}
/* CARDS */
.card{background:#fff;border:1px solid var(--n3);border-radius:12px;padding:13px 15px;margin-bottom:11px;animation:fi .3s ease}
.ctitle{font-size:13px;font-weight:600;color:var(--n5);margin-bottom:11px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px}
.stat{background:#fff;border:1px solid var(--n3);border-radius:10px;padding:11px 13px}
.sl{font-size:11px;color:var(--n4);margin-bottom:2px}
.sv{font-size:18px;font-weight:700}
/* FORMS */
label.lbl{font-size:12px;font-weight:500;color:var(--n5);display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:8px 11px;border:1.5px solid var(--n3);border-radius:7px;font-size:13px;font-family:inherit;color:var(--n9);background:#fff;outline:none;direction:rtl;box-sizing:border-box}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:none;min-height:65px}
.fg{margin-bottom:9px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:inherit;width:100%;transition:.15s}
.btn:active{transform:scale(.97)}
.bp{background:var(--gold);color:#fff}
.bs{background:var(--n2);color:var(--n5)}
.bd{background:var(--rl);color:var(--r);width:auto}
.bx{background:#217346;color:#fff}
.brow{display:flex;gap:7px;margin-top:8px}
.brow .btn{flex:1}
/* BADGES */
.badge{display:inline-block;padding:2px 8px;border-radius:14px;font-size:11px;font-weight:600}
.bpt{background:#dcfce7;color:#166534}.btx{background:var(--bl);color:var(--b)}.bot{background:var(--n2);color:var(--n5)}.bcs{background:var(--al);color:var(--a)}.btr{background:#ede9fe;color:#7c3aed}
/* MISC */
.pbar{height:5px;background:var(--n2);border-radius:3px;overflow:hidden;margin-top:5px}
.pf{height:100%;border-radius:3px}
.fr{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--n2);font-size:13px}
.fr:last-child{border-bottom:none}
.tbox{background:var(--gold);color:#fff;border-radius:9px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:9px}
.txr{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--n2)}
.txr:last-child{border-bottom:none}
.av{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.sc{background:#fff;border:1px solid var(--n3);border-radius:11px;padding:11px 13px;margin-bottom:9px}
.shdr{font-size:11px;font-weight:600;color:var(--n4);margin-bottom:7px;margin-top:3px}
.srow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--n2)}
.srow:last-child{border-bottom:none}
.xb{border:none;background:none;color:var(--n4);cursor:pointer;font-size:16px;padding:3px}
.xb:hover{color:var(--r)}
.ftabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.ftab{padding:4px 11px;border-radius:14px;border:1.5px solid var(--n3);background:#fff;font-family:inherit;font-size:11px;cursor:pointer}
.ftab.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.ar{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.ar input{flex:1;min-width:80px}
.ar .btn{width:auto;padding:8px 11px}
.empty{text-align:center;padding:2.5rem;color:var(--n4);font-size:13px}
.sep{height:1px;background:var(--n2);margin:8px 0}
.chip{background:var(--n2);border-radius:6px;padding:6px 9px;margin-bottom:5px}
.ok{background:var(--gl);border-radius:7px;padding:9px 12px;font-size:12px;color:var(--gd);display:flex;align-items:center;gap:6px;margin-bottom:9px}
.err{background:var(--rl);border-radius:7px;padding:9px 12px;font-size:12px;color:var(--r);margin-bottom:8px;display:none}
.spin{width:28px;height:28px;border:3px solid var(--n3);border-top-color:var(--gold);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 10px}
.ldg{text-align:center;padding:3rem;display:none}
.drop{border:2px dashed var(--n3);border-radius:10px;padding:22px 14px;text-align:center;cursor:pointer;background:var(--n1);margin-bottom:9px;transition:.15s}
.drop:hover{border-color:var(--gold);background:var(--gl)}
.iprev{width:100%;border-radius:8px;max-height:160px;object-fit:cover;margin-bottom:9px;display:none;border:1px solid var(--n3)}
.warn{background:var(--rl);color:var(--r);border-radius:8px;padding:10px 14px;font-size:13px;font-weight:500;margin-bottom:12px}
/* LOGIN */
.lw{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#3a210a,#5a3315,#b8860b);padding:20px}
.lc{background:#fff;border-radius:20px;padding:2rem 1.5rem;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
.rb{padding:13px;border:2px solid var(--n3);border-radius:11px;cursor:pointer;text-align:center;background:#fff;font-family:inherit;transition:.15s}
.rb:hover,.rb.sel{border-color:var(--gold);background:var(--gl)}
.rb svg{display:block;margin:0 auto 5px}
.rb span{font-size:12px;font-weight:600;color:var(--n5)}
.rb.sel span{color:var(--gold)}
</style>
</head>

      <button id="ibtn" onclick="installApp()" style="display:none;border:1px solid var(--gold);border-radius:7px;padding:5px 9px;background:#b8860b22;font-size:11px;color:var(--gold);cursor:pointer;font-family:inherit">تثبيت</button>
      <button onclick="toggleTheme()" id="tbtn" style="border:1px solid var(--n3);border-radius:7px;padding:5px 8px;background:none;cursor:pointer;font-size:15px;line-height:1">🌙</button>
      <button onclick="doLogout()" style="border:1px solid var(--n3);border-radius:7px;padding:5px 9px;background:none;font-size:11px;color:var(--n5);cursor:pointer;font-family:inherit">خروج</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="mc"></div>
</div>

<!-- SCAN PANEL -->
<div id="swrap" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:flex-end;justify-content:center" onclick="if(event.target===this)closeScan()">
  <div style="background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:560px;padding:16px 15px 28px;max-height:92vh;overflow-y:auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:13px">
      <div style="font-size:14px;font-weight:700">رفع فاتورة / مصروف</div>
      <button onclick="closeScan()" style="border:none;background:var(--n2);border-radius:7px;width:28px;height:28px;cursor:pointer;font-size:16px;color:var(--n5)">✕</button>
    </div>
    <div id="ss1">
      <label class="drop" for="sfile" id="sdrop">
        <svg width="34" height="34" fill="none" stroke="var(--n4)" stroke-width="1.5" viewBox="0 0 24 24" style="margin:0 auto 7px;display:block"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <p style="font-size:13px;color:var(--n5)">اضغط لرفع صورة الفاتورة</p>
        <small style="font-size:11px;color:var(--n4)">من الكاميرا أو من الواتساب</small>
      </label>
      <input type="file" id="sfile" accept="image/*" style="display:none" onchange="pickFile(this)">
      <img id="sprev" class="iprev">
      <div class="fg"><label class="lbl">أو الصق نص الرسالة</label><textarea id="stxt" placeholder="مثال: أكل عمال 450 ريال&#10;فاتورة حديد 2300 ريال INV-005"></textarea></div>
      <div class="fg2">
        <div><label class="lbl">المشرف</label><select id="ssup"></select></div>
        <div><label class="lbl">المشروع</label><select id="sproj"></select></div>
      </div>
      <div class="err" id="serr"></div>
      <button class="btn bp" onclick="runAI()">
        <svg width="14" height="14" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        تحليل بالذكاء الاصطناعي
      </button>
    </div>
    <div class="ldg" id="sldg"><div class="spin"></div><p id="ltxt" style="color:var(--n5);font-size:13px">جاري التحليل...</p></div>
    <div id="ss2" style="display:none">
      <div class="ok"><svg width="15" height="15" fill="none" stroke="var(--gd)" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>تم استخراج البيانات — راجع وأكد</div>
      <img id="sprev2" class="iprev">
      <div class="card" style="margin-bottom:9px"><div id="rfields"></div></div>
      <div id="icard" style="display:none" class="card"><div class="ctitle">البنود</div><div id="ilist"></div></div>
      <div class="fg2">
        <div><label class="lbl">المشرف</label><select id="csup"></select></div>
        <div><label class="lbl">المشروع</label><select id="cproj"></select></div>
      </div>
      <div class="brow">
        <button class="btn bp" onclick="saveEntry()"><svg width="14" height="14" fill="none" stroke="#fff" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>حفظ</button>
        <button class="btn bs" onclick="resetScan()">إلغاء</button>
      </div>
    </div>
    <div id="sdone" style="display:none;text-align:center;padding:1.5rem 0">
      <div style="width:52px;height:52px;background:var(--gl);border-radius:50%;margin:0 auto 11px;display:flex;align-items:center;justify-content:center">
        <svg width="26" height="26" fill="none" stroke="var(--gold)" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div style="font-size:14px;font-weight:700;margin-bottom:4px">تم الحفظ بنجاح</div>
      <div id="dsum" style="font-size:12px;color:var(--n5);margin-bottom:14px"></div>
      <div class="brow">
        <button class="btn bp" onclick="resetScan()">رفع فاتورة أخرى</button>
        <button class="btn bs" onclick="closeScan()">إغلاق</button>
      </div>
    </div>
  </div>
</div>

<script>
const COLORS=['#b8860b','#1d4ed8','#9333ea','#0a7c5c','#dc2626','#0891b2'];
let DB={supervisors:[],projects:[],entries:[]};
let CU=null,ROLE=null,SR=null;
let imgB64=null,imgSrc=null,parsed=null,fType='all';

async function api(p,m='GET',b=null){
  const o={method:m,headers:{'Content-Type':'application/json'}};
  if(b)o.body=JSON.stringify(b);
  const r=await fetch(p,o);
  return r.json();
}
const fmt=n=>Number(n||0).toLocaleString('ar-SA');
const today=()=>new Date().toISOString().split('T')[0];
const tl=t=>t==='petty'?'نثرية':t==='tax'?'ضريبية':'أخرى';
const pl=p=>p==='cash'?'كاش':'تحويل';
const tb=t=>`<span class="badge b${t==='petty'?'pt':t==='tax'?'tx':'ot'}">${tl(t)}</span>`;
const pb=p=>`<span class="badge b${p==='cash'?'cs':'tr'}">${pl(p)}</span>`;
const gs=id=>DB.entries.filter(e=>e.supId==id).reduce((a,e)=>a+(e.total||0),0);
const gn=id=>DB.supervisors.find(s=>s.id==id)?.name||'—';
const gc=i=>COLORS[i%COLORS.length];

// THEME
function initTheme(){
  const t=localStorage.getItem('kayan_theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  document.documentElement.setAttribute('data-theme',t);
  const b=document.getElementById('tbtn');if(b)b.textContent=t==='dark'?'☀️':'🌙';
}
function toggleTheme(){
  const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('kayan_theme',t);
  const b=document.getElementById('tbtn');if(b)b.textContent=t==='dark'?'☀️':'🌙';
}

// PWA
let dp;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;const b=document.getElementById('ibtn');if(b)b.style.display='inline-flex';});
function installApp(){if(dp){dp.prompt();dp.userChoice.then(()=>{dp=null;const b=document.getElementById('ibtn');if(b)b.style.display='none';});}}

// SESSION
function saveSession(pw,supId){localStorage.setItem('ks',JSON.stringify({ROLE,pw,supId:supId||null}));}
async function restoreSession(){
  try{
    const s=localStorage.getItem('ks');
    if(!s)return false;
    const sess=JSON.parse(s);
    if(!sess||!sess.pw||!sess.ROLE)return false;
    const body={role:sess.ROLE,password:sess.pw};
    if(sess.supId)body.supId=parseInt(sess.supId);
    const res=await api('/api/login','POST',body);
    if(!res||!res.ok){localStorage.removeItem('ks');return false;}
    CU={id:res.supId||0,name:res.name,budget:res.budget||0};
    ROLE=res.role;
    return true;
  }catch(e){localStorage.removeItem('ks');return false;}
}

// LOGIN
async function start(){
  try{DB=await api('/api/db');}catch(e){}
  const ok=await restoreSession().catch(()=>false);
  if(ok&&CU&&ROLE){showApp();}
  else{document.getElementById('lview').style.display='flex';}
}

function selRole(r){
  SR=r;
  document.querySelectorAll('.rb').forEach(b=>b.classList.remove('sel'));
  document.getElementById('rb-'+(r==='supervisor'?'sup':'mgr')).classList.add('sel');
  const g=document.getElementById('sup-grp');
  if(r==='supervisor'){
    document.getElementById('sup-sel').innerHTML='<option value="">اختر...</option>'+DB.supervisors.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');
    g.style.display='block';
  }else g.style.display='none';
}

async function doLogin(){
  const err=document.getElementById('lerr');
  const pw=document.getElementById('pw-inp').value;
  if(!SR){err.style.display='block';err.textContent='اختر صفتك أولاً';return;}
  if(!pw){err.style.display='block';err.textContent='أدخل كلمة المرور';return;}
  const body={role:SR,password:pw};
  let supId=null;
  if(SR==='supervisor'){
    const id=document.getElementById('sup-sel').value;
    if(!id){err.style.display='block';err.textContent='اختر اسمك';return;}
    body.supId=parseInt(id);supId=parseInt(id);
  }
  try{
    const res=await api('/api/login','POST',body);
    if(!res.ok){err.style.display='block';err.textContent=res.error||'كلمة المرور خاطئة';return;}
    err.style.display='none';
    CU={id:res.supId||0,name:res.name,budget:res.budget||0};
    ROLE=res.role;
    localStorage.setItem('ks',JSON.stringify({ROLE,pw,supId}));
    showApp();
  }catch(e){err.style.display='block';err.textContent='خطأ في الاتصال';}
}

function doLogout(){
  CU=null;ROLE=null;SR=null;
  localStorage.removeItem('ks');
  document.getElementById('aview').style.display='none';
  document.getElementById('lview').style.display='flex';
  document.querySelectorAll('.rb').forEach(b=>b.classList.remove('sel'));
  document.getElementById('sup-grp').style.display='none';
  document.getElementById('pw-inp').value='';
  document.getElementById('lerr').style.display='none';
}

function showApp(){
  document.getElementById('lview').style.display='none';
  document.getElementById('aview').style.display='block';
  document.getElementById('tbname').textContent=CU.name;
  document.getElementById('tbrole').textContent=ROLE==='manager'?'مدير النظام':'مشرف';
  const items=ROLE==='manager'
    ?[['dash','لوحة التحكم'],['txns','المعاملات'],['reports','التقارير'],['setup','الإعداد'],['pws','كلمات المرور']]
    :[['home','الرئيسية'],['hist','سجلاتي'],['bal','رصيدي']];
  document.getElementById('tabs').innerHTML=items.map(([id,lbl],i)=>`<button class="tab${i===0?' on':''}" onclick="goTab('${id}',this)">${lbl}</button>`).join('');
  ROLE==='manager'?rDash():rHome();
}

function goTab(id,btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  const map={dash:rDash,txns:rTxns,reports:rReports,setup:rSetup,pws:rPws,home:rHome,hist:rHist,bal:rBal};
  map[id]?.();
}

// ── DASHBOARD ──────────────────────
function rDash(){
  const tB=DB.supervisors.reduce((a,s)=>a+s.budget,0);
  const tS=DB.entries.reduce((a,e)=>a+(e.total||0),0);
  const pt=DB.entries.filter(e=>e.type==='petty').reduce((a,e)=>a+(e.total||0),0);
  const tx=DB.entries.filter(e=>e.type==='tax').reduce((a,e)=>a+(e.total||0),0);
  document.getElementById('mc').innerHTML=`
    <div class="sg">
      <div class="stat"><div class="sl">إجمالي الصرف</div><div class="sv" style="color:var(--a)">${fmt(tS)} ﷼</div></div>
      <div class="stat"><div class="sl">المتبقي الكلي</div><div class="sv" style="color:var(--gold)">${fmt(tB-tS)} ﷼</div></div>
      <div class="stat"><div class="sl">نثرية</div><div class="sv" style="color:#166534">${fmt(pt)} ﷼</div></div>
      <div class="stat"><div class="sl">ضريبية</div><div class="sv" style="color:var(--b)">${fmt(tx)} ﷼</div></div>
    </div>
    <div class="shdr">حالة المشرفين</div>
    ${DB.supervisors.map((s,i)=>{
      const sp=gs(s.id),rem=s.budget-sp,pct=Math.min(100,Math.round(sp/(s.budget||1)*100));
      const pc=pct>85?'var(--r)':pct>65?'var(--a)':'var(--gold)';
      const warn=pct>80?`<div class="warn" style="font-size:12px;padding:7px 10px;margin-top:6px">⚠️ تنبيه: الرصيد اقترب من النهاية — متبقي ${fmt(rem)} ﷼</div>`:'';
      return`<div class="sc"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px"><div style="display:flex;align-items:center;gap:8px"><div class="av" style="background:${gc(i)}18;color:${gc(i)}">${s.name[0]}</div><div><div style="font-weight:600;font-size:13px">${s.name}</div><div style="font-size:10px;color:var(--n4)">${DB.entries.filter(e=>e.supId==s.id).length} معاملة · ميزانية ${fmt(s.budget)}</div></div></div><div style="text-align:left"><div style="font-size:10px;color:var(--n4)">صرف: ${fmt(sp)}</div><div style="font-size:14px;font-weight:700;color:${rem<500?'var(--r)':'var(--gold)'}">${fmt(rem)} ﷼</div></div></div><div class="pbar"><div class="pf" style="width:${pct}%;background:${pc}"></div></div>${warn}</div>`;
    }).join('')}
    <div class="shdr" style="margin-top:4px">آخر المعاملات</div>
    <div class="card">${DB.entries.slice(-5).reverse().map(e=>`<div class="txr"><div style="flex:1"><div style="font-size:13px;font-weight:600">${e.desc}</div><div style="font-size:10px;color:var(--n4);margin-top:1px">${gn(e.supId)} · ${e.project}</div></div><div style="text-align:left;flex-shrink:0;margin-right:7px">${tb(e.type)}<div style="font-size:13px;font-weight:700;color:var(--r);margin-top:2px">${fmt(e.total)} ﷼</div></div></div>`).join('')||'<div class="empty">لا توجد معاملات بعد</div>'}</div>`;
}

// ── TRANSACTIONS ──────────────────
function rTxns(){
  const sO=DB.supervisors.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
  const pO=DB.projects.map(p=>`<option>${p}</option>`).join('');
  document.getElementById('mc').innerHTML=`
    <div class="card" style="padding:10px 12px;margin-bottom:10px">
      <div style="margin-bottom:7px"><select id="fs" onchange="rfT()"><option value="all">كل المشرفين</option>${sO}</select></div>
      <div style="margin-bottom:7px"><select id="fp" onchange="rfT()"><option value="all">كل المشاريع</option>${pO}</select></div>
      <div class="ftabs"><button class="ftab on" onclick="setFT('all',this)">الكل</button><button class="ftab" onclick="setFT('petty',this)">نثرية</button><button class="ftab" onclick="setFT('tax',this)">ضريبية</button></div>
    </div>
    <button class="btn bx" onclick="location.href='/api/export'" style="margin-bottom:10px">
      <svg width="13" height="13" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      تصدير Excel
    </button>
    <div id="tl"></div>`;
  rfT();
}
function setFT(v,btn){fType=v;document.querySelectorAll('.ftab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');rfT();}
function rfT(){
  const fS=document.getElementById('fs')?.value||'all';
  const fP=document.getElementById('fp')?.value||'all';
  const list=DB.entries.filter(e=>{
    if(fS!=='all'&&e.supId!=fS)return false;
    if(fP!=='all'&&e.project!==fP)return false;
    if(fType!=='all'&&e.type!==fType)return false;
    return true;
  }).slice().reverse();
  const total=list.reduce((a,e)=>a+(e.total||0),0);
  const el=document.getElementById('tl');if(!el)return;
  if(!list.length){el.innerHTML='<div class="empty">لا توجد نتائج</div>';return;}
  el.innerHTML=`<div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="font-size:11px;color:var(--n4)">${list.length} معاملة</span><span style="font-size:13px;font-weight:700;color:var(--r)">${fmt(total)} ﷼</span></div>`
  +list.map(e=>`<div class="card" style="padding:10px 12px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div style="flex:1"><div style="font-size:13px;font-weight:600">${e.desc}</div>
      <div style="font-size:10px;color:var(--n4);margin-top:2px">${gn(e.supId)} · ${e.project}${e.supplier?' · '+e.supplier:''}${e.invoiceNo?' · '+e.invoiceNo:''} · ${e.date}</div></div>
      <div style="text-align:left;flex-shrink:0;margin-right:7px">${tb(e.type)} ${pb(e.payMethod||'cash')}<div style="font-size:13px;font-weight:700;color:var(--r);margin-top:3px">${fmt(e.total)} ﷼</div>${e.taxAmt>0?`<div style="font-size:10px;color:var(--n4)">ضريبة: ${fmt(e.taxAmt)}</div>`:''}</div>
    </div>
    ${e.items?.length?`<div style="border-top:1px solid var(--n2);margin-top:6px;padding-top:5px">${e.items.map(it=>`<div style="font-size:11px;color:var(--n5)">${it.desc}: ${it.qty} ${it.unit} × ${fmt(it.unitPrice)} = ${fmt(it.total)} ﷼</div>`).join('')}</div>`:''}
    <button onclick="delE(${e.id})" style="margin-top:5px;border:none;background:none;color:var(--n4);cursor:pointer;font-size:11px;font-family:inherit">✕ حذف</button>
  </div>`).join('');
}
async function delE(id){if(!confirm('حذف؟'))return;await api('/api/entries/'+id,'DELETE');DB=await api('/api/db');rfT();rDash();}

// ── REPORTS ────────────────────────
function rReports(){
  const taxT=DB.entries.reduce((a,e)=>a+(e.taxAmt||0),0);
  const ptT=DB.entries.filter(e=>e.type==='petty').reduce((a,e)=>a+(e.total||0),0);
  const txT=DB.entries.filter(e=>e.type==='tax').reduce((a,e)=>a+(e.total||0),0);
  const tot=ptT+txT||1;
  const pm={};DB.entries.forEach(e=>{if(!pm[e.project])pm[e.project]=0;pm[e.project]+=(e.total||0);});
  document.getElementById('mc').innerHTML=`
    <div class="card"><div class="ctitle">تقرير المشرفين</div>
    ${DB.supervisors.map((s,i)=>{
      const sp=gs(s.id),p=DB.entries.filter(e=>e.supId==s.id&&e.type==='petty').reduce((a,e)=>a+(e.total||0),0),t=DB.entries.filter(e=>e.supId==s.id&&e.type==='tax').reduce((a,e)=>a+(e.total||0),0),tx=DB.entries.filter(e=>e.supId==s.id).reduce((a,e)=>a+(e.taxAmt||0),0);
      return`<div class="txr"><div><div style="font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:50%;background:${gc(i)};display:inline-block"></span>${s.name}</div><div style="font-size:10px;color:var(--n4);margin-top:1px">نثرية:${fmt(p)} · ضريبية:${fmt(t)} · ضريبة:${fmt(tx)}</div></div><div style="text-align:left"><div style="font-size:13px;font-weight:700;color:var(--r)">${fmt(sp)} ﷼</div><div style="font-size:10px;color:var(--gold)">متبقي:${fmt(s.budget-sp)}</div></div></div>`;
    }).join('')}</div>
    <div class="card"><div class="ctitle">تقرير المشاريع</div>${DB.projects.map(p=>`<div class="txr"><span style="font-size:13px">${p}</span><span style="font-weight:700;color:var(--r)">${fmt(pm[p]||0)} ﷼</span></div>`).join('')}</div>
    <div class="card"><div class="ctitle">إجمالي ضريبة القيمة المضافة</div><div style="font-size:22px;font-weight:800;color:var(--b)">${fmt(taxT)} ﷼</div></div>
    <div class="card"><div class="ctitle">توزيع المصاريف</div>
    ${[['نثرية',ptT,'#166534'],['ضريبية',txT,'var(--b)']].map(([l,v,c])=>{
      const pc=Math.round(v/tot*100);
      return`<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;margin-bottom:3px;font-size:12px"><span>${l}</span><span style="font-weight:600;color:${c}">${fmt(v)} ﷼ (${pc}%)</span></div><div class="pbar"><div class="pf" style="width:${pc}%;background:${c}"></div></div></div>`;
    }).join('')}</div>`;
}

// ── SETUP ──────────────────────────
function rSetup(){
  document.getElementById('mc').innerHTML=`
    <div class="card"><div class="ctitle">المشرفون</div>
      ${DB.supervisors.map((s,i)=>`<div class="srow"><div style="display:flex;align-items:center;gap:7px"><div class="av" style="width:28px;height:28px;border-radius:7px;font-size:11px;background:${gc(i)}18;color:${gc(i)}">${s.name[0]}</div><div><div style="font-size:12px;font-weight:600">${s.name}</div><div style="font-size:10px;color:var(--n4)">ميزانية:${fmt(s.budget)} · متبقي:${fmt(s.budget-gs(s.id))}${s.visa?' · فيزا:****'+s.visa.slice(-4):''}</div></div></div><button class="xb" onclick="delSup(${s.id})">✕</button></div>`).join('')}
      <div class="ar">
        <input id="nn" placeholder="اسم المشرف" style="flex:2;min-width:100px">
        <input id="nb" type="number" placeholder="الميزانية" style="max-width:90px">
        <input id="np" type="password" placeholder="الباسورد" style="max-width:90px">
        <input id="nv" placeholder="رقم الفيزا" style="flex:2;min-width:100px">
        <button class="btn bp" onclick="addSup()" style="width:auto;padding:7px 11px">+</button>
      </div>

async function addSup(){

}
async function delSup(id){if(!confirm('حذف؟'))return;await api('/api/supervisors/'+id,'DELETE');DB=await api('/api/db');rSetup();}
async function addProj(){

async function delProj(p){if(!confirm('حذف؟'))return;await api('/api/projects/'+encodeURIComponent(p),'DELETE');DB=await api('/api/db');rSetup();}
async function clearAll(){if(!confirm('مسح كل المعاملات؟'))return;for(const e of DB.entries)await api('/api/entries/'+e.id,'DELETE');DB=await api('/api/db');rSetup();}

async function savePW(){

      <div style="font-size:36px;font-weight:800;color:${rem<500?'var(--r)':'var(--gold)'}">${fmt(rem)} ﷼</div>

function fillSels(){
  ['ssup','csup'].forEach(id=>{const el=document.getElementById(id);if(el)el.innerHTML=DB.supervisors.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');});
  ['sproj','cproj'].forEach(id=>{const el=document.getElementById(id);if(el)el.innerHTML=DB.projects.map(p=>`<option>${p}</option>`).join('');});
  if(ROLE==='supervisor'&&CU){['ssup','csup'].forEach(id=>{const el=document.getElementById(id);if(el){el.value=CU.id;el.disabled=true;}});}
}
function openScan(){fillSels();document.getElementById('swrap').style.display='flex';}
function closeScan(){document.getElementById('swrap').style.display='none';resetScan();}

function compressImg(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=1600;let w=img.width,h=img.height;
        if(w>MAX||h>MAX){const ratio=Math.min(MAX/w,MAX/h);w=Math.round(w*ratio);h=Math.round(h*ratio);}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        const src=cv.toDataURL('image/jpeg',.92);
        res({b64:src.split(',')[1],src});
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(file);
  });
}

async function pickFile(inp){
  const file=inp.files[0];if(!file)return;
  const {b64,src}=await compressImg(file);
  imgB64=b64;imgSrc=src;
  const p=document.getElementById('sprev');p.src=src;p.style.display='block';
  document.getElementById('sdrop').style.display='none';
}

async function runAI(){
  const txt=(document.getElementById('stxt')?.value||'').trim();
  const err=document.getElementById('serr');
  if(!imgB64&&!txt){err.style.display='block';err.textContent='يرجى رفع صورة أو كتابة نص';return;}
  err.style.display='none';
  document.getElementById('ss1').style.display='none';
  const ldg=document.getElementById('sldg');ldg.style.display='block';
  document.getElementById('ltxt').textContent=imgB64?'جاري قراءة الصورة...':'جاري تحليل النص...';
  try{
    const params={text:txt};if(imgB64)params.b64=imgB64;
    const result=await api('/api/analyze','POST',params);
    if(result.error)throw new Error(result.error);
    parsed=result;ldg.style.display='none';showResult();
  }catch(e){
    ldg.style.display='none';
    document.getElementById('ss1').style.display='block';
    err.style.display='block';
    err.textContent='خطأ: '+(e.message||'حاول مرة أخرى');
  }
}

function showResult(){
  document.getElementById('ss2').style.display='block';
  if(imgSrc){const p=document.getElementById('sprev2');p.src=imgSrc;p.style.display='block';}
  document.getElementById('rfields').innerHTML=`
    <div class="fr"><span style="color:var(--n4)">الوصف</span><span style="font-weight:600">${parsed.desc||'—'}</span></div>
    <div class="fr"><span style="color:var(--n4)">المورد</span><span>${parsed.supplier||'—'}</span></div>
    <div class="fr"><span style="color:var(--n4)">رقم الفاتورة</span><span>${parsed.invoiceNo||'—'}</span></div>
    <div class="fr"><span style="color:var(--n4)">التاريخ</span><span>${parsed.date}</span></div>
    <div class="fr"><span style="color:var(--n4)">النوع</span>${tb(parsed.type)}</div>
    <div class="fr"><span style="color:var(--n4)">الدفع</span>${pb(parsed.payMethod)}</div>
    <div class="sep"></div>
    <div class="fr"><span style="color:var(--n4)">قبل الضريبة</span><span>${fmt(parsed.subtotal)} ﷼</span></div>
    <div class="fr"><span style="color:var(--n4)">ضريبة ${parsed.taxRate||0}%</span><span>${fmt(parsed.taxAmt)} ﷼</span></div>
    <div class="tbox"><span style="font-size:12px;opacity:.85">الإجمالي</span><span style="font-size:17px;font-weight:700">${fmt(parsed.total)} ﷼</span></div>`;
  if(parsed.items?.length){
    document.getElementById('icard').style.display='block';
    document.getElementById('ilist').innerHTML=parsed.items.map(it=>`<div class="chip"><div style="font-size:12px;font-weight:600">${it.desc}</div><div style="font-size:11px;color:var(--n4);margin-top:2px">${it.qty} ${it.unit} × ${fmt(it.unitPrice)} ﷼ = <strong>${fmt(it.total)} ﷼</strong></div></div>`).join('');
  }
  const ss=document.getElementById('ssup'),cs=document.getElementById('csup');
  if(ss&&cs&&!cs.disabled)cs.value=ss.value;
  const sp=document.getElementById('sproj'),cp=document.getElementById('cproj');
  if(sp&&cp)cp.value=sp.value;
}

async function saveEntry(){
  const supId=parseInt(document.getElementById('csup').value);
  const project=document.getElementById('cproj').value;
  const supName=DB.supervisors.find(s=>s.id==supId)?.name||'';
  const entry={supId,supName,project,type:parsed.type||'petty',desc:parsed.desc||'فاتورة',supplier:parsed.supplier||'',invoiceNo:parsed.invoiceNo||'',date:parsed.date||today(),payMethod:parsed.payMethod||'cash',subtotal:parsed.subtotal||0,taxRate:parsed.taxRate||0,taxAmt:parsed.taxAmt||0,total:parsed.total||parsed.subtotal||0,items:parsed.items||[]};
  document.getElementById('ss2').style.display='none';
  document.getElementById('sldg').style.display='block';
  document.getElementById('ltxt').textContent='جاري الحفظ...';
  try{
    await api('/api/entries','POST',entry);
    DB=await api('/api/db');
    document.getElementById('sldg').style.display='none';
    document.getElementById('sdone').style.display='block';
    document.getElementById('dsum').innerHTML=`${parsed.desc} · ${project}<br><strong style="color:var(--gold)">${fmt(parsed.total)} ﷼</strong>`;
    if(ROLE==='supervisor')rHome();else rDash();
  }catch(e){
    document.getElementById('sldg').style.display='none';
    document.getElementById('ss2').style.display='block';
    document.getElementById('serr').style.display='block';
    document.getElementById('serr').textContent='خطأ في الحفظ';
  }
}

function resetScan(){
  imgB64=null;imgSrc=null;parsed=null;
  document.getElementById('sfile').value='';
  ['sprev','sprev2'].forEach(id=>{const el=document.getElementById(id);if(el){el.style.display='none';el.src='';}});
  document.getElementById('sdrop').style.display='block';
  document.getElementById('stxt').value='';
  document.getElementById('serr').style.display='none';
  document.getElementById('icard').style.display='none';
  document.getElementById('ss1').style.display='block';
  document.getElementById('ss2').style.display='none';
  document.getElementById('sldg').style.display='none';
  document.getElementById('sdone').style.display='none';
}

// SERVICE WORKER
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});

// START
initTheme();
start();
</script>
