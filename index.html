<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>مصروفات كيان</title>
<style>
:root{--g:#b8860b;--gl:#f5f0e8;--gd:#8a6000;--b:#1d4ed8;--bl:#dbeafe;--r:#dc2626;--rl:#fee2e2;--a:#d97706;--al:#fef3c7;--pu:#7c3aed;--pul:#ede9fe;--n1:#f8fafc;--n2:#f1f5f9;--n3:#e2e8f0;--n4:#94a3b8;--n5:#64748b;--n9:#0f172a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Segoe UI',Tahoma,Arial,sans-serif;direction:rtl;background:var(--n1);color:var(--n9);font-size:14px}
/* LOGIN */
.lw{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#065c42,#0a7c5c,#1d9e75);padding:20px}
.lc{background:#fff;border-radius:18px;padding:2rem 1.5rem;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.logo{text-align:center;margin-bottom:24px}
.logo-icon{width:56px;height:56px;background:var(--gl);border-radius:14px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center}
.logo h1{font-size:16px;font-weight:700}
.logo p{font-size:12px;color:var(--n4);margin-top:3px}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
.rb{padding:13px;border:2px solid var(--n3);border-radius:11px;cursor:pointer;text-align:center;background:#fff;font-family:inherit;transition:.15s}
.rb:hover,.rb.sel{border-color:var(--g);background:var(--gl)}
.rb svg{display:block;margin:0 auto 5px}
.rb span{font-size:12px;font-weight:600;color:var(--n7)}
.rb.sel span{color:var(--g)}
/* APP */
.topbar{background:#fff;border-bottom:1px solid var(--n3);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--n3);padding:0 10px;position:sticky;top:52px;z-index:50;overflow-x:auto}
.tab{padding:10px 12px;border:none;background:none;font-family:inherit;font-size:12px;color:var(--n4);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.on{color:var(--g);border-bottom-color:var(--g);font-weight:600}
.pane{display:none;padding:12px}.pane.on{display:block}
.card{background:#fff;border:1px solid var(--n3);border-radius:12px;padding:13px 15px;margin-bottom:11px}
.ctitle{font-size:13px;font-weight:600;color:var(--n5);margin-bottom:11px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px}
.stat{background:#fff;border:1px solid var(--n3);border-radius:10px;padding:11px 13px}
.sl{font-size:11px;color:var(--n4);margin-bottom:2px}
.sv{font-size:18px;font-weight:700}
label.lbl{font-size:12px;font-weight:500;color:var(--n5);display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:8px 11px;border:1.5px solid var(--n3);border-radius:7px;font-size:13px;font-family:inherit;color:var(--n9);background:#fff;outline:none;direction:rtl;box-sizing:border-box}
input:focus,select:focus,textarea:focus{border-color:var(--g)}
textarea{resize:none;min-height:65px}
.fg{margin-bottom:9px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:inherit;width:100%;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--g);color:#fff}
.btn.s{background:var(--n2);color:var(--n5)}
.btn.d{background:var(--rl);color:var(--r);width:auto}
.btn.ex{background:#217346;color:#fff}
.brow{display:flex;gap:7px;margin-top:8px}
.brow .btn{flex:1}
.drop{border:2px dashed var(--n3);border-radius:10px;padding:22px 14px;text-align:center;cursor:pointer;background:var(--n1);margin-bottom:9px;transition:.15s}
.drop:hover{border-color:var(--g);background:var(--gl)}
.drop svg{margin:0 auto 7px;display:block}
.iprev{width:100%;border-radius:8px;max-height:160px;object-fit:cover;margin-bottom:9px;display:none;border:1px solid var(--n3)}
.spin{width:28px;height:28px;border:3px solid var(--n3);border-top-color:var(--g);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.ldg{text-align:center;padding:3rem;display:none}
.ok{background:var(--gl);border-radius:7px;padding:9px 12px;font-size:12px;color:var(--gd);font-weight:500;margin-bottom:9px;display:flex;align-items:center;gap:6px}
.err{background:var(--rl);border-radius:7px;padding:9px 12px;font-size:12px;color:var(--r);margin-bottom:8px;display:none}
.badge{display:inline-block;padding:2px 8px;border-radius:14px;font-size:11px;font-weight:600}
.bp{background:var(--gl);color:var(--gd)}.bt{background:var(--bl);color:var(--b)}.bo{background:var(--n2);color:var(--n5)}.bc{background:var(--al);color:var(--a)}.btr{background:var(--pul);color:var(--pu)}
.pbar{height:5px;background:var(--n2);border-radius:3px;overflow:hidden;margin-top:5px}
.pf{height:100%;border-radius:3px}
.fr{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--n2);font-size:13px}
.fr:last-child{border-bottom:none}
.tbox{background:var(--g);color:#fff;border-radius:9px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:9px}
.txr{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--n2)}
.txr:last-child{border-bottom:none}
.av{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.ftabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.ftab{padding:4px 11px;border-radius:14px;border:1.5px solid var(--n3);background:#fff;font-family:inherit;font-size:11px;cursor:pointer}
.ftab.on{background:var(--g);color:#fff;border-color:var(--g)}
.srow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--n2)}
.srow:last-child{border-bottom:none}
.xbtn{border:none;background:none;color:var(--n4);cursor:pointer;font-size:16px;padding:3px}
.addrow{display:flex;gap:6px;margin-top:9px}
.addrow input{flex:1}
.addrow .btn{width:auto;padding:8px 11px}
.empty{text-align:center;padding:2.5rem;color:var(--n4);font-size:13px}
.sep{height:1px;background:var(--n2);margin:8px 0}
.chip{background:var(--n2);border-radius:6px;padding:6px 9px;margin-bottom:5px}
.sup-card{background:#fff;border:1px solid var(--n3);border-radius:11px;padding:11px 13px;margin-bottom:9px}
.shdr{font-size:11px;font-weight:600;color:var(--n4);margin-bottom:7px;margin-top:3px}
.pw-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--n2)}
.pw-row:last-child{border-bottom:none}
.pw-row label{flex:1;font-size:13px;font-weight:500}
.pw-row input{max-width:140px}

/* ── DARK MODE ── */
:root {
  --kayan-gold: #b8860b;
  --kayan-brown: #3a210a;
  --kayan-gold-light: #d4a843;
}
[data-theme="dark"] {
  --n1: #0f0f0f;
  --n2: #1a1a1a;
  --n3: #2a2a2a;
  --n4: #888;
  --n5: #aaa;
  --n9: #f0f0f0;
  --g: #b8860b;
  --gl: #2a1f0a;
  --gd: #d4a843;
}
[data-theme="dark"] .topbar,
[data-theme="dark"] .tabs,
[data-theme="dark"] .card,
[data-theme="dark"] .stat,
[data-theme="dark"] .sup-card,
[data-theme="dark"] .lc {
  background: #1a1a1a !important;
  border-color: #2a2a2a !important;
}
[data-theme="dark"] body { background: #0f0f0f; }
[data-theme="dark"] input,
[data-theme="dark"] select,
[data-theme="dark"] textarea {
  background: #1a1a1a;
  border-color: #2a2a2a;
  color: #f0f0f0;
}
[data-theme="dark"] .lw {
  background: linear-gradient(135deg, #1a0f05, #3a210a, #5a3315);
}
[data-theme="dark"] .tab { color: #666; }
[data-theme="dark"] .tab.on { color: #b8860b; border-bottom-color: #b8860b; }
[data-theme="dark"] .btn.p { background: #b8860b; }
[data-theme="dark"] .ftab.on { background: #b8860b; border-color: #b8860b; }
[data-theme="dark"] .tbox { background: #b8860b; }
[data-theme="dark"] .rb.sel { border-color: #b8860b; background: #2a1f0a; }
[data-theme="dark"] .ok { background: #2a1f0a; }
[data-theme="dark"] .btn.ex { background: #1a4a2a; }
.theme-toggle {
  border: 1px solid var(--n3);
  border-radius: 7px;
  padding: 5px 9px;
  background: none;
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
}
</style>

<script>
const COLORS=['#0a7c5c','#1d4ed8','#9333ea','#d97706','#dc2626','#0891b2'];
let DB={supervisors:[],projects:[],entries:[]};
let CU=null,ROLE=null,SR=null;
let imgB64=null,imgSrc=null,parsed=null;
let fType='all';

async function api(path,method='GET',body=null){
  const opts={method,headers:{'Content-Type':'application/json'}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(path,opts);
  return r.json();
}

function fmt(n){return Number(n||0).toLocaleString('ar-SA');}
function today(){return new Date().toISOString().split('T')[0];}
function tl(t){return t==='petty'?'نثرية':t==='tax'?'ضريبية':'أخرى';}
function pl(p){return p==='cash'?'كاش':'تحويل';}
function tb(t){return `<span class="badge b${t==='petty'?'p':t==='tax'?'t':'o'}">${tl(t)}</span>`;}
function pb(p){return `<span class="badge b${p==='cash'?'c':'tr'}">${pl(p)}</span>`;}
function gs(id){return DB.entries.filter(e=>e.supId==id).reduce((a,e)=>a+(e.total||0),0);}
function gn(id){return DB.supervisors.find(s=>s.id==id)?.name||'—';}
function gc(i){return COLORS[i%COLORS.length];}

// ── LOGIN ──────────────────────────────────────
function selRole(r){
  SR=r;
  document.querySelectorAll('.rb').forEach(b=>b.classList.remove('sel'));
  document.getElementById('rb-'+(r==='supervisor'?'sup':'mgr')).classList.add('sel');
  const g=document.getElementById('sup-grp');
  if(r==='supervisor'){
    const s=document.getElementById('sup-sel');
    s.innerHTML='<option value="">اختر...</option>'+DB.supervisors.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');
    g.style.display='block';
  } else g.style.display='none';
}

async function doLogin(){
  const err=document.getElementById('lerr');
  const pw=document.getElementById('pw-inp').value;
  if(!SR){err.style.display='block';err.textContent='اختر صفتك أولاً';return;}
  if(!pw){err.style.display='block';err.textContent='أدخل كلمة المرور';return;}
  const body={role:SR,password:pw};
  if(SR==='supervisor'){
    const id=document.getElementById('sup-sel').value;
    if(!id){err.style.display='block';err.textContent='اختر اسمك';return;}
    body.supId=parseInt(id);
  }
  try{
    const res=await api('/api/login','POST',body);
    if(!res.ok){err.style.display='block';err.textContent=res.error||'كلمة المرور خاطئة';return;}
    err.style.display='none';
    CU={id:res.supId||0,name:res.name,budget:res.budget||0};
    ROLE=res.role;
    document.getElementById('lview').style.display='none';
    document.getElementById('aview').style.display='block';

    ROLE==='manager'?renderDash():renderSupHome();

}

function compressImg(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=e=>{const img=new Image();img.onload=()=>{const MAX=1024;let w=img.width,h=img.height;if(w>MAX||h>MAX){const ratio=Math.min(MAX/w,MAX/h);w=Math.round(w*ratio);h=Math.round(h*ratio);}const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);const src=cv.toDataURL('image/jpeg',.85);res({b64:src.split(',')[1],src});};img.src=e.target.result;};
    r.readAsDataURL(file);
  });
}
async function pickFile(inp){
  const file=inp.files[0];if(!file)return;
  const {b64,src}=await compressImg(file);
  imgB64=b64;imgSrc=src;
  const p=document.getElementById('sprev');p.src=src;p.style.display='block';
  document.getElementById('sdrop').style.display='none';
}
async function runAI(){
  const txt=(document.getElementById('stxt')?.value||'').trim();
  const err=document.getElementById('serr');
  if(!imgB64&&!txt){err.style.display='block';err.textContent='يرجى رفع صورة أو كتابة نص';return;}
  err.style.display='none';
  document.getElementById('ss1').style.display='none';
  const ldg=document.getElementById('sldg');ldg.style.display='block';
  document.getElementById('ltxt').textContent=imgB64?'جاري قراءة الصورة...':'جاري تحليل النص...';
  try{
    const params={text:txt};
    if(imgB64)params.b64=imgB64;
    const result=await api('/api/analyze','POST',params);
    if(result.error)throw new Error(result.error);
    parsed=result;
    ldg.style.display='none';
    showResult();
  }catch(e){
    ldg.style.display='none';
    document.getElementById('ss1').style.display='block';
    err.style.display='block';
    err.textContent='خطأ: '+(e.message||'حاول مرة أخرى');
  }
}
function showResult(){
  document.getElementById('ss2').style.display='block';
  if(imgSrc){const p=document.getElementById('sprev2');p.src=imgSrc;p.style.display='block';}
  document.getElementById('rfields').innerHTML=`
    <div class="fr"><span style="color:var(--n4)">الوصف</span><span style="font-weight:600">${parsed.desc||'—'}</span></div>
    <div class="fr"><span style="color:var(--n4)">المورد</span><span>${parsed.supplier||'—'}</span></div>
    <div class="fr"><span style="color:var(--n4)">رقم الفاتورة</span><span>${parsed.invoiceNo||'—'}</span></div>
    <div class="fr"><span style="color:var(--n4)">التاريخ</span><span>${parsed.date}</span></div>
    <div class="fr"><span style="color:var(--n4)">النوع</span>${tb(parsed.type)}</div>
    <div class="fr"><span style="color:var(--n4)">الدفع</span>${pb(parsed.payMethod)}</div>
    <div class="sep"></div>
    <div class="fr"><span style="color:var(--n4)">قبل الضريبة</span><span>${fmt(parsed.subtotal)} ﷼</span></div>
    <div class="fr"><span style="color:var(--n4)">ضريبة ${parsed.taxRate||0}%</span><span>${fmt(parsed.taxAmt)} ﷼</span></div>
    <div class="tbox"><span style="font-size:12px;opacity:.85">الإجمالي</span><span style="font-size:17px;font-weight:700">${fmt(parsed.total)} ﷼</span></div>`;
  if(parsed.items&&parsed.items.length){
    document.getElementById('icard').style.display='block';
    document.getElementById('ilist').innerHTML=parsed.items.map(it=>`<div class="chip"><div style="font-size:12px;font-weight:600">${it.desc}</div><div style="font-size:11px;color:var(--n4);margin-top:2px">${it.qty} ${it.unit} × ${fmt(it.unitPrice)} ﷼ = <strong>${fmt(it.total)} ﷼</strong></div></div>`).join('');
  }
  const ss=document.getElementById('ssup'),cs=document.getElementById('csup');
  if(ss&&cs&&!cs.disabled)cs.value=ss.value;
  const sp=document.getElementById('sproj'),cp=document.getElementById('cproj');
  if(sp&&cp)cp.value=sp.value;
}
async function saveEntry(){
  const supId=parseInt(document.getElementById('csup').value);
  const project=document.getElementById('cproj').value;
  const supName=DB.supervisors.find(s=>s.id==supId)?.name||'';
  const entry={supId,supName,project,type:parsed.type||'petty',desc:parsed.desc||'فاتورة',supplier:parsed.supplier||'',invoiceNo:parsed.invoiceNo||'',date:parsed.date||today(),payMethod:parsed.payMethod||'cash',subtotal:parsed.subtotal||0,taxRate:parsed.taxRate||0,taxAmt:parsed.taxAmt||0,total:parsed.total||parsed.subtotal||0,items:parsed.items||[]};
  document.getElementById('ss2').style.display='none';
  document.getElementById('sldg').style.display='block';
  document.getElementById('ltxt').textContent='جاري الحفظ...';
  try{
    await api('/api/entries','POST',entry);
    DB=await api('/api/db');
    document.getElementById('sldg').style.display='none';
    document.getElementById('sdone').style.display='block';
    document.getElementById('dsum').innerHTML=`${parsed.desc} · ${project}<br><strong style="color:var(--g)">${fmt(parsed.total)} ﷼</strong>`;
    if(ROLE==='supervisor')renderSupHome();else renderDash();
  }catch(e){
    document.getElementById('sldg').style.display='none';
    document.getElementById('ss2').style.display='block';
    document.getElementById('serr').style.display='block';
    document.getElementById('serr').textContent='خطأ في الحفظ';
  }
}
function resetScan(){
  imgB64=null;imgSrc=null;parsed=null;
  document.getElementById('sfile').value='';
  ['sprev','sprev2'].forEach(id=>{const el=document.getElementById(id);if(el){el.style.display='none';el.src='';}});
  document.getElementById('sdrop').style.display='block';
  document.getElementById('stxt').value='';
  document.getElementById('serr').style.display='none';
  document.getElementById('icard').style.display='none';
  document.getElementById('ss1').style.display='block';
  document.getElementById('ss2').style.display='none';
  document.getElementById('sldg').style.display='none';
  document.getElementById('sdone').style.display='none';
}


// ── DARK MODE ──────────────────────────────
function initTheme(){
  const saved = localStorage.getItem('kayan_theme') || 
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  setTheme(saved);
}
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('kayan_theme', t);
  const btn = document.getElementById('theme-btn');
  if(btn) btn.textContent = t === 'dark' ? '☀️' : '🌙';
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  setTheme(cur === 'dark' ? 'light' : 'dark');
}
initTheme();


// Splash screen
window.addEventListener('load', () => {
  setTimeout(() => {
    const splash = document.getElementById('splash');
    if(splash){ splash.style.opacity='0'; setTimeout(()=>splash.remove(),500); }
  }, 1800);
});

// PWA Install prompt
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-btn')?.style.setProperty('display','flex');
});
function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(()=>{ deferredPrompt=null; document.getElementById('install-btn')?.style.setProperty('display','none'); });
  }
}
window.addEventListener('appinstalled', () => {
  document.getElementById('install-btn')?.style.setProperty('display','none');
});


// iOS install banner
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = window.navigator.standalone;
if(isIOS && !isStandalone && !localStorage.getItem('ios_banner_dismissed')){
  setTimeout(()=>{ document.getElementById('ios-install').style.display='block'; }, 3000);
}
document.getElementById('ios-install')?.addEventListener('click', ()=>{
  localStorage.setItem('ios_banner_dismissed','1');
});
