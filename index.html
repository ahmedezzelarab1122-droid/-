<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#b8860b">
<link rel="manifest" href="/manifest.json">
<title>مصروفات كيان</title>
<style>
:root{
  --g:#c9a84c;--gl:#fdf6e3;--gd:#a07830;
  --b:#5b3a1a;--bl:#f5ebe0;
  --r:#dc2626;--rl:#fee2e2;
  --a:#c9a84c;--al:#fdf6e3;
  --n1:#fafaf8;--n2:#f5f0e8;--n3:#e8ddd0;
  --n4:#a89880;--n5:#7a6555;--n9:#2d1a0a;
  --brown:#3d1f00;--gold:#c9a84c;--gold2:#e8c87a;--cream:#fdf6e3;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Segoe UI',Tahoma,Arial,sans-serif;direction:rtl;background:var(--n1);color:var(--n9);font-size:14px}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes bar{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* DARK */
[data-theme=dark]{--n1:#1a1208;--n2:#221808;--n3:#2e2010;--n4:#8a7560;--n5:#b09878;--n9:#f5ead8;--g:#e8c87a;--gl:#2e2010;--gd:#f0d890}
[data-theme=dark] body{background:#1a1208}
[data-theme=dark] .topbar,[data-theme=dark] .tabs,[data-theme=dark] .card,[data-theme=dark] .stat,[data-theme=dark] .sc,[data-theme=dark] .lc{background:#221808!important;border-color:#2e2010!important}
[data-theme=dark] input,[data-theme=dark] select,[data-theme=dark] textarea{background:#221808;border-color:#2e2010;color:#f5ead8}
[data-theme=dark] .lw{background:linear-gradient(135deg,#0d0800,#1a1208,#2e2010)}
[data-theme=dark] .tab{color:#6a5540}
[data-theme=dark] .tab.on{color:var(--gold);border-bottom-color:var(--gold)}
/* LAYOUT */
.topbar{background:#3d1f00;border-bottom:2px solid var(--gold);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.tabs{display:flex;background:#fdf6e3;border-bottom:2px solid var(--n3);padding:0 10px;position:sticky;top:52px;z-index:50;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 13px;border:none;background:none;font-family:inherit;font-size:12px;color:var(--n4);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.on{color:var(--brown);border-bottom-color:var(--brown);font-weight:700}
#mc{padding:12px;max-width:620px;margin:0 auto;padding-bottom:24px}
/* CARDS */
.card{background:#fff;border:1px solid var(--n3);border-radius:12px;padding:13px 15px;margin-bottom:11px;animation:fi .3s ease;box-shadow:0 1px 4px rgba(61,31,0,.06)}
.ctitle{font-size:13px;font-weight:600;color:var(--n5);margin-bottom:11px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px}
.stat{background:#fff;border:1px solid var(--n3);border-radius:10px;padding:11px 13px;border-top:2px solid var(--gold)}
.sl{font-size:11px;color:var(--n4);margin-bottom:2px}
.sv{font-size:18px;font-weight:700}
/* FORMS */
label.lbl{font-size:12px;font-weight:500;color:var(--n5);display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:8px 11px;border:1.5px solid var(--n3);border-radius:7px;font-size:13px;font-family:inherit;color:var(--n9);background:#fff;outline:none;direction:rtl;box-sizing:border-box}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:none;min-height:65px}
.fg{margin-bottom:9px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:inherit;width:100%;transition:.15s}
.btn:active{transform:scale(.97)}
.bp{background:var(--brown);color:#fff}
.bs{background:var(--n2);color:var(--n5)}
.bd{background:var(--rl);color:var(--r);width:auto}
.bx{background:#217346;color:#fff}
.brow{display:flex;gap:7px;margin-top:8px}
.brow .btn{flex:1}
/* BADGES */
.badge{display:inline-block;padding:2px 8px;border-radius:14px;font-size:11px;font-weight:600}
.bpt{background:#dcfce7;color:#166534}.btx{background:var(--bl);color:var(--b)}.bot{background:var(--n2);color:var(--n5)}.bcs{background:var(--al);color:var(--a)}.btr{background:#ede9fe;color:#7c3aed}.btransfer{background:#e0f2fe;color:#0369a1}.blabor{background:#f0fdf4;color:#166534}
/* MISC */
.pbar{height:5px;background:var(--n2);border-radius:3px;overflow:hidden;margin-top:5px}
.pf{height:100%;border-radius:3px}
.fr{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--n2);font-size:13px}
.fr:last-child{border-bottom:none}
.tbox{background:linear-gradient(135deg,#3d1f00,#6b3810);color:#fff;border:1px solid var(--gold);border-radius:9px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:9px}
.txr{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--n2)}
.txr:last-child{border-bottom:none}
.av{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.sc{background:#fff;border:1px solid var(--n3);border-radius:11px;padding:11px 13px;margin-bottom:9px}
.shdr{font-size:11px;font-weight:600;color:var(--n4);margin-bottom:7px;margin-top:3px}
.srow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--n2)}
.srow:last-child{border-bottom:none}
.xb{border:none;background:none;color:var(--n4);cursor:pointer;font-size:16px;padding:3px}
.xb:hover{color:var(--r)}
.ftabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.ftab{padding:4px 11px;border-radius:14px;border:1.5px solid var(--n3);background:#fff;font-family:inherit;font-size:11px;cursor:pointer}
.ftab.on{background:var(--brown);color:#fff;border-color:var(--brown)}
.ar{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.ar input{flex:1;min-width:80px}
.ar .btn{width:auto;padding:8px 11px}
.empty{text-align:center;padding:2.5rem;color:var(--n4);font-size:13px}
.sep{height:1px;background:var(--n2);margin:8px 0}
.chip{background:var(--n2);border-radius:6px;padding:6px 9px;margin-bottom:5px}
.ok{background:var(--gl);border-radius:7px;padding:9px 12px;font-size:12px;color:var(--gd);display:flex;align-items:center;gap:6px;margin-bottom:9px}
.err{background:var(--rl);border-radius:7px;padding:9px 12px;font-size:12px;color:var(--r);margin-bottom:8px;display:none}
.spin{width:28px;height:28px;border:3px solid var(--n3);border-top-color:var(--gold);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 10px}
.ldg{text-align:center;padding:3rem;display:none}
.drop{border:2px dashed var(--n3);border-radius:10px;padding:22px 14px;text-align:center;cursor:pointer;background:var(--n1);margin-bottom:9px;transition:.15s}
.drop:hover{border-color:var(--gold);background:var(--gl)}
.iprev{width:100%;border-radius:8px;max-height:160px;object-fit:cover;margin-bottom:9px;display:none;border:1px solid var(--n3)}
.warn{background:var(--rl);color:var(--r);border-radius:8px;padding:10px 14px;font-size:13px;font-weight:500;margin-bottom:12px}
/* LOGIN */
.lw{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#3d1f00 0%,#6b3810 40%,#c9a84c 100%);padding:20px}
.lc{background:#fff;border-radius:20px;padding:2rem 1.5rem;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(61,31,0,.4);border:1px solid #e8ddd0}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
.rb{padding:13px;border:2px solid var(--n3);border-radius:11px;cursor:pointer;text-align:center;background:#fff;font-family:inherit;transition:.15s}
.rb:hover,.rb.sel{border-color:var(--brown);background:var(--gl)}
.rb svg{display:block;margin:0 auto 5px}
.rb span{font-size:12px;font-weight:600;color:var(--n5)}
.rb.sel span{color:var(--gold)}
</style>
</head>

<script>
const COLORS=['#b8860b','#1d4ed8','#9333ea','#0a7c5c','#dc2626','#0891b2'];
let DB={supervisors:[],projects:[],entries:[]};
let CU=null,ROLE=null,SR=null;
let imgB64=null,imgSrc=null,parsed=null,fType='all';

async function api(p,m='GET',b=null){
  const o={method:m,headers:{'Content-Type':'application/json'}};
  if(b)o.body=JSON.stringify(b);
  const r=await fetch(p,o);
  return r.json();
}
const fmt=n=>{const v=Number(n||0);return v.toLocaleString('en-US',{minimumFractionDigits:v%1===0?0:2,maximumFractionDigits:2});};
const today=()=>new Date().toISOString().split('T')[0];
const tl=t=>t==='petty'?'نثرية':t==='tax'?'ضريبية':'أخرى';
const pl=p=>p==='cash'?'كاش':'تحويل';
const tb=t=>`<span class="badge b${t==='petty'?'pt':t==='tax'?'tx':'ot'}">${tl(t)}</span>`;
const pb=p=>`<span class="badge b${p==='cash'?'cs':'tr'}">${pl(p)}</span>`;
const gs=id=>DB.entries.filter(e=>e.supId==id).reduce((a,e)=>a+(e.total||0),0);
const gn=id=>DB.supervisors.find(s=>s.id==id)?.name||'—';
const gc=i=>COLORS[i%COLORS.length];

// THEME
function initTheme(){
  const t=localStorage.getItem('kayan_theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  document.documentElement.setAttribute('data-theme',t);
  const b=document.getElementById('tbtn');if(b)b.textContent=t==='dark'?'☀️':'🌙';
}
function toggleTheme(){
  const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('kayan_theme',t);
  const b=document.getElementById('tbtn');if(b)b.textContent=t==='dark'?'☀️':'🌙';
}

// PWA
let dp;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;const b=document.getElementById('ibtn');if(b)b.style.display='inline-flex';});
function installApp(){if(dp){dp.prompt();dp.userChoice.then(()=>{dp=null;const b=document.getElementById('ibtn');if(b)b.style.display='none';});}}

// SESSION
function saveSession(pw,supId){localStorage.setItem('ks',JSON.stringify({ROLE,pw,supId:supId||null}));}
async function restoreSession(){
  try{
    const s=localStorage.getItem('ks');
    if(!s)return false;
    const sess=JSON.parse(s);
    if(!sess||!sess.pw||!sess.ROLE)return false;
    const body={role:sess.ROLE,password:sess.pw};
    if(sess.supId)body.supId=parseInt(sess.supId);
    const res=await api('/api/login','POST',body);
    if(!res||!res.ok){localStorage.removeItem('ks');return false;}
    CU={id:res.supId||0,name:res.name,budget:res.budget||0};
    ROLE=res.role;
    return true;
  }catch(e){localStorage.removeItem('ks');return false;}
}

// LOGIN
async function start(){
  try{DB=await api('/api/db');}catch(e){}
  const ok=await restoreSession().catch(()=>false);
  if(ok&&CU&&ROLE){showApp();}
  else{document.getElementById('lview').style.display='flex';}
}

function selRole(r){
  SR=r;
  document.querySelectorAll('.rb').forEach(b=>b.classList.remove('sel'));
  document.getElementById('rb-'+(r==='supervisor'?'sup':'mgr')).classList.add('sel');
  const g=document.getElementById('sup-grp');
  if(r==='supervisor'){
    document.getElementById('sup-sel').innerHTML='<option value="">اختر...</option>'+DB.supervisors.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');
    g.style.display='block';
  }else g.style.display='none';
}

async function doLogin(){
  const err=document.getElementById('lerr');
  const pw=document.getElementById('pw-inp').value;
  if(!SR){err.style.display='block';err.textContent='اختر صفتك أولاً';return;}
  if(!pw){err.style.display='block';err.textContent='أدخل كلمة المرور';return;}
  const body={role:SR,password:pw};
  let supId=null;
  if(SR==='supervisor'){
    const id=document.getElementById('sup-sel').value;
    if(!id){err.style.display='block';err.textContent='اختر اسمك';return;}
    body.supId=parseInt(id);supId=parseInt(id);
  }
  try{
    const res=await api('/api/login','POST',body);
    if(!res.ok){err.style.display='block';err.textContent=res.error||'كلمة المرور خاطئة';return;}
    err.style.display='none';
    CU={id:res.supId||0,name:res.name,budget:res.budget||0};
    ROLE=res.role;
    localStorage.setItem('ks',JSON.stringify({ROLE,pw,supId}));
    showApp();
  }catch(e){err.style.display='block';err.textContent='خطأ في الاتصال';}
}

function doLogout(){
  CU=null;ROLE=null;SR=null;
  localStorage.removeItem('ks');
  document.getElementById('aview').style.display='none';
  document.getElementById('lview').style.display='flex';
  document.querySelectorAll('.rb').forEach(b=>b.classList.remove('sel'));
  document.getElementById('sup-grp').style.display='none';
  document.getElementById('pw-inp').value='';
  document.getElementById('lerr').style.display='none';
}

function showApp(){
  document.getElementById('lview').style.display='none';
  document.getElementById('aview').style.display='block';
  document.getElementById('tbname').textContent=CU.name;
  document.getElementById('tbrole').textContent=ROLE==='manager'?'مدير النظام':'مشرف';
  const items=ROLE==='manager'
    ?[['dash','لوحة التحكم'],['txns','المعاملات'],['reports','التقارير'],['setup','الإعداد'],['pws','كلمات المرور'],['transfer','التحويلات'],['labor-mgr','العمالة']]
    :[['home','الرئيسية'],['labor','تسجيل عمالة'],['hist','سجلاتي'],['bal','رصيدي']];
  document.getElementById('tabs').innerHTML=items.map(([id,lbl],i)=>`<button class="tab${i===0?' on':''}" onclick="goTab('${id}',this)">${lbl}</button>`).join('');
  ROLE==='manager'?rDash():rHome();
}

function goTab(id,btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  const map={dash:rDash,txns:rTxns,reports:rReports,setup:rSetup,pws:rPws,home:rHome,hist:rHist,bal:rBal,transfer:rTransfer,stransfer:rSTransfer,'labor-mgr':rLaborMgr,labor:rLaborSup};
  map[id]?.();
}

// ── DASHBOARD ──────────────────────
function rDash(){
  const tB=DB.supervisors.reduce((a,s)=>a+s.budget,0);
  const tS=DB.entries.filter(e=>e.type!=='budget_add'&&e.type!=='transfer').reduce((a,e)=>a+(e.total||0),0);
  const pt=DB.entries.filter(e=>e.type==='petty').reduce((a,e)=>a+(e.total||0),0);
  const tx=DB.entries.filter(e=>e.type==='tax').reduce((a,e)=>a+(e.total||0),0);
  document.getElementById('mc').innerHTML=`
    <div class="sg">
      <div class="stat"><div class="sl">إجمالي الصرف</div><div class="sv" style="color:var(--a)">${fmt(tS)} ﷼</div></div>
      <div class="stat"><div class="sl">المتبقي الكلي</div><div class="sv" style="color:var(--gold)">${fmt(tB-tS)} ﷼</div></div>
      <div class="stat"><div class="sl">نثرية</div><div class="sv" style="color:#166534">${fmt(pt)} ﷼</div></div>
      <div class="stat"><div class="sl">ضريبية</div><div class="sv" style="color:var(--b)">${fmt(tx)} ﷼</div></div>
    </div>
    <div class="shdr">حالة المشرفين</div>
    ${DB.supervisors.map((s,i)=>{
      const sp=gs(s.id),rem=s.budget-sp,pct=Math.min(100,Math.round(sp/(s.budget||1)*100));
      const pc=pct>85?'var(--r)':pct>65?'var(--a)':'var(--gold)';
      const warn=pct>80?`<div class="warn" style="font-size:12px;padding:7px 10px;margin-top:6px">⚠️ تنبيه: الرصيد اقترب من النهاية — متبقي ${fmt(rem)} ﷼</div>`:'';
      return`<div class="sc"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px"><div style="display:flex;align-items:center;gap:8px"><div class="av" style="background:${gc(i)}18;color:${gc(i)}">${s.name[0]}</div><div><div style="font-weight:600;font-size:13px">${s.name}</div><div style="font-size:10px;color:var(--n4)">${DB.entries.filter(e=>e.supId==s.id).length} معاملة · ميزانية ${fmt(s.budget)}</div></div></div><div style="text-align:left"><div style="font-size:10px;color:var(--n4)">صرف: ${fmt(sp)}</div><div style="font-size:14px;font-weight:700;color:${rem<500?'var(--r)':'var(--gold)'}">${fmt(rem)} ﷼</div></div></div><div class="pbar"><div class="pf" style="width:${pct}%;background:${pc}"></div></div>${warn}</div>`;
    }).join('')}
    <div class="shdr" style="margin-top:4px">آخر المعاملات</div>
    <div class="card">${DB.entries.slice(-5).reverse().map(e=>`<div class="txr"><div style="flex:1"><div style="font-size:13px;font-weight:600">${e.desc}</div><div style="font-size:10px;color:var(--n4);margin-top:1px">${gn(e.supId)} · ${e.project}</div></div><div style="text-align:left;flex-shrink:0;margin-right:7px">${tb(e.type)}<div style="font-size:13px;font-weight:700;color:var(--r);margin-top:2px">${fmt(e.total)} ﷼</div></div></div>`).join('')||'<div class="empty">لا توجد معاملات بعد</div>'}</div>`;
}

// ── TRANSACTIONS ──────────────────
function rTxns(){
  const sO=DB.supervisors.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
  const pO=DB.projects.map(p=>`<option>${p}</option>`).join('');
  document.getElementById('mc').innerHTML=`
    <div class="card" style="padding:10px 12px;margin-bottom:10px">
      <div style="margin-bottom:7px"><select id="fs" onchange="rfT()"><option value="all">كل المشرفين</option>${sO}</select></div>

async function restoreBackup(inp){
  const file=inp.files[0];if(!file)return;
  const status=document.getElementById('restore-status');
  
  if(!confirm('تأكيد: سيتم استبدال جميع البيانات الحالية بالنسخة الاحتياطية. هل أنت متأكد؟')){
    inp.value='';return;
  }
  
  status.style.display='block';
  status.innerHTML='<div style="background:var(--al);border-radius:7px;padding:9px 12px;font-size:12px;color:var(--a)">جاري استعادة البيانات...</div>';
  
  try{
    const text=await file.text();
    const backup=JSON.parse(text);
    const res=await api('/api/restore','POST',backup);
    
    if(res.ok){
      DB=await api('/api/db');
      status.innerHTML=`<div class="ok"><svg width="15" height="15" fill="none" stroke="var(--gd)" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>تم الاستعادة بنجاح — ${res.entries} معاملة و${res.supervisors} مشرف</div>`;
      setTimeout(()=>{rSetup();status.style.display='none';},2000);
    }else{
      status.innerHTML=`<div class="err" style="display:block">${res.error||'فشل في الاستعادة'}</div>`;
    }
  }catch(e){
    status.innerHTML=`<div class="err" style="display:block">الملف غير صحيح — تأكد أنه ملف JSON من النسخة الاحتياطية</div>`;
  }
  inp.value='';
}

function compressImg(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=1600;let w=img.width,h=img.height;
        if(w>MAX||h>MAX){const ratio=Math.min(MAX/w,MAX/h);w=Math.round(w*ratio);h=Math.round(h*ratio);}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        const src=cv.toDataURL('image/jpeg',.92);
        res({b64:src.split(',')[1],src});
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(file);
  });
}

        <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;border-top:1px solid var(--n3);padding-top:6px"><span>إجمالي التكلفة</span><span id="lc-total" style="color:var(--brown)">0 ﷼</span></div>
        <div style="font-size:11px;color:var(--n4);margin-top:4px">* للمعرفة فقط — لا تُخصم من رصيدك</div>
      </div>
      
      <div class="err" id="lab-err"></div>
      <div id="lab-ok" class="ok" style="display:none"><svg width="15" height="15" fill="none" stroke="var(--gd)" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg><span id="lab-ok-msg"></span></div>
      <button class="btn bp" onclick="submitLabor()">
        <svg width="14" height="14" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        تسجيل العمالة
      </button>
    </div>
    ${myLabor.length ? `<div class="shdr">آخر سجلات العمالة</div><div class="card">${myLabor.map(e=>`<div class="txr">
      <div style="flex:1">
        <div style="font-size:13px;font-weight:600">${e.desc}</div>
        <div style="font-size:10px;color:var(--n4)">${e.project} · ${e.date}</div>
        ${e.laborDetails?.companyNames?`<div style="font-size:10px;color:var(--n4)">شركة: ${e.laborDetails.companyNames}</div>`:''}
        ${e.laborDetails?.externalNames?`<div style="font-size:10px;color:var(--n4)">خارجي: ${e.laborDetails.externalNames}</div>`:''}
      </div>
      <div style="text-align:left;flex-shrink:0;margin-right:7px">
        <span class="badge blabor">عمالة</span>
        <div style="font-size:11px;color:var(--n5);margin-top:3px">${(e.laborDetails?.companyCount||0)}+${(e.laborDetails?.externalCount||0)} عامل</div>
      </div>
    </div>`).join('')}</div>` : ''}`;
}

let extWorkerCount = 0;
function addExtWorker(){
  extWorkerCount++;
  const id = extWorkerCount;
  const div = document.createElement('div');
  div.id = 'ext-'+id;
  div.style.cssText = 'display:flex;gap:6px;margin-bottom:7px;align-items:center';
  div.innerHTML = `
    <input type="text" placeholder="اسم العامل" id="ew-name-${id}" style="flex:2" oninput="calcLabor()">
    <select id="ew-job-${id}" style="flex:2" onchange="calcLabor()">
      <option>مليس</option><option>نجار</option><option>حداد</option>
      <option>كهربائي</option><option>سباك</option><option>دهان</option>
      <option>عامل عام</option><option>أخرى</option>
    </select>
    <button onclick="document.getElementById('ext-${id}').remove();calcLabor()" style="border:none;background:none;color:var(--r);cursor:pointer;font-size:18px;padding:0 4px">✕</button>`;
  document.getElementById('ext-workers-list').appendChild(div);
  calcLabor();
}

function calcLabor(){
  const rates = DB.laborRates || {company:100,external:150};
  const workers = DB.companyWorkers || [];
  // Count checked company workers
  const c = workers.filter(w => document.getElementById('cw-'+w.id)?.checked).length;
  // Count external workers with names
  const extList = document.querySelectorAll('[id^="ew-name-"]');
  const e = Array.from(extList).filter(el=>el.value.trim()).length;
  const ct = c * rates.company;
  const et = e * rates.external;
  const tot = ct + et;
  const calc = document.getElementById('lab-calc');
  if(tot > 0 || c > 0 || e > 0){
    calc.style.display='block';
    document.getElementById('lc-company').textContent = c + ' عامل × ' + fmt(rates.company) + ' = ' + fmt(ct) + ' ﷼';
    document.getElementById('lc-external').textContent = e + ' عامل × ' + fmt(rates.external) + ' = ' + fmt(et) + ' ﷼';
    document.getElementById('lc-total').textContent = fmt(tot) + ' ﷼';
  } else {
    calc.style.display='none';
  }
}

async function submitLabor(){
  const project = document.getElementById('lab-proj').value;
  const err = document.getElementById('lab-err');
  const ok = document.getElementById('lab-ok');
  err.style.display='none'; ok.style.display='none';
  
  // Collect present company workers
  const workers = DB.companyWorkers || [];
  const presentWorkers = workers.filter(w => document.getElementById('cw-'+w.id)?.checked).map(w=>({id:w.id,name:w.name,jobTitle:w.jobTitle}));
  
  // Collect external workers
  const extList = document.querySelectorAll('[id^="ew-name-"]');
  const externalWorkersList = Array.from(extList).map(el=>{
    const id = el.id.replace('ew-name-','');
    const name = el.value.trim();
    const jobTitle = document.getElementById('ew-job-'+id)?.value||'عامل';
    return name ? {name,jobTitle} : null;
  }).filter(Boolean);
  
  if(presentWorkers.length + externalWorkersList.length === 0){
    err.style.display='block';err.textContent='اختر عمالاً للتسجيل';return;
  }
  
  try{
    const res = await api('/api/labor','POST',{supId:CU.id,project,presentWorkers,externalWorkersList});
    if(res.error){err.style.display='block';err.textContent=res.error;return;}
    DB = await api('/api/db');
    extWorkerCount = 0;
    document.getElementById('lab-ok-msg').textContent=`تم تسجيل ${presentWorkers.length+externalWorkersList.length} عامل`;
    ok.style.display='flex';
    setTimeout(()=>{ok.style.display='none';rLaborSup();},2000);
  }catch(e){
    err.style.display='block';err.textContent='خطأ في الاتصال';
  }
}

// SERVICE WORKER
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});

// START
initTheme();
start();
</script>
